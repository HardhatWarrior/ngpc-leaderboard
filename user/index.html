<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player Stats</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<!-- Needed for auth.js's scoreHasDetail/scoreDetailHTML to expand an Over Rev submission --
     its score doc only stores the raw QR payload for upgrades/name/time, not those fields
     directly, so displaying its detail requires re-decoding via the kit's own protocol.js. -->
<script src="/overrev/protocol.js"></script>
<style>
  :root{
    --navy:#10162a; --panel:#181f3a; --panel2:#212a4d; --border:#37426e;
    --cream:#f4eedd; --dim:#93a0c9; --accent:#b23a52; --accent-ink:#fbeef1;
    --accent2:#5c8fd6; --good:#4fbf8b; --danger:#e5615a;
  }
  *{ box-sizing:border-box; } html,body{ height:auto; }
  body{
    margin:0; background:var(--navy); color:var(--cream); font-family:"IBM Plex Sans",system-ui,sans-serif;
    padding-inline:20px; padding-block:28px; display:flex; justify-content:center;
  }
  .px{ font-family:"Press Start 2P","IBM Plex Mono",monospace; }
  .tnum{ font-variant-numeric:tabular-nums; }
  #shell{ width:100%; max-width:640px; display:flex; flex-direction:column; gap:22px; }

  header{
    background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:14px; padding:22px; display:flex; align-items:center; gap:16px;
    position:relative; overflow:hidden;
  }
  header::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 85% -10%, rgba(178,58,82,.35), transparent 55%);
    pointer-events:none;
  }
  #profile-avatar{
    width:64px; height:64px; border-radius:8px; border:1px solid var(--border);
    image-rendering:pixelated; flex:none; background:var(--navy); position:relative;
  }
  .profile-info{ position:relative; display:flex; flex-direction:column; gap:4px; flex:1 1 0; min-width:0; }
  .profile-info .eyebrow{ font-size:10px; letter-spacing:.14em; color:var(--accent2); text-transform:uppercase; }
  .profile-info h1{
    margin:0; font-size:clamp(18px,4vw,24px); color:var(--cream);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px; }
  .panel h2{ margin:0 0 4px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent2); }
  .panel .hint{ margin:0 0 14px; color:var(--dim); font-size:12.5px; line-height:1.5; }

  .sub-controls{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .sub-controls-label{ font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .sub-sort-btn{
    font:inherit; width:auto; background:transparent; border:1px solid var(--border); color:var(--dim);
    border-radius:6px; padding:6px 10px; font-size:11.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  .sub-sort-btn:hover{ border-color:var(--accent2); }
  .sub-sort-btn.active{ border-color:var(--accent2); color:var(--cream); }
  .sub-sort-btn .sort-arrow{ font-size:9px; }
  /* general sibling (~), not adjacent (+): a sub-detail panel can sit between two .sub-row
     elements once a game's detail is expanded, which would otherwise break an adjacent match */
  .sub-row{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px;
    padding:10px 4px; border-radius:6px;
  }
  .sub-row ~ .sub-row{ border-top:1px solid var(--border); }
  .sub-row.has-detail{ cursor:pointer; }
  .sub-row.has-detail:hover{ background:rgba(92,143,214,.08); }
  .sub-game{ font-size:12.5px; font-weight:600; color:var(--cream); }
  .sub-when{ font-size:11px; color:var(--dim); margin-top:2px; }
  .sub-score{ font-family:"IBM Plex Mono",monospace; font-size:15px; color:var(--good); text-align:right; }
  .sub-empty{ color:var(--dim); font-size:12.5px; padding:12px 4px; }

  /* per-game expanded detail -- ported verbatim from each game's own leaderboard page (see
     auth.js's scoreDetailHTML) so a submission here looks identical to its board entry. */
  .sub-detail{ padding:2px 4px 14px; }
  .scorecard-grid{ display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin:14px 0; }
  .sc-frame{
    background:var(--navy); border:1px solid var(--border); border-radius:4px;
    padding:3px 1px 4px; text-align:center; min-width:0;
  }
  .sc-marks{
    display:flex; justify-content:center; gap:2px; min-height:11px;
    font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:600; color:var(--accent2);
  }
  .sc-marks span{ min-width:7px; }
  .sc-total{ font-size:9.5px; margin-top:3px; color:var(--cream); font-weight:600; }
  .yz-sheet{ width:100%; border-collapse:collapse; margin:14px 0; font-size:11.5px; }
  .yz-sheet td{ padding:3px 6px; border-bottom:1px solid var(--border); }
  .yz-sheet td.yz-val{ text-align:right; font-family:"IBM Plex Mono",monospace; color:var(--cream); }
  .yz-sheet tr.yz-total td{ color:var(--good); font-weight:600; border-top:1px solid var(--border); }
  .yz-sheet tr.yz-grand td{ color:var(--good); font-weight:700; font-size:13px; }
  .fk-sheet, .tk-sheet{ width:100%; border-collapse:collapse; margin:14px 0; font-size:11.5px; }
  .fk-sheet td, .tk-sheet td{ padding:3px 6px; border-bottom:1px solid var(--border); }
  .fk-sheet td.fk-val, .tk-sheet td.tk-val{ text-align:right; font-family:"IBM Plex Mono",monospace; color:var(--cream); }
  .fk-badge{ display:inline-block; font-family:"Press Start 2P",monospace; font-size:10px; padding:3px 8px; border-radius:4px; margin-top:8px; }
  .fk-badge.win{ background:rgba(79,191,139,.25); color:var(--good); }
  .fk-badge.loss{ background:rgba(229,97,90,.25); color:var(--danger); }
  .fk-badge.draw{ background:rgba(160,132,200,.25); color:var(--accent2); }
  .fk-badge.solo{ background:rgba(74,124,192,.25); color:#4a7cc0; }
  .ov-sheet{ width:100%; border-collapse:collapse; margin:14px 0; font-size:11.5px; }
  .ov-sheet td{ padding:3px 6px; border-bottom:1px solid var(--border); }
  .ov-sheet td.ov-val{ text-align:right; font-family:"IBM Plex Mono",monospace; color:var(--cream); }
  .ov-badge{ display:inline-block; font-family:"Press Start 2P",monospace; font-size:10px; padding:3px 8px; border-radius:4px; margin:8px 4px 0 0; }
  .ov-badge.won{ background:rgba(79,191,139,.25); color:var(--good); }
  .ov-badge.record{ background:rgba(63,169,220,.25); color:var(--accent2); }
  .sd-sheet, .xn-sheet{ width:100%; border-collapse:collapse; margin:14px 0; font-size:11.5px; }
  .sd-sheet td, .xn-sheet td{ padding:3px 6px; border-bottom:1px solid var(--border); }
  .sd-sheet td.sd-val, .xn-sheet td.xn-val{ text-align:right; font-family:"IBM Plex Mono",monospace; color:var(--cream); }
  .completion-badge{ color:var(--good); font-weight:600; }

  .sub-pager{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
  .sub-pager button{
    font:inherit; border:1px solid var(--border); background:transparent; color:var(--cream);
    border-radius:6px; padding:8px 14px; font-size:12px; cursor:pointer; width:auto;
  }
  .sub-pager button:disabled{ opacity:.5; cursor:not-allowed; }
  .sub-pager button:hover:not(:disabled){ border-color:var(--accent2); }
  .sub-pager .sub-page-label{ font-size:11.5px; color:var(--dim); }

  .msg{ font-size:12.5px; border-radius:8px; padding:10px 12px; }
  .msg.err{ background:rgba(229,97,90,.15); color:var(--danger); border:1px solid rgba(229,97,90,.35); }

  footer{ text-align:center; color:var(--dim); font-size:11px; }
  footer a{ color:var(--accent2); }
</style>

<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "33e146de507a4007bb50d3d54f01816b"}'></script>

</head>
<body>

<div id="shell">
  <header>
    <canvas id="profile-avatar" width="64" height="64"></canvas>
    <div class="profile-info">
      <span class="eyebrow">Player Stats</span>
      <h1 id="profile-name" class="px">&mdash;</h1>
    </div>
  </header>

  <div id="not-found-msg" hidden></div>

  <section class="panel" id="subs-panel" hidden>
    <h2>Submissions</h2>
    <p class="hint">Every score this player has submitted while signed in, across every game. Click one with a scorecard to expand it.</p>
    <div class="sub-controls">
      <span class="sub-controls-label">Sort by</span>
      <button type="button" class="sub-sort-btn" data-sort="date">Date <span class="sort-arrow"></span></button>
      <button type="button" class="sub-sort-btn" data-sort="game">Game <span class="sort-arrow"></span></button>
    </div>
    <div id="sub-status"></div>
    <div id="sub-list"></div>
    <div class="sub-pager" id="sub-pager" hidden>
      <button id="sub-prev">&larr; Prev</button>
      <span class="sub-page-label" id="sub-page-label"></span>
      <button id="sub-next">Next &rarr;</button>
    </div>
  </section>

  <footer><a href="/">&larr; All games</a></footer>
</div>

<script src="/auth.js"></script>
<script>
(function(){
  "use strict";
  const GAME_NAMES = { BW: 'Neo Bowling', TT: 'Tetris', YZ: 'Neo Yahtzee', FK: 'Farkle', '2K': '2048', OV: 'Over Rev', GD: 'Gardenia', SD: 'Sudoku', XN: 'Xenon 2' };
  const SUB_PAGE_SIZE = 10;

  const el = (id)=>document.getElementById(id);
  const notFoundMsg = el('not-found-msg');
  const subsPanel = el('subs-panel');
  const subStatus = el('sub-status');
  const subList = el('sub-list');
  const subPager = el('sub-pager');
  const subPageLabel = el('sub-page-label');
  let allSubs = [];
  let subPage = 0;
  let subSortKey = 'date';  // 'date' | 'game'
  let subSortDir = 'desc';  // 'asc' | 'desc'

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtWhen(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }

  function sortSubs(){
    allSubs.sort((a,b)=>{
      const da = a.data(), db_ = b.data();
      let cmp;
      if(subSortKey === 'game'){
        const ga = GAME_NAMES[da.game] || da.game || '';
        const gb = GAME_NAMES[db_.game] || db_.game || '';
        cmp = ga.localeCompare(gb);
        if(cmp === 0) cmp = (da.submittedAt||0) - (db_.submittedAt||0); // tie-break oldest->newest within a game
      } else {
        cmp = (da.submittedAt||0) - (db_.submittedAt||0);
      }
      return subSortDir === 'asc' ? cmp : -cmp;
    });
  }

  function updateSubSortButtons(){
    document.querySelectorAll('.sub-sort-btn').forEach(btn=>{
      const isActive = btn.dataset.sort === subSortKey;
      btn.classList.toggle('active', isActive);
      btn.querySelector('.sort-arrow').textContent = isActive ? (subSortDir==='asc' ? '▲' : '▼') : '';
    });
  }

  function setSubSort(key){
    if(subSortKey === key){
      subSortDir = subSortDir === 'asc' ? 'desc' : 'asc';
    } else {
      subSortKey = key;
      subSortDir = key === 'date' ? 'desc' : 'asc'; // newest-first by default; A-Z by default for game
    }
    sortSubs();
    subPage = 0;
    renderSubPage();
    updateSubSortButtons();
  }
  document.querySelectorAll('.sub-sort-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>setSubSort(btn.dataset.sort));
  });
  updateSubSortButtons();

  function renderSubPage(){
    const totalPages = Math.max(1, Math.ceil(allSubs.length / SUB_PAGE_SIZE));
    subPage = Math.min(subPage, totalPages-1);
    const pageItems = allSubs.slice(subPage*SUB_PAGE_SIZE, subPage*SUB_PAGE_SIZE + SUB_PAGE_SIZE);
    if(!allSubs.length){
      subList.innerHTML = '<div class="sub-empty">No submissions yet.</div>';
      subPager.hidden = true;
      return;
    }
    const A = window.NGPC_AUTH;
    subList.innerHTML = pageItems.map((d,i)=>{
      const data = d.data();
      const gameName = GAME_NAMES[data.game] || data.game || '?';
      // Matches each game's own leaderboard exactly: Bowling/Yahtzee/Farkle/2048 rows expand into
      // a click-to-reveal scorecard, Tetris instead folds its lines/level into the meta line.
      const hasDetail = A && A.scoreHasDetail(data);
      const inlineMeta = A ? A.scoreInlineMeta(data) : '';
      const whenLine = fmtWhen(data.submittedAt) + (inlineMeta ? ' · '+inlineMeta : '');
      const detailId = 'sub-detail-'+i;
      const rowHtml = '<div class="sub-row'+(hasDetail?' has-detail':'')+'"'+(hasDetail?' data-detail="'+detailId+'"':'')+'>'+
        '<div><div class="sub-game">'+escapeHtml(gameName)+'</div><div class="sub-when">'+whenLine+'</div></div>'+
        '<div class="sub-score tnum">'+escapeHtml(A ? A.scoreValueDisplay(data) : (data.score!=null?data.score:'-'))+'</div>'+
      '</div>';
      const detailHtml = hasDetail ? '<div class="sub-detail" id="'+detailId+'" hidden>'+A.scoreDetailHTML(data)+'</div>' : '';
      return rowHtml + detailHtml;
    }).join('');
    subPager.hidden = totalPages<=1;
    subPageLabel.textContent = 'Page '+(subPage+1)+' of '+totalPages;
    el('sub-prev').disabled = subPage<=0;
    el('sub-next').disabled = subPage>=totalPages-1;
  }
  el('sub-prev').addEventListener('click', ()=>{ subPage = Math.max(0, subPage-1); renderSubPage(); });
  el('sub-next').addEventListener('click', ()=>{ subPage += 1; renderSubPage(); });

  subList.addEventListener('click', (e)=>{
    const row = e.target.closest('.sub-row.has-detail');
    if(!row) return;
    const detailId = row.dataset.detail;
    if(detailId) el(detailId).hidden = !el(detailId).hidden;
  });

  // Press Start 2P is wide and USERNAME_RE allows up to 16 chars -- at the header's default
  // clamp() size a long name can outgrow the space next to the avatar, so shrink it (never wrap)
  // until it actually fits instead of letting header's overflow:hidden clip it silently.
  function fitProfileName(){
    const h1 = el('profile-name');
    h1.style.fontSize = '';
    const maxSize = parseFloat(getComputedStyle(h1).fontSize);
    const minSize = 10;
    let size = maxSize;
    h1.style.fontSize = size + 'px';
    while(size > minSize && h1.scrollWidth > h1.clientWidth){
      size -= 1;
      h1.style.fontSize = size + 'px';
    }
  }
  window.addEventListener('resize', fitProfileName);

  function showNotFound(msg){
    notFoundMsg.hidden = false;
    notFoundMsg.innerHTML = '<div class="msg err">'+escapeHtml(msg)+'</div>';
    el('profile-name').textContent = 'Not found';
  }

  async function boot(){
    const params = new URLSearchParams(location.search);
    const username = (params.get('u')||'').trim();
    if(!username){ showNotFound('No player specified — link to this page with ?u=USERNAME.'); return; }
    if(!window.NGPC_AUTH){ showNotFound('Player stats aren’t available right now (a required library failed to load).'); return; }
    const A = NGPC_AUTH;
    const usernameLower = username.toLowerCase();
    let uid;
    try{
      const nameDoc = await A.db.collection('usernames').doc(usernameLower).get();
      if(!nameDoc.exists){ showNotFound('No player found with the username "'+username+'".'); return; }
      uid = nameDoc.data().uid;
    }catch(e){
      showNotFound('Couldn’t look up that player right now — try again in a bit.');
      return;
    }
    let profile = null;
    try{
      const userDoc = await A.db.collection('users').doc(uid).get();
      if(userDoc.exists) profile = userDoc.data();
    }catch(e){ /* profile is optional decoration -- proceed without it */ }

    el('profile-name').textContent = (profile && profile.username ? profile.username : username).toUpperCase();
    fitProfileName();
    if(profile && Array.isArray(profile.avatar) && profile.avatar.length === A.AVATAR_CELLS){
      A.renderAvatarToCanvas(el('profile-avatar'), profile.avatar, 64/A.AVATAR_SIZE);
    }
    subsPanel.hidden = false;

    subStatus.textContent = 'Loading…';
    try{
      // No .orderBy() here on purpose -- pairing it with the .where('uid',...) filter needs a
      // composite index Firestore won't build automatically, so this sorts client-side instead.
      const snap = await A.db.collection('scores').where('uid','==',uid).get();
      allSubs = snap.docs.slice();
      sortSubs();
      subStatus.textContent = '';
      subPage = 0;
      renderSubPage();
    }catch(e){
      subStatus.innerHTML = '<div class="msg err">Couldn’t load submissions right now — try again in a bit.</div>';
    }
  }
  boot();
})();
</script>
</body>
</html>
