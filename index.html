<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGPC Hiscores</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/inlined/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
  :root{
    --navy:#10162a;
    --panel:#181f3a;
    --panel2:#212a4d;
    --border:#37426e;
    --cream:#f4eedd;
    --dim:#93a0c9;
    --accent:#b23a52;
    --accent-ink:#fbeef1;
    --accent2:#5c8fd6;
    --good:#4fbf8b;
    --danger:#e5615a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:auto; }
  body{
    margin:0;
    background:var(--navy);
    color:var(--cream);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    padding-inline:20px;
    padding-block:32px;
    display:flex;
    justify-content:center;
  }
  .px{ font-family:"Press Start 2P",monospace; }
  .tnum{ font-variant-numeric:tabular-nums; }

  #shell{ width:100%; max-width:880px; display:flex; flex-direction:column; gap:26px; }

  header{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  header h1{
    font-size:15px; margin:0; letter-spacing:1px; color:var(--accent2);
    text-shadow:2px 2px 0 var(--navy), 0 0 18px rgba(92,143,214,.35);
  }
  header p{ margin:0; color:var(--dim); font-size:13.5px; }

  /* ---------- player search ---------- */
  #search-wrap{ position:relative; width:100%; max-width:360px; margin:0 auto; }
  #search-username{
    display:block; width:100%; background:var(--panel); border:1px solid var(--border);
    color:var(--cream); border-radius:10px; padding:11px 14px; font:inherit; font-size:13.5px;
    box-sizing:border-box;
  }
  #search-username::placeholder{ color:var(--dim); }
  #search-username:focus{ outline:none; border-color:var(--accent2); }
  #search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:5;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:6px; max-height:280px; overflow-y:auto;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .search-result{
    display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:7px;
    text-decoration:none; color:var(--cream); font-size:13px; font-weight:600;
  }
  .search-result:hover, .search-result:focus-visible{ background:rgba(92,143,214,.14); }
  .search-avatar{
    width:24px; height:24px; border-radius:4px; border:1px solid var(--border);
    image-rendering:pixelated; flex:none; background:var(--navy);
  }
  .search-empty{ color:var(--dim); font-size:12.5px; padding:10px 8px; }

  /* ---------- recent-activity ticker ---------- */
  #ticker-wrap{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; position:relative;
  }
  #ticker-wrap::before, #ticker-wrap::after{
    content:""; position:absolute; top:0; bottom:0; width:28px; z-index:1; pointer-events:none;
  }
  #ticker-wrap::before{ left:0; background:linear-gradient(90deg,var(--panel),transparent); }
  #ticker-wrap::after{ right:0; background:linear-gradient(270deg,var(--panel),transparent); }
  #ticker-track{
    display:flex; align-items:center; gap:0; width:max-content;
    animation:ticker-scroll 40s linear infinite;
  }
  #ticker-wrap:hover #ticker-track{ animation-play-state:paused; }
  @keyframes ticker-scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .ticker-item{
    display:flex; align-items:center; gap:10px; padding:10px 22px;
    border-right:1px solid var(--border); flex:none;
  }
  .ticker-avatar{
    width:26px; height:26px; border-radius:4px; border:1px solid var(--border);
    image-rendering:pixelated; flex:none; background:var(--navy);
  }
  .ticker-who{ font-size:12.5px; font-weight:600; color:var(--cream); white-space:nowrap; }
  .ticker-who a{ color:var(--cream); text-decoration:underline; text-underline-offset:2px; }
  .ticker-who a:hover{ color:var(--accent2); }
  .ticker-game{ font-size:10.5px; color:var(--accent2); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
  /* Score+date share one line (as before), with the new relative-time line
     directly under both -- kept to 2 lines total so this column matches
     the who/game column's own 2-line height instead of growing the row. */
  .ticker-score-col{ display:flex; flex-direction:column; gap:1px; }
  .ticker-score-row{ display:flex; align-items:baseline; gap:8px; }
  .ticker-score{
    font-family:"Press Start 2P",monospace; font-size:12px; color:var(--good); white-space:nowrap;
  }
  .ticker-when{ font-size:10.5px; color:var(--dim); white-space:nowrap; }
  .ticker-relative{ font-size:9.5px; color:var(--dim); white-space:nowrap; }
  #ticker-empty{ padding:12px 16px; color:var(--dim); font-size:12.5px; }

  /* ---------- universal scan panel ---------- */
  #scan-panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px;
    display:flex; flex-direction:column; gap:2px;
  }
  #scan-panel h2{
    margin:0 0 14px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent2);
  }
  #scan-panel .hint{ color:var(--dim); font-size:12.5px; margin:0 0 12px; }

  button{
    font:inherit; border:none; border-radius:8px; padding:12px 16px; cursor:pointer;
    font-weight:600; font-size:13.5px; width:100%;
  }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover:not(:disabled){ background:#c14259; }
  .btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--cream); margin-top:8px; }
  .btn-secondary:hover:not(:disabled){ border-color:var(--accent2); }

  .scan-video-wrap{
    position:relative; aspect-ratio:16/10; border-radius:10px; overflow:hidden;
    background:#000; margin-bottom:10px; max-width:360px;
  }
  #scan-video{ width:100%; height:100%; object-fit:cover; display:block; }
  .scan-frame{
    position:absolute; inset:16% 30%; border:2px solid var(--accent2); border-radius:12px;
    box-shadow:0 0 0 999px rgba(0,0,0,.4); pointer-events:none;
  }
  .file-btn{ display:block; text-align:center; cursor:pointer; }

  .msg{ font-size:12.5px; border-radius:8px; padding:10px 12px; margin-top:12px; }
  .msg.err{ background:rgba(229,97,90,.15); color:var(--danger); border:1px solid rgba(229,97,90,.35); }
  .msg.ok{ background:rgba(79,191,139,.15); color:var(--good); border:1px solid rgba(79,191,139,.35); }

  .grid-heading{ color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.1em; }

  .grid-heading-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .sort-toggle{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .sort-status{ color:var(--dim); font-size:11px; }
  .sort-btn{
    width:auto; background:transparent; border:1px solid var(--border); color:var(--dim);
    border-radius:8px; padding:6px 12px; font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  }
  .sort-btn:hover{ border-color:var(--accent2); }
  .sort-btn.active{ border-color:var(--accent); color:var(--cream); background:rgba(178,58,82,.14); }

  .period-toggle{ display:flex; justify-content:flex-end; gap:6px; margin-top:8px; }
  .period-toggle[hidden]{ display:none; }
  .period-btn{ font-size:10.5px; padding:5px 10px; }

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:16px;
  }

  .tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
  }
  a.tile{ transition:border-color .15s, transform .15s; }
  a.tile:hover, a.tile:focus-visible{ border-color:var(--accent2); transform:translateY(-2px); }
  a.tile:focus-visible{ outline:2px solid var(--accent2); outline-offset:2px; }
  /* Coming-soon tiles render as this same <a> (so they still lay out/sort identically), just
     with no href -- cursor/pointer-events here are the visible half of that; the actual "can't
     navigate" comes from buildTile() never setting href at all, not from CSS alone. */
  a.tile.disabled{ cursor:default; }
  a.tile.disabled:hover, a.tile.disabled:focus-visible{ border-color:var(--border); transform:none; }

  .tile-art{
    background:#000;
    aspect-ratio:160/152;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tile-art img{
    width:100%; height:100%; object-fit:contain;
    image-rendering:pixelated;
  }
  .tile-art.placeholder{
    color:var(--border);
    font-size:11px;
    text-align:center;
    padding:16px;
  }

  /* Dev-status banner -- an overlay on a tile's screenshot, not baked into the image itself, so
     it tracks games/{slug}.devStatus live instead of needing a screenshot regen or markup change
     per game. Only rendered (see renderGrid() below) for devStatus 'dev' or 'beta'; 'final' gets
     no banner at all. */
  .dev-banner{
    position:absolute; left:0; right:0; bottom:0;
    color:#fff;
    font-family:"Press Start 2P",monospace;
    font-size:9px;
    letter-spacing:.06em;
    text-align:center;
    padding:7px 4px;
    pointer-events:none;
  }
  .dev-banner.dev{ background:rgba(214,158,23,.85); }
  .dev-banner.beta{ background:rgba(92,143,214,.82); }

  /* Corner ribbon -- Coming Soon / NEW / UPDATED are mutually exclusive (see buildTile()'s single
     if/else-if chain), so all three share one top-left corner instead of fighting for space.
     Size/angle tuned against "COMING SOON" (the longest of the three) so it isn't clipped by the
     tile's own overflow:hidden. */
  .corner-badge{
    position:absolute; top:16px; left:-24px;
    transform:rotate(-35deg);
    width:140px; text-align:center;
    font-family:"Press Start 2P",monospace; font-size:8px; letter-spacing:.02em;
    padding:4px 0;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .corner-badge.coming-soon{ background:rgba(55,66,110,.92); color:#fff; font-size:7px; }
  .corner-badge.new{ background:var(--accent); color:var(--accent-ink); }
  .corner-badge.updated{ background:var(--good); color:#0a1f16; }

  .tile-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; }
  .tile-name{ font-size:13.5px; font-weight:700; color:var(--cream); }
  .tile.disabled .tile-name{ color:var(--dim); opacity:.7; }

  footer{ text-align:center; color:var(--dim); font-size:11px; }
  footer a{ color:var(--accent2); }
  #traffic-counter{ text-align:center; color:var(--dim); font-size:11px; margin-top:6px; font-variant-numeric:tabular-nums; }
</style>

<body>

<div id="shell">
  <header>
    <h1 class="px">NGPC HISCORES</h1>
    <p>Scan the QR code your game shows after a completed run, or pick a game below to browse its board.</p>
  </header>

  <div id="ticker-wrap">
    <div id="ticker-track"></div>
  </div>

  <section id="scan-panel">
    <h2>Scan QR Code</h2>

    <!-- Members only -- scanning routes straight into a game's submit flow, so there's no point
         offering the camera/file picker to a signed-out visitor who'd just hit the sign-in wall
         at the far end anyway. Defaults hidden in markup (not just via JS after the fact) so it
         never flashes visible before auth state resolves. -->
    <div id="scan-signin-required">
      <p class="hint">Sign in to scan a QR code.</p>
      <button type="button" class="btn-primary" id="scan-signin-btn">Sign In</button>
    </div>

    <div id="idle-view" hidden>
      <button class="btn-primary" id="btn-scan">Scan QR Code</button>

      <div id="scan-live" hidden>
        <div class="scan-video-wrap">
          <video id="scan-video" playsinline muted></video>
          <div class="scan-frame" aria-hidden="true"></div>
        </div>
        <button class="btn-secondary" id="btn-cancel-scan">Cancel</button>
      </div>

      <div id="scan-fallback" hidden>
        <label class="btn-primary file-btn" for="scan-file">Take / choose a photo</label>
        <input type="file" accept="image/*" id="scan-file" hidden>
        <button class="btn-secondary" id="btn-cancel-fallback">Cancel</button>
      </div>

      <div id="form-msg"></div>
    </div>
  </section>

  <div class="grid-heading-row">
    <div class="grid-heading">Or browse a leaderboard directly</div>
    <div class="sort-toggle">
      <button type="button" class="sort-btn active" id="sort-recent" data-sort="recent">Most Recent</button>
      <button type="button" class="sort-btn" id="sort-active" data-sort="active">Most Active</button>
      <button type="button" class="sort-btn" id="sort-alpha" data-sort="alpha">A&ndash;Z</button>
      <span class="sort-status" id="sort-status"></span>
    </div>
  </div>

  <div class="period-toggle" id="period-toggle" hidden>
    <button type="button" class="sort-btn period-btn active" id="period-week" data-period="week">This Week</button>
    <button type="button" class="sort-btn period-btn" id="period-all" data-period="all">All Time</button>
  </div>

  <div id="grid-status" class="grid-heading" style="margin-top:-8px"></div>
  <div id="grid">
    <!-- Populated live from the games/{slug} Firestore collection -- see renderGrid() below.
         A game's own assigned developer can update its dev status and ROM from /admin/game/
         without ever touching this file; index.html only needs a change here again for something
         genuinely structural (a new game's initial listing is still an admin-side action, via
         NGPC-Admin-Scripts/seed-games.js or a future "add game" admin control). -->
  </div>

  <div class="grid-heading">Or search for a player</div>

  <div id="search-wrap">
    <input type="text" id="search-username" placeholder="Search usernames&hellip;" autocomplete="off" maxlength="16">
    <div id="search-results" hidden></div>
  </div>

  <footer><a href="/about/">About</a> &middot; &copy; 2026 Neo Geo Pocket Homebrew - www.ngpc-dev.com</footer>
  <div id="traffic-counter"></div>
</div>

<script src="/auth.js"></script>
<script>
(function(){
  "use strict";
  // Every game's on-device QR encodes a full URL whose payload's first 2-6 characters are that
  // game's own routing code (see e.g. Bowling's ngpc_qr.c QR_GAME_CODE / Tetris's main.c
  // QR_GAME_CODE) -- this is the one place that code has to be mapped to a folder, since a scan
  // done HERE (rather than on a game's own page, or via a device camera app tapping the QR's own
  // URL) hands back raw decoded text with no path to read a folder name out of. Built from the
  // same games/ fetch loadGames() already does for the tile grid (code -> slug/name) instead of a
  // hardcoded table, so a new game's routing works the moment its games/{slug} doc exists --
  // approving a submission is enough, no code edit/deploy needed for THIS part of going live
  // (the leaderboard page, play page, and score-rules validator still are -- see
  // admin/game/index.html's own build-checklist panel). Empty until loadGames() resolves; every
  // caller below only ever runs from a user action (a scan, or clicking "Most Active"), by which
  // point the games fetch that boot() kicks off first has always long since finished.
  let GAME_ROUTES = {};
  let GAME_NAMES = {};
  // code -> true once that game's own devStatus is known to be something other than
  // 'coming-soon' -- renderTicker() below uses this to keep a not-yet-public game's test scores
  // off the public homepage ticker. Deliberately fails CLOSED (a code with no entry yet reads as
  // NOT live) rather than open, so nothing coming-soon can ever flash onto the ticker even
  // briefly before this fetch resolves -- see loadGames()' own re-render of the ticker once it
  // does resolve, same self-correcting pattern GAME_NAMES already uses.
  let GAME_LIVE = {};
  // Over Rev's own scores/{doc} has no generic `score` field (ticks + course instead, see
  // overrev/index.html and overrev-leaderboard-kit/README.md) -- the ticker needs its own small
  // course-name lookup and tick-to-time formatter to show something meaningful for it, matching
  // the two fields already sitting on the doc rather than pulling in the full OverRevProtocol
  // decoder just for this. Order mirrors overrev-leaderboard-kit/catalog.json exactly.
  const OV_COURSES = ['Cypress Lane','City Circuit','Canyon Run','Coast Road','Night Works','Volcano Pass','Rice Fields','Autumn Woods','Sakura Temple','Snow Pass'];
  function formatOvTicks(ticks){
    const seconds = Math.floor(ticks/60);
    return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+'.'+String(Math.floor((ticks%60)*100/60)).padStart(2,'0');
  }

  const el = (id)=>document.getElementById(id);
  const formMsg = el('form-msg');
  const btnScan = el('btn-scan');
  const scanLive = el('scan-live');
  const scanFallback = el('scan-fallback');
  const scanVideo = el('scan-video');
  const scanFile = el('scan-file');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- game tile sorting -- "Most Recent" (default) and "A-Z" are pure client-side
     reorders of each tile's own data-added/tile-name; "Most Active" needs a real query (each
     game's submission count, either over the trailing 7 days or all-time), so each period's
     counts are fetched lazily on first use rather than on every page load, and cached per period
     for the rest of this visit (a plain reload refreshes them -- this isn't a live count like the
     ticker). One doc read per matching submission (Query.count() isn't available on this compat
     SDK build), which is cheap at this site's real volume -- "all time" reads more than "This
     Week" as the site grows, but it's still just one query per game, run once per visit. */
  let sortMode = 'recent';
  let activePeriod = 'week'; // 'week' | 'all', only meaningful while sortMode === 'active'
  const countsCache = { week: null, all: null }; // {gameCode: count} per period, null until loaded
  const gridEl = el('grid');
  const gridStatusEl = el('grid-status');
  const sortStatusEl = el('sort-status');
  const sortButtons = [el('sort-recent'), el('sort-active'), el('sort-alpha')];
  const periodToggleEl = el('period-toggle');
  const periodButtons = [el('period-week'), el('period-all')];
  const gridHeadingRowEl = document.querySelector('.grid-heading-row');
  let tileEls = [];

  // Builds one tile <a> exactly matching the markup every game page used to hand-write, from a
  // games/{slug} doc -- see firestore.rules' own comment on why the admin owns identity fields
  // (name/code/titleImage/leaderboardPath) while a game's assigned developer can only ever touch
  // devStatus/romPath/romUpdatedAt (via /admin/game/), never rename or re-route their own tile.
  function buildTile(slug, data){
    const a = document.createElement('a');
    a.className = 'tile';
    const isComingSoon = data.devStatus === 'coming-soon';
    // See loadGames()'s own comment: a doc with no `visibility` yet falls back to the old
    // `active` boolean this field replaced. 'inactive' gets the exact same unclickable treatment
    // as a coming-soon tile (still listed, just not a link); 'hidden' never reaches buildTile() at
    // all -- loadGames() filters it out of the grid entirely before rendering.
    const visibility = data.visibility || (data.active === false ? 'hidden' : 'active');
    if(isComingSoon || visibility === 'inactive'){
      // No href at all -- an <a> with no href isn't a link (not focusable via Tab, no navigation
      // on click/Enter), which is what actually makes this unclickable. The 'disabled' class is
      // just the visual half (see its CSS): removing href alone wouldn't look any different
      // without it, and adding the class alone wouldn't stop navigation without this.
      a.classList.add('disabled');
      a.setAttribute('aria-disabled', 'true');
    } else {
      a.href = data.leaderboardPath || ('/'+slug+'/');
    }
    a.dataset.game = data.code || '';
    // applySort()'s comparator parses this with new Date(string) -- an ISO string, not the raw
    // millis number, since new Date("1789870802000") is Invalid Date (NaN), not that timestamp.
    a.dataset.added = new Date(data.romUpdatedAt || data.addedAt || 0).toISOString();
    // Admin-only "Pin to top of Recent" (admin/game/index.html's own pin toggle) -- overrides the
    // normal romUpdatedAt/addedAt ordering entirely, e.g. so a ROM build pushed to an unrelated
    // game doesn't bump something the admin specifically wants to stay first. pinnedAt (not a
    // plain boolean) lets multiple pinned games still sort sensibly among themselves, by most
    // recently pinned.
    a.dataset.pinnedAt = data.pinnedAt ? new Date(data.pinnedAt).toISOString() : '';

    const art = document.createElement('div');
    art.className = 'tile-art';
    const img = document.createElement('img');
    img.src = data.titleImage || '';
    img.alt = (data.name||slug)+' title screen';
    img.width = 160; img.height = 152;
    art.appendChild(img);

    // "In Development"/"Beta" stay a bottom banner. Coming Soon / NEW / UPDATED are mutually
    // exclusive with EACH OTHER (never more than one at a time) and all live in the same top-left
    // corner ribbon -- Coming Soon takes priority while it's set (it's a devStatus, not a
    // timed flag, so it doesn't expire on its own the way NEW/UPDATED do); once a developer
    // leaves "coming soon" the game goes straight to a fresh NEW ribbon instead (see
    // admin/game/index.html's own status-change handler, which sets newUntil at that same
    // moment), so this chain never actually needs to fall through past Coming Soon in practice.
    if(data.devStatus === 'dev' || data.devStatus === 'beta'){
      const banner = document.createElement('div');
      banner.className = 'dev-banner ' + data.devStatus;
      banner.textContent = data.devStatus === 'beta' ? 'BETA' : 'IN DEVELOPMENT';
      art.appendChild(banner);
    }

    const now = Date.now();
    if(data.devStatus === 'coming-soon'){
      const ribbon = document.createElement('div');
      ribbon.className = 'corner-badge coming-soon';
      ribbon.textContent = 'COMING SOON';
      art.appendChild(ribbon);
    } else if(data.newUntil && data.newUntil > now){
      const ribbon = document.createElement('div');
      ribbon.className = 'corner-badge new';
      ribbon.textContent = 'NEW';
      art.appendChild(ribbon);
      // applySort()'s "Recent" comparator reads this to rank NEW above UPDATED above everything
      // else, on top of the pinned tiebreak -- same ribbon this ribbon shows, not a second signal.
      a.dataset.badge = 'new';
    } else if(data.updatedUntil && data.updatedUntil > now){
      const ribbon = document.createElement('div');
      ribbon.className = 'corner-badge updated';
      ribbon.textContent = 'UPDATED';
      art.appendChild(ribbon);
      a.dataset.badge = 'updated';
    }

    const body = document.createElement('div');
    body.className = 'tile-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'tile-name';
    nameEl.textContent = data.name || slug;
    body.appendChild(nameEl);

    a.appendChild(art);
    a.appendChild(body);
    return a;
  }

  function renderGrid(games){
    gridEl.innerHTML = '';
    tileEls = games.map(g=>buildTile(g.slug, g));
    tileEls.forEach(t=>gridEl.appendChild(t));
  }

  async function loadGames(){
    const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;
    if(!db){ gridStatusEl.textContent = 'Games list is unavailable right now.'; return; }
    try{
      const snap = await db.collection('games').get();
      const games = [];
      snap.forEach(doc=>games.push(Object.assign({slug:doc.id}, doc.data())));
      // See GAME_ROUTES/GAME_NAMES's own comment -- built from this same fetch instead of a
      // hardcoded table. `code` is only missing on a game that predates games/{slug} entirely
      // (shouldn't happen post-migration), so it's skipped rather than routed under 'undefined'.
      games.forEach(g=>{
        if(!g.code) return;
        GAME_ROUTES[g.code] = g.slug;
        GAME_NAMES[g.code] = g.name || g.slug;
        GAME_LIVE[g.code] = g.devStatus !== 'coming-soon';
      });
      // The ticker (connectTicker(), below) subscribes independently and starts immediately at
      // load -- its first snapshot can easily arrive before this fetch resolves, rendering with
      // GAME_NAMES still empty (falls back to the raw code, e.g. "2K" instead of "2048"). Re-run
      // it against whatever it last received once names are actually populated, so that first
      // paint self-corrects instead of staying wrong until the next live update happens to land.
      if(lastTickerDocs) renderTicker(lastTickerDocs);
      // visibility 'hidden' (admin/game/'s three-way Active/Inactive/Hidden toggle) pulls a game's
      // tile off this grid entirely while leaving everything else (leaderboard, ROM, scores)
      // untouched -- 'inactive' still renders the tile, just unclickable (see buildTile()).
      // Missing the field at all falls back to the old `active` boolean it replaced.
      renderGrid(games.filter(g=>(g.visibility || (g.active === false ? 'hidden' : 'active')) !== 'hidden'));
      gridStatusEl.textContent = '';
    }catch(e){
      gridStatusEl.textContent = 'Couldn’t load the games list right now — try refreshing.';
    }
  }

  function applySort(mode){
    const counts = countsCache[activePeriod];
    const sorted = tileEls.slice().sort((a, b)=>{
      if(mode === 'alpha'){
        return a.querySelector('.tile-name').textContent.localeCompare(b.querySelector('.tile-name').textContent);
      }
      // Pinned tiles always float to the top of "Recent" specifically -- "Most Active" is a real
      // popularity ranking an admin pin shouldn't distort, and "A-Z" is about identity, not
      // priority, so both are deliberately exempt.
      if(mode === 'recent'){
        const aPinned = !!a.dataset.pinnedAt, bPinned = !!b.dataset.pinnedAt;
        if(aPinned !== bPinned) return aPinned ? -1 : 1;
        if(aPinned && bPinned){
          const diff = new Date(b.dataset.pinnedAt) - new Date(a.dataset.pinnedAt);
          if(diff !== 0) return diff;
        }
        // Below the pinned tiles: NEW-ribboned games first, then UPDATED-ribboned, then everything
        // else -- same ribbon buildTile() already shows, just also used to rank here. Ties within
        // a tier (e.g. two NEW games) fall through to the normal added-date order below.
        const badgeRank = {new: 2, updated: 1};
        const aBadge = badgeRank[a.dataset.badge] || 0, bBadge = badgeRank[b.dataset.badge] || 0;
        if(aBadge !== bBadge) return bBadge - aBadge;
      }
      if(mode === 'active' && counts){
        const diff = (counts[b.dataset.game]||0) - (counts[a.dataset.game]||0);
        if(diff !== 0) return diff;
      }
      // Default order, and "active"'s own tiebreak (including before its counts have loaded).
      return new Date(b.dataset.added) - new Date(a.dataset.added);
    });
    sorted.forEach(tile=>gridEl.appendChild(tile));
  }

  async function loadCounts(period){
    const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;
    if(!db){ countsCache[period] = {}; return; }
    sortStatusEl.textContent = 'Loading activity…';
    const weekAgo = Date.now() - 7*24*60*60*1000;
    const counts = {};
    await Promise.all(Object.keys(GAME_ROUTES).map(async (code)=>{
      try{
        let q = db.collection('scores').where('game','==',code).where('approved','==',true);
        if(period === 'week') q = q.where('submittedAt','>=',weekAgo);
        const snap = await q.get();
        counts[code] = snap.size;
      }catch(e){ counts[code] = 0; }
    }));
    countsCache[period] = counts;
    sortStatusEl.textContent = '';
  }

  function setSort(mode){
    sortMode = mode;
    sortButtons.forEach(btn=>btn.classList.toggle('active', btn.dataset.sort === mode));
    periodToggleEl.hidden = mode !== 'active';
    if(mode === 'active' && !countsCache[activePeriod]){
      loadCounts(activePeriod).then(()=>{ if(sortMode === 'active') applySort('active'); });
    }
    applySort(mode);
  }
  sortButtons.forEach(btn=>btn.addEventListener('click', ()=>setSort(btn.dataset.sort)));

  function setPeriod(period){
    if(activePeriod === period) return;
    activePeriod = period;
    periodButtons.forEach(btn=>btn.classList.toggle('active', btn.dataset.period === period));
    if(!countsCache[period]){
      loadCounts(period).then(()=>{ if(activePeriod === period) applySort(sortMode); });
    }
    applySort(sortMode);
  }
  periodButtons.forEach(btn=>btn.addEventListener('click', ()=>setPeriod(btn.dataset.period)));

  // Same treatment lb/index.html and tetris/index.html use on their own in-page scans -- a QR's
  // raw decoded content is the FULL URL (prefix and all) when it encodes one, so this strips down
  // to just the payload either way (also a no-op for an old bare-payload QR with no URL/slashes).
  function lastPathSegment(text){
    const parts = String(text||'').split('/').filter(Boolean);
    return parts.length ? parts[parts.length-1] : '';
  }

  // Game codes are 2-6 characters (not always 2) -- a payload has no delimiter after its code,
  // so the only way to find where it ends is to check known codes longest-first against the
  // payload's own start. A code that happens to prefix a longer one (e.g. "BW" vs a hypothetical
  // "BWX") still resolves correctly this way, since the longer candidate is tried first.
  function resolveGameCode(payload, routes){
    const codes = Object.keys(routes).sort((a,b)=>b.length-a.length);
    for(const code of codes){ if(payload.startsWith(code)) return code; }
    return null;
  }

  function routeToGame(text){
    const payload = lastPathSegment(text).toUpperCase();
    const code = resolveGameCode(payload, GAME_ROUTES);
    const slug = code ? GAME_ROUTES[code] : null;
    if(!slug){
      formMsg.innerHTML = '<div class="msg err">Unrecognized game code &mdash; that leaderboard might not be set up yet.</div>';
      return;
    }
    // A real navigation, not a fetch -- lands on that game's own page, which reads the payload
    // right back out of this same hash via its own payloadFromEntry() and opens the confirm view.
    // The "?v=" cache-buster forces a fresh fetch of that page's HTML/JS instead of letting the
    // browser reuse a copy from its local disk cache (GitHub Pages serves max-age=600) -- without
    // it, testing multiple scans in a short window can silently replay stale code that doesn't
    // know about the hash-payload yet, and only a manual reload (which revalidates) fixes it.
    location.href = '/' + slug.toLowerCase() + '/?v=' + Date.now() + '#' + payload;
  }

  function handleScanResult(text){
    formMsg.innerHTML = '';
    routeToGame(text);
  }

  /* ---------- camera scan (getUserMedia), falling back to a native camera/file picker --
     identical decode stack to lb/index.html and tetris/index.html; see their own comments for
     why zbar-wasm is tried first, native BarcodeDetector second, jsQR last. ---------- */
  let cameraStream = null;
  let scanRAF = null;
  const scanCanvas = document.createElement('canvas');
  const scanCtx = scanCanvas.getContext('2d', {willReadFrequently:true});

  function resetScanUI(){
    if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
    scanLive.hidden = true;
    scanFallback.hidden = true;
    btnScan.hidden = false;
  }

  function showFallback(msg){
    if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
    scanLive.hidden = true;
    btnScan.hidden = true;
    scanFallback.hidden = false;
    if(msg) formMsg.innerHTML = '<div class="msg err">'+escapeHtml(msg)+'</div>';
  }

  function libraryMissingMsg(){
    return "QR scanning isn’t available right now (a required library failed to load) — try reloading the page.";
  }

  let barcodeDetector;
  function getBarcodeDetector(){
    if(barcodeDetector !== undefined) return barcodeDetector;
    if(!('BarcodeDetector' in window)){ barcodeDetector = null; return null; }
    try{ barcodeDetector = new window.BarcodeDetector({formats:['qr_code']}); }
    catch(e){ barcodeDetector = null; }
    return barcodeDetector;
  }
  function noDecoderAvailable(){ return !window.zbarWasm && !getBarcodeDetector() && !window.jsQR; }

  async function decodeViaZbarWasm(source, w0, h0){
    if(!window.zbarWasm || !w0 || !h0) return null;
    const target = 1000;
    const scale = Math.min(1, target/Math.max(w0,h0));
    const w = Math.round(w0*scale), h = Math.round(h0*scale);
    scanCanvas.width = w; scanCanvas.height = h;
    scanCtx.drawImage(source, 0, 0, w, h);
    const imageData = scanCtx.getImageData(0, 0, w, h);
    try{
      const symbols = await window.zbarWasm.scanImageData(imageData);
      if(symbols && symbols.length) return symbols[0].decode();
    }catch(e){ /* fall through */ }
    return null;
  }

  function jsqrFallback(source, w0, h0, scales){
    if(!window.jsQR || !w0 || !h0) return null;
    for(const target of scales){
      const scale = Math.min(1, target/Math.max(w0,h0));
      const w = Math.round(w0*scale), h = Math.round(h0*scale);
      scanCanvas.width = w; scanCanvas.height = h;
      scanCtx.drawImage(source, 0, 0, w, h);
      const frame = scanCtx.getImageData(0, 0, w, h);
      const code = window.jsQR(frame.data, w, h, {inversionAttempts:'attemptBoth'});
      if(code && code.data) return code.data;
    }
    return null;
  }

  async function decodeSource(source, w0, h0, jsqrScales){
    const viaZbar = await decodeViaZbarWasm(source, w0, h0);
    if(viaZbar) return viaZbar;
    const bd = getBarcodeDetector();
    if(bd){
      try{
        const results = await bd.detect(source);
        if(results && results.length && results[0].rawValue) return results[0].rawValue;
      }catch(e){ /* fall through to jsQR */ }
    }
    return jsqrFallback(source, w0, h0, jsqrScales);
  }

  const LIVE_SCALES = [500, 900];
  let liveBusy = false;
  async function scanLoop(){
    if(noDecoderAvailable()){
      resetScanUI();
      formMsg.innerHTML = '<div class="msg err">'+libraryMissingMsg()+'</div>';
      return;
    }
    scanRAF = requestAnimationFrame(scanLoop);
    if(scanVideo.readyState !== scanVideo.HAVE_ENOUGH_DATA) return;
    if(liveBusy) return;
    const w = scanVideo.videoWidth, h = scanVideo.videoHeight;
    if(!w || !h) return;
    liveBusy = true;
    try{
      const value = await decodeSource(scanVideo, w, h, LIVE_SCALES);
      if(value) handleScanResult(value);
    } finally { liveBusy = false; }
  }

  async function startLiveScan(){
    formMsg.innerHTML = '';
    if(noDecoderAvailable()){
      formMsg.innerHTML = '<div class="msg err">'+libraryMissingMsg()+'</div>';
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showFallback('Live camera preview isn’t supported in this browser/view (no camera API present).');
      return;
    }
    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
    }catch(e){
      const name = (e && e.name) || 'Error';
      showFallback('Live camera preview isn’t available here (' + name + ') — take a photo of the QR code instead.');
      return;
    }
    scanVideo.srcObject = cameraStream;
    try{ await scanVideo.play(); }catch(e){ /* some browsers auto-play on metadata; ignore */ }
    btnScan.hidden = true;
    scanFallback.hidden = true;
    scanLive.hidden = false;
    scanLoop();
  }

  function loadViaImageElement(file){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('img element failed to decode "'+file.type+'"')); };
      img.src = url;
    });
  }

  async function loadImage(file){
    if(window.createImageBitmap){
      try{ return await createImageBitmap(file); }
      catch(e){ /* fall through */ }
    }
    return loadViaImageElement(file);
  }

  const FILE_SCALES = [350, 500, 700, 900, 1200];

  async function scanFromFile(file){
    if(noDecoderAvailable()){
      formMsg.innerHTML = '<div class="msg err">'+libraryMissingMsg()+'</div>';
      return;
    }
    formMsg.innerHTML = '<div class="msg ok">Reading code&hellip;</div>';
    let img;
    try{ img = await loadImage(file); }
    catch(e){
      const type = file.type || 'unknown type';
      formMsg.innerHTML = '<div class="msg err">Couldn’t read that photo (' + escapeHtml(type) + ') — try again, or use a JPG/PNG if your phone saved it as something else.</div>';
      return;
    }
    if(!img.width || !img.height){
      formMsg.innerHTML = '<div class="msg err">That photo came back empty — try again.</div>';
      return;
    }
    const value = await decodeSource(img, img.width, img.height, FILE_SCALES);
    if(value){
      handleScanResult(value);
    } else {
      formMsg.innerHTML = '<div class="msg err">No QR code found in that photo (read as ' + img.width + '×' + img.height + ') — make sure the whole code is in frame, hold the console steady and avoid glare, then try again.</div>';
    }
  }

  btnScan.addEventListener('click', startLiveScan);
  el('btn-cancel-scan').addEventListener('click', resetScanUI);
  el('btn-cancel-fallback').addEventListener('click', resetScanUI);
  scanFile.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(file) scanFromFile(file);
  });

  // Members only -- gates the whole scan mechanism (camera + file fallback), not just the final
  // submit step, so a signed-out visitor never even gets a live camera feed opened for them.
  const scanSigninRequired = el('scan-signin-required');
  const idleView = el('idle-view');
  if(window.NGPC_AUTH){
    NGPC_AUTH.onAuthChange((user)=>{
      idleView.hidden = !user;
      scanSigninRequired.hidden = !!user;
      if(!user) resetScanUI();
    });
    el('scan-signin-btn').addEventListener('click', ()=>NGPC_AUTH.openSignInModal('signin'));
  }

  /* ---------- recent-activity ticker: the 10 most recent scores across every game, avatar
     included, scrolling continuously via a CSS animation on a doubled item list (so the loop
     from the end of copy 1 into the start of copy 2 is seamless). Live via onSnapshot, same
     pattern as each game's own leaderboard query. ---------- */
  function fmtTickerWhen(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  function fmtRelativeTime(ts){
    if(!ts) return '';
    const minutes = Math.floor((Date.now()-ts)/60000);
    if(minutes < 1) return 'just now';
    if(minutes < 60) return minutes+'m ago';
    const hours = Math.floor(minutes/60);
    if(hours < 24) return hours+'h ago';
    return Math.floor(hours/24)+'d ago';
  }

  async function renderTicker(allDocs){
    const trackEl = el('ticker-track');
    if(!trackEl) return;
    // See GAME_LIVE's own comment -- a coming-soon game's test scores never show here, even
    // though the query itself has no way to filter by another collection's field.
    const docs = allDocs.filter(d=>GAME_LIVE[d.data().game] === true);
    if(!docs.length){
      trackEl.style.animation = 'none';
      trackEl.innerHTML = '<div id="ticker-empty">No submissions yet &mdash; scores will appear here as they come in.</div>';
      return;
    }
    const uids = docs.map(d=>d.data().uid).filter(Boolean);
    const avatars = (window.NGPC_AUTH && uids.length) ? await NGPC_AUTH.fetchAvatars(uids) : {};
    const itemHtml = docs.map((d,i)=>{
      const data = d.data();
      const gameName = GAME_NAMES[data.game] || data.game || '?';
      const isOV = data.game === 'OV';
      const gameLine = isOV ? (gameName+' · '+(OV_COURSES[data.course]||'?')) : gameName;
      // Sudoku (time, not score) and Farkle (rounds, not score) don't fit the plain "data.score"
      // case this used to hardcode -- NGPC_AUTH.scoreValueDisplay() already knows every game's own
      // display field (see auth.js), same source every leaderboard page and the account/admin
      // "Your Submissions" lists already use, so this can't drift out of sync with them again.
      const scoreDisplay = window.NGPC_AUTH ? NGPC_AUTH.scoreValueDisplay(data) : (data.score!=null?data.score:'-');
      const who = data.username
        ? ('<a href="/user/?u='+encodeURIComponent(data.username)+'">@'+escapeHtml(data.username.toUpperCase())+'</a>')
        : escapeHtml(data.initials||'???');
      const hasAvatar = data.uid && avatars[data.uid];
      const avatarHtml = hasAvatar
        ? '<canvas class="ticker-avatar" data-ticker-avatar="'+i+'"></canvas>'
        : '<div class="ticker-avatar"></div>';
      return '<div class="ticker-item">'+
        avatarHtml+
        '<div><div class="ticker-who">'+who+'</div><div class="ticker-game">'+escapeHtml(gameLine)+'</div></div>'+
        '<div class="ticker-score-col">'+
          '<div class="ticker-score-row"><div class="ticker-score tnum">'+escapeHtml(String(scoreDisplay))+'</div>'+
          '<div class="ticker-when">'+fmtTickerWhen(data.submittedAt)+'</div></div>'+
          '<div class="ticker-relative">'+fmtRelativeTime(data.submittedAt)+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
    // Doubled so translateX(-50%) lands exactly back on an identical copy -- an invisible seam.
    trackEl.style.animation = '';
    trackEl.innerHTML = itemHtml + itemHtml;
    docs.forEach((d,i)=>{
      const data = d.data();
      if(!data.uid || !avatars[data.uid]) return;
      trackEl.querySelectorAll('[data-ticker-avatar="'+i+'"]').forEach(canvasEl=>{
        NGPC_AUTH.renderAvatarToCanvas(canvasEl, avatars[data.uid], 26/NGPC_AUTH.AVATAR_SIZE);
      });
    });
  }

  // Cached so loadGames() can re-render the ticker once GAME_NAMES is actually populated --
  // see its own comment. null until the first snapshot arrives.
  let lastTickerDocs = null;

  function connectTicker(){
    const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;
    if(!db) return;
    db.collection('scores').where('approved','==',true).orderBy('submittedAt','desc').limit(10).onSnapshot(
      (snap)=>{ lastTickerDocs = snap.docs; renderTicker(snap.docs); },
      (err)=>{ /* ticker is decorative -- a live-query failure just leaves it as-is, no error UI */ }
    );
  }
  connectTicker();

  // Admin-only testing switch (meta/siteSettings.hideGamesGrid, toggled from admin/index.html) --
  // hides the whole games grid section, for every visitor including the admin themselves, so
  // "what does the public actually see" can be checked directly rather than guessed at. Reads
  // once at load: this is a manual testing toggle, not something that needs to react live if
  // flipped in another tab.
  (async function initGamesGrid(){
    const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;
    let hideGrid = false;
    if(db){
      try{
        const snap = await db.collection('meta').doc('siteSettings').get();
        hideGrid = !!(snap.exists && snap.data().hideGamesGrid);
      }catch(e){ /* default to showing the grid if this read fails */ }
    }
    if(hideGrid){
      if(gridHeadingRowEl) gridHeadingRowEl.hidden = true;
      periodToggleEl.hidden = true;
      gridStatusEl.hidden = true;
      gridEl.hidden = true;
      return;
    }
    loadGames().then(()=> applySort(sortMode));
  })();

  /* ---------- player search -- typeahead over the usernames/{lower} reservation collection.
     Its document ID *is* the lowercased username (see auth.js's signUp/updateUsername), so a
     plain range query on FieldPath.documentId() gives a real prefix search with no extra index
     or service: >= "bob" and < "bob" matches every reservation starting with "bob". Each
     match's display-case username + avatar comes from a second batched users/ lookup, same
     pattern as the ticker's own avatar fetch. ---------- */
  function connectPlayerSearch(){
    const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;
    const input = el('search-username');
    const results = el('search-results');
    if(!input || !results) return;

    let seq = 0; // guards a slow older query's results from clobbering a newer keystroke's
    function hideResults(){ results.hidden = true; results.innerHTML = ''; }

    async function runSearch(raw){
      const prefix = raw.trim().toLowerCase();
      const mySeq = ++seq;
      if(!prefix){ hideResults(); return; }
      if(!db){ return; }
      let snap;
      try{
        snap = await db.collection('usernames')
          .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
          .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '')
          .limit(8)
          .get();
      }catch(e){ return; }
      if(mySeq !== seq) return;
      if(snap.empty){
        results.innerHTML = '<div class="search-empty">No matching usernames.</div>';
        results.hidden = false;
        return;
      }
      const uids = snap.docs.map(d=>d.data().uid).filter(Boolean);
      let profiles = {};
      if(uids.length){
        try{
          const usersSnap = await db.collection('users').where(firebase.firestore.FieldPath.documentId(),'in',uids).get();
          usersSnap.forEach(d=>{ profiles[d.id] = d.data(); });
        }catch(e){ /* fall back to each reservation's own lowercase id below */ }
      }
      if(mySeq !== seq) return;
      const avatars = (window.NGPC_AUTH && uids.length) ? await NGPC_AUTH.fetchAvatars(uids) : {};
      if(mySeq !== seq) return;
      results.innerHTML = snap.docs.map((d,i)=>{
        const uid = d.data().uid;
        const profile = profiles[uid];
        const displayName = (profile && profile.username) ? profile.username : d.id;
        const hasAvatar = uid && avatars[uid];
        const avatarHtml = hasAvatar
          ? '<canvas class="search-avatar" data-search-avatar="'+i+'"></canvas>'
          : '<div class="search-avatar"></div>';
        return '<a class="search-result" href="/user/?u='+encodeURIComponent(displayName)+'">'+avatarHtml+'<span>@'+escapeHtml(displayName.toUpperCase())+'</span></a>';
      }).join('');
      results.hidden = false;
      snap.docs.forEach((d,i)=>{
        const uid = d.data().uid;
        if(!uid || !avatars[uid]) return;
        results.querySelectorAll('[data-search-avatar="'+i+'"]').forEach(canvasEl=>{
          NGPC_AUTH.renderAvatarToCanvas(canvasEl, avatars[uid], 24/NGPC_AUTH.AVATAR_SIZE);
        });
      });
    }

    let debounceTimer = null;
    input.addEventListener('input', ()=>{
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(()=>runSearch(input.value), 250);
    });
    input.addEventListener('focus', ()=>{ if(input.value.trim()) runSearch(input.value); });
    input.addEventListener('keydown', (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const first = results.querySelector('.search-result');
      if(first) location.href = first.getAttribute('href');
      else if(input.value.trim()) location.href = '/user/?u='+encodeURIComponent(input.value.trim());
    });
    document.addEventListener('click', (e)=>{
      if(!e.target.closest('#search-wrap')) hideResults();
    });
  }
  connectPlayerSearch();

  /* ---------- page traffic counter -- meta/siteStats is a single pre-seeded doc (see
     firestore.rules; a client can never create it, only atomically +1 its one pageViews field),
     so this is a raw "how many times has this page loaded" count, not a deduped unique-visitor
     count -- there's no server backend here to do real dedup/anti-abuse beyond that +1-per-write
     rule, and every load (including a plain refresh) counts on purpose. ---------- */
  function connectTrafficCounter(){
    const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;
    const counterEl = el('traffic-counter');
    if(!db || !counterEl) return;
    const ref = db.collection('meta').doc('siteStats');
    ref.update({ pageViews: firebase.firestore.FieldValue.increment(1) }).catch(()=>{ /* doc not seeded yet, or offline -- counter just won't move */ });
    ref.onSnapshot(
      (doc)=>{
        if(doc.exists && typeof doc.data().pageViews === 'number'){
          counterEl.textContent = doc.data().pageViews.toLocaleString() + ' page views';
        }
      },
      (err)=>{ /* decorative -- leave the counter blank on error */ }
    );
  }
  connectTrafficCounter();
})();
</script>
</body>
</html>
