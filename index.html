<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGPC Hiscores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#10162a;
    --panel:#181f3a;
    --panel2:#212a4d;
    --border:#37426e;
    --cream:#f4eedd;
    --dim:#93a0c9;
    --accent:#b23a52;
    --accent-ink:#fbeef1;
    --accent2:#5c8fd6;
  }
  *{ box-sizing:border-box; }
  html,body{ height:auto; }
  body{
    margin:0;
    background:var(--navy);
    color:var(--cream);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    padding-inline:20px;
    padding-block:32px;
    display:flex;
    justify-content:center;
  }
  .px{ font-family:"Press Start 2P",monospace; }

  #shell{ width:100%; max-width:880px; display:flex; flex-direction:column; gap:26px; }

  header{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  header h1{
    font-size:15px; margin:0; letter-spacing:1px; color:var(--accent2);
    text-shadow:2px 2px 0 var(--navy), 0 0 18px rgba(92,143,214,.35);
  }
  header p{ margin:0; color:var(--dim); font-size:13.5px; }

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:16px;
  }

  .tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
  }
  a.tile{ transition:border-color .15s, transform .15s; }
  a.tile:hover, a.tile:focus-visible{ border-color:var(--accent2); transform:translateY(-2px); }
  a.tile:focus-visible{ outline:2px solid var(--accent2); outline-offset:2px; }

  .tile-art{
    background:#000;
    aspect-ratio:160/152;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tile-art img{
    width:100%; height:100%; object-fit:contain;
    image-rendering:pixelated;
  }
  .tile-art .soon-badge{
    position:absolute; top:8px; right:8px;
    background:var(--accent); color:var(--accent-ink);
    font-size:9px; padding:4px 7px; border-radius:5px; letter-spacing:.5px;
  }
  .tile-art.placeholder{
    color:var(--border);
    font-size:11px;
    text-align:center;
    padding:16px;
  }

  .tile-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; }
  .tile-name{ font-size:13.5px; font-weight:700; color:var(--cream); }
  .tile-tag{ font-size:12px; color:var(--dim); }
  .tile.disabled .tile-name, .tile.disabled .tile-tag{ color:var(--dim); opacity:.7; }

  footer{ text-align:center; color:var(--dim); font-size:11px; }
  footer a{ color:var(--accent2); }
</style>
</head>
<body>

<div id="shell">
  <header>
    <h1 class="px">NGPC HISCORES</h1>
    <p>Pick a game to see its leaderboard, or scan the QR code it shows after a completed run.</p>
  </header>

  <div id="grid">
    <!-- Live games and "coming soon" placeholders are both listed by hand here -- there's no
         registry file shared with 404.html, which only needs to case-fix a path, not know
         anything about a game's name or art. Add a new <a class="tile"> block per game. -->

    <a class="tile" href="/lb/">
      <div class="tile-art">
        <img src="/assets/bowling-title.png" alt="Neo Bowling title screen" width="160" height="152">
      </div>
      <div class="tile-body">
        <div class="tile-name">Neo Bowling</div>
        <div class="tile-tag">Pseudo-3D ten-pin &mdash; VS Link 2P</div>
      </div>
    </a>

    <div class="tile disabled">
      <div class="tile-art placeholder">
        <span class="px" style="font-size:9px;">TETRIS</span>
      </div>
      <div class="tile-body">
        <div class="tile-name">Tetris</div>
        <div class="tile-tag">Coming soon</div>
      </div>
    </div>
  </div>

  <footer>NGPC homebrew hiscore boards &mdash; fed by an on-device QR code after every completed game.</footer>
</div>

</body>
</html>
