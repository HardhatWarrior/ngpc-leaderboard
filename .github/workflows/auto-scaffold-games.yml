name: Scaffold approved games

# Polls for games/{slug} docs that were approved (via /admin/'s browser Approve button, which only
# writes the Firestore doc -- see scaffold-approved-games.js's own comment) but don't have a
# <slug>/index.html page yet, generates their leaderboard + play pages, and commits them straight
# to main. Lets a submission get approved and scaffolded end-to-end from a phone, with no computer
# needed. Also runnable on demand from the Actions tab.
#
# The `schedule` trigger below has never actually fired a single run since this workflow was
# added (confirmed via the Actions API after ~24h with zero event:"schedule" runs, despite the
# workflow showing state:"active") -- a real, unexplained GitHub-side issue, not a propagation
# delay. `push` is added as a reliable backstop: this repo gets pushed to often enough (confirmed:
# every one of those 24 hours' worth of commits DID trigger a run, just a "no matching trigger"
# no-op since push wasn't listed here before) that a scaffold check piggybacking on every push
# closes the gap in practice, even though it's not purely time-based for a phone-only approval
# with zero commits happening. Left `schedule` in place in case it ever starts working on its own.
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        working-directory: .github/scripts
        run: npm install --omit=dev

      - name: Generate pages for newly-approved games
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/scaffold-approved-games.js

      - name: Commit and push generated pages
        run: |
          git config user.name "ngpc-leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Auto-scaffold newly-approved game page(s)

This is a generated DRAFT -- read it before flipping devStatus off
'coming-soon', same as a manually-run scaffold-game.js output. Any
*-rules-snippet.txt alongside it still needs to be reviewed and
pasted into firestore.rules by hand."
          git push

