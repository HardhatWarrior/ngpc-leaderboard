name: Scaffold approved games

# Polls every 15 min for games/{slug} docs that were approved (via /admin/'s browser Approve
# button, which only writes the Firestore doc -- see scaffold-approved-games.js's own comment)
# but don't have a <slug>/index.html page yet, generates their leaderboard + play pages, and
# commits them straight to main. Lets a submission get approved and scaffolded end-to-end from a
# phone, with no computer needed. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        working-directory: .github/scripts
        run: npm install --omit=dev

      - name: Generate pages for newly-approved games
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/scaffold-approved-games.js

      - name: Commit and push generated pages
        run: |
          git config user.name "ngpc-leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Auto-scaffold newly-approved game page(s)

This is a generated DRAFT -- read it before flipping devStatus off
'coming-soon', same as a manually-run scaffold-game.js output. Any
*-rules-snippet.txt alongside it still needs to be reviewed and
pasted into firestore.rules by hand."
          git push
