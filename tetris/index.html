<body>
<div>Redirecting&hellip;</div>
<script>
  /* This folder moved to /tt/ (its own 2-char QR game code, saving 4 characters off every
     Tetris QR's URL prefix -- see Tetris's src/main.c QR_URL_PREFIX). Kept as a plain
     redirect, not deleted, so an old bookmark/shared link to /tetris/ still lands somewhere
     real; the hash payload (if any) carries straight through unchanged. */
  location.replace('/tt/' + location.hash);
</script>
</body>
