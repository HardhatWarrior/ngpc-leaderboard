<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">

<style>
  :root{
    --navy:#10162a;
    --panel:#181f3a;
    --panel2:#212a4d;
    --border:#37426e;
    --cream:#f4eedd;
    --dim:#93a0c9;
    --accent:#b23a52;
    --accent-ink:#fbeef1;
    --accent2:#5c8fd6;
    --good:#4fbf8b;
    --danger:#e5615a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:auto; }
  body{
    margin:0;
    background:var(--navy);
    color:var(--cream);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    padding-inline:20px;
    padding-block:28px;
    display:flex;
    justify-content:center;
  }
  .px{ font-family:"Press Start 2P","IBM Plex Mono",monospace; }
  .tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

  #shell{ width:100%; max-width:960px; display:flex; flex-direction:column; gap:22px; }

  /* ---------- header ---------- */
  header{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px 22px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 85% -10%, rgba(178,58,82,.35), transparent 55%);
    pointer-events:none;
  }
  .eyebrow{
    position:relative; font-size:10px; letter-spacing:.14em; color:var(--accent2); text-transform:uppercase;
  }
  /* Image left, title/creator/links right -- all one cluster, so on narrow screens the text
     never has to wrap onto its own crowded row above the screenshot the way a wrapping flex
     "wordmark" row used to. rom-link/play-link moved out of absolute positioning and into normal
     flow here too, directly under created-by, so they're never floating disconnected from it. */
  .header-row{ position:relative; display:flex; flex-direction:row; gap:16px; align-items:flex-start; }
  .title-block{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .title-block h1{
    margin:0; font-size:clamp(18px,5vw,28px); line-height:1.2;
    color:var(--cream); overflow-wrap:break-word;
  }
  .created-by{ font-size:11px; color:var(--dim); }
  .created-by a{ color:var(--dim); text-decoration:underline; text-underline-offset:2px; }
  .created-by a:hover{ color:var(--accent2); }
  .rom-link, .play-link{
    display:inline-flex; align-items:center; gap:5px; width:auto;
    font-weight:600; text-decoration:underline; text-underline-offset:2px;
  }
  .play-link{ color:var(--accent2); font-size:11.5px; margin-top:4px; }
  .play-link:hover{ color:var(--cream); }
  .play-link[hidden]{ display:none; }
  .rom-link{ color:var(--dim); font-size:11px; }
  .rom-link:hover{ color:var(--accent2); }

  /* decorative header art -- the same real title-screen capture the main page's own tile uses,
     not a redraw of it. */
  .header-art{
    position:relative; width:130px; max-width:38%; flex:none; aspect-ratio:160/152;
    image-rendering:pixelated; border-radius:8px; border:1px solid var(--border);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }

  /* ---------- layout ---------- */
  main{ display:grid; grid-template-columns:1fr 1.5fr; gap:20px; align-items:start; }
  @media (max-width:720px){ main{ grid-template-columns:1fr; } }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px;
  }
  .panel h2{
    margin:0 0 4px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent2);
  }
  .panel .hint{ margin:0 0 16px; color:var(--dim); font-size:12.5px; line-height:1.5; }

  /* ---------- leaderboard ---------- */
  #board-status{ font-size:12px; color:var(--dim); margin-bottom:10px; min-height:1.4em; }
  .row{
    display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:12px;
    padding:10px 8px; border-radius:8px;
  }
  .row ~ .row{ border-top:1px solid var(--border); }
  .rank{
    font-family:"Press Start 2P",monospace; font-size:11px; color:var(--dim); text-align:center;
  }
  .row.top1 .rank{ color:var(--accent); }
  .row.top1{ background:rgba(178,58,82,.10); }
  .initials{
    font-family:"Press Start 2P",monospace; font-size:14px; letter-spacing:.06em; color:var(--cream);
    display:flex; align-items:center; gap:8px;
  }
  .row-avatar{
    width:48px; height:48px; border-radius:4px; border:1px solid var(--border);
    image-rendering:pixelated; flex:none;
  }
  .score-col{ display:flex; flex-direction:column; align-items:flex-end; }
  .score-val{
    font-family:"Press Start 2P",monospace; font-size:15px; color:var(--good);
  }
  .row-meta{ font-size:10.5px; color:var(--dim); margin-top:2px; white-space:nowrap; }
  .row-meta a{ color:var(--dim); text-decoration:underline; text-underline-offset:2px; }
  .row-meta a:hover{ color:var(--accent2); }
  .empty-state{ color:var(--dim); font-size:13px; padding:18px 4px; text-align:center; }

  /* ---------- QR scan ---------- */
  .scan-video-wrap{
    position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden;
    background:#000; margin-bottom:10px;
  }
  #scan-video{ width:100%; height:100%; object-fit:cover; display:block; }
  .scan-frame{
    position:absolute; inset:14%; border:2px solid var(--accent2); border-radius:12px;
    box-shadow:0 0 0 999px rgba(0,0,0,.4); pointer-events:none;
  }
  .file-btn{ display:block; text-align:center; cursor:pointer; }

  /* ---------- submit flow ---------- */
  button{
    font:inherit; border:none; border-radius:8px; padding:12px 16px; cursor:pointer;
    font-weight:600; font-size:13.5px; width:100%;
  }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover:not(:disabled){ background:#c14259; }
  .btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--cream); margin-top:8px; }
  .btn-secondary:hover:not(:disabled){ border-color:var(--accent2); }

  #confirm-view{ display:none; }
  #confirm-view.show{ display:block; }
  #idle-view.hide{ display:none; }
  .confirm-score{ text-align:center; padding:18px 0 20px; }
  .confirm-score .who{ font-family:"Press Start 2P",monospace; font-size:22px; letter-spacing:.08em; color:var(--cream); }
  .confirm-score .what{ font-family:"Press Start 2P",monospace; font-size:30px; color:var(--good); margin-top:10px; }
  .confirm-score .src{ margin-top:10px; font-size:11px; color:var(--dim); }
  .msg{ font-size:12.5px; border-radius:8px; padding:10px 12px; margin-top:12px; }
  .msg.err{ background:rgba(229,97,90,.15); color:var(--danger); border:1px solid rgba(229,97,90,.35); }
  .msg.ok{ background:rgba(79,191,139,.15); color:var(--good); border:1px solid rgba(79,191,139,.35); }

  footer{ text-align:center; color:var(--dim); font-size:11px; padding-top:4px; }
</style>

<div id="shell">

  <header>
    <span class="eyebrow">Neo Geo Pocket Color &middot; Homebrew</span>
    <div class="header-row">
      <img src="/assets/tetris-title.png" alt="Tetris title screen" class="header-art" width="160" height="152">
      <div class="title-block">
        <h1>TETRIS</h1>
        <div class="created-by">Created by: <a href="/user/?u=hardhatwarrior">@HARDHATWARRIOR</a></div>
        <a href="/play/tetris/tetris.ngp" class="rom-link" id="rom-link" download>&#128190; Download ROM (.ngp)</a>
        <a href="/play/tetris/" class="play-link" id="play-link" hidden>&#127918; Play Tetris in Browser</a>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" id="submit-panel">
      <h2>Submit a score</h2>

      <!-- Members only -- gates the whole scan mechanism (camera + file fallback), not just the
           final submit step; defaults hidden in markup so it never flashes before auth resolves. -->
      <div id="scan-signin-required">
        <button type="button" class="btn-primary" id="scan-signin-btn">Sign In</button>
      </div>

      <div id="idle-view" hidden>
        <button class="btn-primary" id="btn-scan">Scan QR Code</button>

        <div id="scan-live" hidden>
          <div class="scan-video-wrap">
            <video id="scan-video" playsinline muted></video>
            <div class="scan-frame" aria-hidden="true"></div>
          </div>
          <button class="btn-secondary" id="btn-cancel-scan">Cancel</button>
        </div>

        <div id="scan-fallback" hidden>
          <label class="btn-primary file-btn" for="scan-file">Take / choose a photo</label>
          <input type="file" accept="image/*" id="scan-file" hidden>
          <button class="btn-secondary" id="btn-cancel-fallback">Cancel</button>
        </div>

        <div id="form-msg"></div>
      </div>

      <div id="confirm-view">
        <div class="confirm-score">
          <div class="who" id="confirm-initials">AAA</div>
          <div class="what" id="confirm-score">00000000</div>
          <div class="src" id="confirm-src">From a scanned QR code</div>
        </div>
        <button class="btn-primary" id="btn-confirm">Submit score</button>
        <button class="btn-secondary" id="btn-back">Cancel</button>
        <div id="confirm-msg"></div>
      </div>
    </section>

    <section class="panel" id="leaderboard-panel">
      <h2>Leaderboard</h2>
      <div id="board-status"></div>
      <div id="board"></div>
    </section>
  </main>

  <footer>&copy; 2026 Neo Geo Pocket Homebrew - www.ngpc-dev.com</footer>

<script src="/auth.js"></script>
<script>
(function(){
  "use strict";
  // The 2-char routing prefix the on-device QR encoder writes (Tetris's own main.c
  // QR_GAME_CODE) -- used both to recognize a Tetris scan and as this collection's own `game`
  // field value, so there's one canonical code for this game rather than two different strings
  // for the same thing.
  const QR_GAME_CODE = "TT";
  const SCORE_DIGITS = 8;
  const LINES_DIGITS = 5;
  const LEVEL_DIGITS = 3;
  const MAX_SCORE = Math.pow(10, SCORE_DIGITS) - 1;
  const MAX_LINES = Math.pow(10, LINES_DIGITS) - 1;
  const MAX_LEVEL = Math.pow(10, LEVEL_DIGITS) - 1;
  // Deliberately blocky at source resolution rather than smoothed away.
  const ROW_AVATAR_PX = 48;
  const ROW_AVATAR_CELL_PX = ROW_AVATAR_PX / (window.NGPC_AUTH ? NGPC_AUTH.AVATAR_SIZE : 32);

  // Firebase init + auth (sign-in state, username lookup) is shared across every page -- see
  // auth.js, loaded just before this script tag. NGPC_AUTH is null if firebase-app-compat.js
  // itself failed to load, same failure this page already had to handle before auth.js existed.
  const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;

  const el = (id)=>document.getElementById(id);
  const boardEl = el('board');
  const boardStatusEl = el('board-status');
  const idleView = el('idle-view');
  const confirmView = el('confirm-view');
  const formMsg = el('form-msg');
  const confirmMsg = el('confirm-msg');
  const btnScan = el('btn-scan');
  const scanLive = el('scan-live');
  const scanFallback = el('scan-fallback');
  const scanVideo = el('scan-video');
  const scanFile = el('scan-file');

  let pending = null; // {initials, score, lines, level}

  function validScore(n){ return Number.isInteger(n) && n>=0 && n<=MAX_SCORE; }

  /* The on-device QR encodes a full URL, so a phone's own camera app opens it directly and
     nothing here needs to scan anything. That URL always 404s first (no real file matches a
     payload-bearing path), so 404.html's own dispatcher does the actual routing, landing here
     with the payload in the URL HASH (/tetris/#<payload>), not a path segment -- see 404.html's
     own comment, and lb/index.html's payloadFromEntry() (same pattern, ported here) for why.
     This page's own in-page decoders (zbar-wasm/BarcodeDetector/jsQR) read the QR's raw content,
     prefix and all, so that text needs the same treatment before parsePayload() ever sees it. */
  function lastPathSegment(text){
    const parts = String(text||'').split('/').filter(Boolean);
    return parts.length ? parts[parts.length-1] : '';
  }

  /* ---------- QR payload parser -- <2-char game code><3-char initials><8-digit score>
     <5-digit lines><3-digit level>, matching Tetris's own main.c qr_build_payload() exactly. ---------- */
  function parsePayload(text){
    text = (text||'').trim().toUpperCase();
    const totalLen = 2 + 3 + SCORE_DIGITS + LINES_DIGITS + LEVEL_DIGITS;
    if(text.length < totalLen) return {error:"That code is too short to be a valid score."};
    const gameCode = text.slice(0,2);
    if(gameCode !== QR_GAME_CODE){
      return {error:'This code is for a different game ("'+gameCode+'") — open that game’s own hiscores page instead.'};
    }
    let pos = 2;
    const initials = text.slice(pos, pos+3); pos += 3;
    const scoreStr = text.slice(pos, pos+SCORE_DIGITS); pos += SCORE_DIGITS;
    const linesStr = text.slice(pos, pos+LINES_DIGITS); pos += LINES_DIGITS;
    const levelStr = text.slice(pos, pos+LEVEL_DIGITS); pos += LEVEL_DIGITS;
    if(!/^[A-Z]{3}$/.test(initials)) return {error:"That code's initials didn't look right."};
    if(!/^\d+$/.test(scoreStr) || !/^\d+$/.test(linesStr) || !/^\d+$/.test(levelStr)){
      return {error:"That code's score/lines/level didn't look right."};
    }
    const score = parseInt(scoreStr,10);
    const lines = parseInt(linesStr,10);
    const level = parseInt(levelStr,10);
    if(!validScore(score)) return {error:"That code has an impossible score."};
    if(lines>MAX_LINES || level>MAX_LEVEL) return {error:"That code's lines/level looked impossible."};
    return {initials, score, lines, level};
  }

  function fmtWhen(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  async function renderBoard(docs){
    if(!docs.length){
      boardEl.innerHTML = '<div class="empty-state">No scores yet &mdash; be the first on the board.</div>';
      return;
    }
    // Avatars aren't denormalized onto the score doc (they'd go stale the moment someone repaints
    // their avatar after submitting) -- fetched fresh per render instead, one batched query for
    // every uid on the visible board rather than one read per row.
    const uids = docs.map(d=>d.data().uid).filter(Boolean);
    const avatars = (window.NGPC_AUTH && uids.length) ? await NGPC_AUTH.fetchAvatars(uids) : {};
    boardEl.innerHTML = docs.map((d,i)=>{
      const data = d.data();
      const rank = i+1;
      const usernameLine = data.username ? ('<a href="/user/?u='+encodeURIComponent(data.username)+'">@'+escapeHtml(data.username.toUpperCase())+'</a>') : '';
      const scoreMeta = [fmtWhen(data.submittedAt), data.level!=null?('Lv '+data.level):null, data.lines!=null?(data.lines+' lines'):null]
        .filter(Boolean).join(' · ');
      const hasAvatar = data.uid && avatars[data.uid];
      const avatarHtml = hasAvatar ? '<canvas class="row-avatar" data-avatar-row="'+i+'"></canvas>' : '';
      return '<div class="row'+(rank===1?' top1':'')+'">'+
        '<div class="rank">'+(rank===1?'&#9733;':('#'+rank))+'</div>'+
        '<div><div class="initials">'+avatarHtml+escapeHtml(data.initials||'???')+'</div>'+
          (usernameLine ? '<div class="row-meta">'+usernameLine+'</div>' : '')+'</div>'+
        '<div class="score-col"><div class="score-val tnum">'+(data.score!=null?data.score:'-')+'</div>'+
          (scoreMeta ? '<div class="row-meta">'+scoreMeta+'</div>' : '')+'</div>'+
      '</div>';
    }).join('');
    // <canvas> content can't come in through innerHTML -- draw each one in after insertion.
    docs.forEach((d,i)=>{
      const data = d.data();
      if(!data.uid || !avatars[data.uid]) return;
      const canvasEl = boardEl.querySelector('[data-avatar-row="'+i+'"]');
      if(canvasEl) NGPC_AUTH.renderAvatarToCanvas(canvasEl, avatars[data.uid], ROW_AVATAR_CELL_PX);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Firestore's own error codes (hyphenated).
  function friendlyDbError(e){
    const code = e && e.code;
    switch(code){
      case 'permission-denied': return "The leaderboard's access rules rejected that — try again later.";
      case 'resource-exhausted': return "Too many requests right now — wait a moment and try again.";
      case 'unauthenticated': return "You need to be signed in to do that.";
      case 'invalid-argument': return "That score didn't look valid — double check the initials and score.";
      case 'unavailable': return "Couldn't reach the leaderboard right now. Try again in a bit.";
      default: return "Couldn't reach the leaderboard right now. Try again in a bit.";
    }
  }

  function connectDb(){
    if(!db){
      boardStatusEl.textContent = 'Live leaderboard is unavailable right now (Firebase failed to load).';
      formMsg.innerHTML = '<div class="msg err">Submitting a score isn’t possible until the page reloads correctly.</div>';
      return;
    }
    boardStatusEl.textContent = '';
    const q = db.collection('scores').where('game','==',QR_GAME_CODE).where('approved','==',true).orderBy('score','desc').limit(25);
    q.onSnapshot(
      (snap)=>{ boardStatusEl.textContent = ''; renderBoard(snap.docs); },
      (err)=>{ boardStatusEl.textContent = friendlyDbError(err); }
    );
  }

  async function writeScore(data, retried){
    try{
      await db.collection('scores').add(data);
      return {ok:true};
    }catch(e){
      if(e && e.code==='unavailable' && !retried){
        await new Promise(r=>setTimeout(r, 400+Math.random()*400));
        return writeScore(data, true);
      }
      return {ok:false, error:e};
    }
  }

  function showStage(stage){
    idleView.classList.toggle('hide', stage!=='idle');
    confirmView.classList.toggle('show', stage==='confirm');
  }

  function openConfirm(initials, score, lines, level){
    pending = {initials, score, lines, level};
    el('confirm-initials').textContent = initials;
    el('confirm-score').textContent = String(score);
    el('confirm-src').textContent = 'Level '+level+' · '+lines+' lines — from a scanned QR code';
    confirmMsg.innerHTML = '';
    showStage('confirm');
  }

  function handleScanResult(text){
    formMsg.innerHTML = '';
    const result = parsePayload(lastPathSegment(text));
    if(result.error){
      formMsg.innerHTML = '<div class="msg err">'+escapeHtml(result.error)+'</div>';
      return;
    }
    resetScanUI();
    openConfirm(result.initials, result.score, result.lines, result.level);
  }

  function payloadFromEntry(){
    const raw = location.hash ? location.hash.slice(1) : lastPathSegment(location.pathname);
    const last = decodeURIComponent(lastPathSegment(raw));
    const totalLen = 2 + 3 + SCORE_DIGITS + LINES_DIGITS + LEVEL_DIGITS;
    if(last.length < totalLen) return null;
    const result = parsePayload(last);
    return result.error ? null : result;
  }

  /* ---------- camera scan (getUserMedia + jsQR), falling back to a native camera/file
     picker if a live in-page camera stream isn't available. ---------- */
  let cameraStream = null;
  let scanRAF = null;
  const scanCanvas = document.createElement('canvas');
  const scanCtx = scanCanvas.getContext('2d', {willReadFrequently:true});

  function resetScanUI(){
    if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
    scanLive.hidden = true;
    scanFallback.hidden = true;
    btnScan.hidden = false;
  }

  function showFallback(msg){
    if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
    scanLive.hidden = true;
    btnScan.hidden = true;
    scanFallback.hidden = false;
    if(msg) formMsg.innerHTML = '<div class="msg err">'+escapeHtml(msg)+'</div>';
  }

  async function startLiveScan(){
    formMsg.innerHTML = '';
    if(noDecoderAvailable()){
      formMsg.innerHTML = '<div class="msg err">'+libraryMissingMsg()+'</div>';
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showFallback('Live camera preview isn’t supported in this browser/view (no camera API present).');
      return;
    }
    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
    }catch(e){
      const name = (e && e.name) || 'Error';
      showFallback('Live camera preview isn’t available here (' + name + ') — take a photo of the QR code instead.');
      return;
    }
    scanVideo.srcObject = cameraStream;
    try{ await scanVideo.play(); }catch(e){ /* some browsers auto-play on metadata; ignore */ }
    btnScan.hidden = true;
    scanFallback.hidden = true;
    scanLive.hidden = false;
    scanLoop();
  }

  function libraryMissingMsg(){
    return "QR scanning isn’t available right now (a required library failed to load) — try reloading the page.";
  }

  // ---- decoders, tried in this order, each a fallback for the one before -- see lb/index.html's
  // own comment for the full reasoning (zbar-wasm > native BarcodeDetector > jsQR). ----
  let barcodeDetector;
  function getBarcodeDetector(){
    if(barcodeDetector !== undefined) return barcodeDetector;
    if(!('BarcodeDetector' in window)){ barcodeDetector = null; return null; }
    try{ barcodeDetector = new window.BarcodeDetector({formats:['qr_code']}); }
    catch(e){ barcodeDetector = null; }
    return barcodeDetector;
  }
  function noDecoderAvailable(){ return !window.zbarWasm && !getBarcodeDetector() && !window.jsQR; }

  async function decodeViaZbarWasm(source, w0, h0){
    if(!window.zbarWasm || !w0 || !h0) return null;
    const target = 1000;
    const scale = Math.min(1, target/Math.max(w0,h0));
    const w = Math.round(w0*scale), h = Math.round(h0*scale);
    scanCanvas.width = w; scanCanvas.height = h;
    scanCtx.drawImage(source, 0, 0, w, h);
    const imageData = scanCtx.getImageData(0, 0, w, h);
    try{
      const symbols = await window.zbarWasm.scanImageData(imageData);
      if(symbols && symbols.length) return symbols[0].decode();
    }catch(e){ /* fall through */ }
    return null;
  }

  function jsqrFallback(source, w0, h0, scales){
    if(!window.jsQR || !w0 || !h0) return null;
    for(const target of scales){
      const scale = Math.min(1, target/Math.max(w0,h0));
      const w = Math.round(w0*scale), h = Math.round(h0*scale);
      scanCanvas.width = w; scanCanvas.height = h;
      scanCtx.drawImage(source, 0, 0, w, h);
      const frame = scanCtx.getImageData(0, 0, w, h);
      const code = window.jsQR(frame.data, w, h, {inversionAttempts:'attemptBoth'});
      if(code && code.data) return code.data;
    }
    return null;
  }

  async function decodeSource(source, w0, h0, jsqrScales){
    const viaZbar = await decodeViaZbarWasm(source, w0, h0);
    if(viaZbar) return viaZbar;
    const bd = getBarcodeDetector();
    if(bd){
      try{
        const results = await bd.detect(source);
        if(results && results.length && results[0].rawValue) return results[0].rawValue;
      }catch(e){ /* fall through to jsQR */ }
    }
    return jsqrFallback(source, w0, h0, jsqrScales);
  }

  const LIVE_SCALES = [500, 900];
  let liveBusy = false;
  async function scanLoop(){
    if(noDecoderAvailable()){
      resetScanUI();
      formMsg.innerHTML = '<div class="msg err">'+libraryMissingMsg()+'</div>';
      return;
    }
    scanRAF = requestAnimationFrame(scanLoop);
    if(scanVideo.readyState !== scanVideo.HAVE_ENOUGH_DATA) return;
    if(liveBusy) return;
    const w = scanVideo.videoWidth, h = scanVideo.videoHeight;
    if(!w || !h) return;
    liveBusy = true;
    try{
      const value = await decodeSource(scanVideo, w, h, LIVE_SCALES);
      if(value) handleScanResult(value);
    } finally { liveBusy = false; }
  }

  function loadViaImageElement(file){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('img element failed to decode "'+file.type+'"')); };
      img.src = url;
    });
  }

  async function loadImage(file){
    if(window.createImageBitmap){
      try{ return await createImageBitmap(file); }
      catch(e){ /* fall through */ }
    }
    return loadViaImageElement(file);
  }

  const FILE_SCALES = [350, 500, 700, 900, 1200];

  async function scanFromFile(file){
    if(noDecoderAvailable()){
      formMsg.innerHTML = '<div class="msg err">'+libraryMissingMsg()+'</div>';
      return;
    }
    formMsg.innerHTML = '<div class="msg ok">Reading code&hellip;</div>';
    let img;
    try{ img = await loadImage(file); }
    catch(e){
      const type = file.type || 'unknown type';
      formMsg.innerHTML = '<div class="msg err">Couldn’t read that photo (' + escapeHtml(type) + ') — try again, or use a JPG/PNG if your phone saved it as something else.</div>';
      return;
    }
    if(!img.width || !img.height){
      formMsg.innerHTML = '<div class="msg err">That photo came back empty — try again.</div>';
      return;
    }
    const value = await decodeSource(img, img.width, img.height, FILE_SCALES);
    if(value){
      handleScanResult(value);
    } else {
      formMsg.innerHTML = '<div class="msg err">No QR code found in that photo (read as ' + img.width + '×' + img.height + ') — make sure the whole code is in frame, hold the console steady and avoid glare, then try again.</div>';
    }
  }

  btnScan.addEventListener('click', startLiveScan);
  el('btn-cancel-scan').addEventListener('click', resetScanUI);
  el('btn-cancel-fallback').addEventListener('click', resetScanUI);
  scanFile.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(file) scanFromFile(file);
  });

  el('btn-back').addEventListener('click', ()=>{
    pending = null;
    showStage('idle');
  });

  el('btn-confirm').addEventListener('click', async ()=>{
    if(!pending) return;
    if(!db){
      confirmMsg.innerHTML = '<div class="msg err">'+friendlyDbError()+'</div>';
      return;
    }
    // Sign-in is required to submit (anonymous submission was retired) -- wait for auth to
    // actually settle first, since a QR-scan deep link opens straight into this confirm screen
    // and a fast click can otherwise race the still-resolving sign-in check.
    if(window.NGPC_AUTH) await NGPC_AUTH.authReady;
    const authedUser = window.NGPC_AUTH && NGPC_AUTH.currentUser;
    if(!authedUser || !authedUser.username){
      confirmMsg.innerHTML = '<div class="msg err">Sign in to submit a score.'
        +' <button type="button" class="btn-secondary" id="confirm-signin-btn" style="width:auto;display:inline;margin:0 0 0 6px;padding:4px 10px">Sign In</button></div>';
      const signinBtn = el('confirm-signin-btn');
      if(signinBtn) signinBtn.addEventListener('click', ()=>{ if(window.NGPC_AUTH) NGPC_AUTH.openSignInModal('signin'); });
      return;
    }
    const btn = el('btn-confirm');
    btn.disabled = true;
    confirmMsg.innerHTML = '';
    const scoreDoc = {
      game: QR_GAME_CODE,
      initials: pending.initials,
      score: pending.score,
      lines: pending.lines,
      level: pending.level,
      source: 'qr',
      submittedAt: Date.now(),
      uid: authedUser.uid,
      username: authedUser.username,
      approved: !!authedUser.approved,
    };
    const res = await writeScore(scoreDoc);
    btn.disabled = false;
    if(res.ok){
      // Straight to the live board, not a "submitted!" interstitial requiring another click --
      // the whole point of scanning was to see where this score landed. The toast below gets
      // naturally overwritten within a moment anyway, once the live query (this client is already
      // subscribed to it) picks up the write it just made and re-renders the board.
      const toastText = pending.initials + ' — ' + pending.score + ' submitted!';
      pending = null;
      showStage('idle');
      boardStatusEl.innerHTML = '<div class="msg ok">'+escapeHtml(toastText)+'</div>';
    } else {
      confirmMsg.innerHTML = '<div class="msg err">'+friendlyDbError(res.error)+'</div>';
    }
  });

  // ---- boot ----
  function boot(){
    renderBoard([]); // real empty state as the floor -- never leave the board blank while db connects
    connectDb();
    const fromEntry = payloadFromEntry();
    if(fromEntry){
      openConfirm(fromEntry.initials, fromEntry.score, fromEntry.lines, fromEntry.level);
      // Strip back to the clean /tetris/ URL (hash included) so a refresh or a re-shared link
      // can't replay the same scan as a fresh submission.
      history.replaceState(null, '', '/tetris/');
    }
  }
  // The in-browser player is only offered to a signed-in visitor -- anonymous QR submission
  // stays exactly as-is either way, this is purely about who sees the link.
  if(window.NGPC_AUTH){
    NGPC_AUTH.onAuthChange((user)=>{
      el('play-link').hidden = !user;
      // Members only -- gates the whole scan mechanism, not just the final submit step.
      el('idle-view').hidden = !user;
      el('scan-signin-required').hidden = !!user;
      if(!user) resetScanUI();
    });
    el('scan-signin-btn').addEventListener('click', ()=>NGPC_AUTH.openSignInModal('signin'));

    // Points the "Download ROM" link at a developer-uploaded build if one exists
    // (games/tt.romPath, set from /admin/game/) instead of the static repo-committed file --
    // falls back to whatever this page's own markup already has if the doc/field is missing.
    (function(){
      var romLinkEl = el('rom-link');
      if(!romLinkEl || !NGPC_AUTH.db) return;
      NGPC_AUTH.db.collection('games').doc('tt').get().then(function(doc){
        if(doc.exists && doc.data().romPath) romLinkEl.href = doc.data().romPath;
      }).catch(function(){ /* keep the static fallback href */ });
    })();
  }

  boot();
})();
</script>
</body>
</html>
