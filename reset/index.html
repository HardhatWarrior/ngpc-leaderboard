<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#10162a; --panel:#181f3a; --panel2:#212a4d; --border:#37426e;
    --cream:#f4eedd; --dim:#93a0c9; --accent:#5c8fd6; --accent-ink:#0a1830;
    --accent2:#5c8fd6; --good:#4fbf8b; --danger:#e5615a;
  }
  *{ box-sizing:border-box; } html,body{ height:auto; }
  body{ margin:0; background:var(--navy); color:var(--cream); font-family:"IBM Plex Sans",system-ui,sans-serif; padding-inline:20px; padding-block:28px; display:flex; justify-content:center; }
  #shell{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:22px; }
  header{ text-align:center; display:flex; flex-direction:column; gap:6px; }
  header h1{ font-size:15px; margin:0; letter-spacing:1px; color:var(--accent2); }
  header p{ margin:0; color:var(--dim); font-size:12.5px; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px 20px; display:flex; flex-direction:column; gap:14px; }
  label{ display:block; font-size:11.5px; color:var(--dim); }
  input{ display:block; width:100%; margin-top:4px; background:var(--navy); border:1px solid var(--border); color:var(--cream); border-radius:7px; padding:9px 10px; font:inherit; font-size:13px; box-sizing:border-box; }
  input:focus{ outline:none; border-color:var(--accent2); }
  button{ font:inherit; border:none; border-radius:8px; padding:12px 16px; cursor:pointer; font-weight:600; font-size:13.5px; width:100%; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.1); }
  .msg{ font-size:12.5px; border-radius:8px; padding:10px 12px; }
  .msg.err{ background:rgba(229,97,90,.15); color:var(--danger); border:1px solid rgba(229,97,90,.35); }
  .msg.ok{ background:rgba(79,191,139,.15); color:var(--good); border:1px solid rgba(79,191,139,.35); }
  .back-link{ text-align:center; }
  .back-link a{ color:var(--dim); font-size:12px; text-decoration:underline; text-underline-offset:2px; }
  .back-link a:hover{ color:var(--accent2); }
  #reset-form[hidden], #reset-success[hidden], #reset-invalid[hidden]{ display:none; }
</style>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "33e146de507a4007bb50d3d54f01816b"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>

<div id="shell">
  <header>
    <h1>NGPC HISCORES</h1>
    <p>Reset your password</p>
  </header>

  <div class="panel" id="reset-invalid" hidden>
    <div class="msg err">This reset link is missing or malformed. Request a new one from the sign-in form's "Forgot password?" link.</div>
    <div class="back-link"><a href="/">&larr; Back to the site</a></div>
  </div>

  <form class="panel" id="reset-form" hidden>
    <label>New password<input id="reset-password" type="password" autocomplete="new-password" required minlength="6"></label>
    <label>Confirm new password<input id="reset-password-confirm" type="password" autocomplete="new-password" required minlength="6"></label>
    <button type="submit" class="btn-primary" id="reset-submit">Set New Password</button>
    <div id="reset-msg"></div>
  </form>

  <div class="panel" id="reset-success" hidden>
    <div class="msg ok">Your password has been reset. You can sign in with it now.</div>
    <div class="back-link"><a href="/">&larr; Back to the site</a></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // Same region the function is deployed to (functions/index.js's confirmPasswordReset) -- the
  // classic cloudfunctions.net alias still works for a 2nd-gen HTTPS function, no need for the
  // Cloud Run URL it also gets.
  const CONFIRM_URL = 'https://us-central1-ngpc-leaderboard.cloudfunctions.net/confirmPasswordReset';

  const el = (id)=>document.getElementById(id);
  const invalidEl = el('reset-invalid'), formEl = el('reset-form'), successEl = el('reset-success');
  const msgEl = el('reset-msg'), submitBtn = el('reset-submit');

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const token = new URLSearchParams(location.search).get('token');
  if(!token){
    invalidEl.hidden = false;
  } else {
    formEl.hidden = false;
  }

  formEl.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const password = el('reset-password').value;
    const confirmPassword = el('reset-password-confirm').value;
    msgEl.innerHTML = '';
    if(password.length < 6){
      msgEl.innerHTML = '<div class="msg err">Password needs to be at least 6 characters.</div>';
      return;
    }
    if(password !== confirmPassword){
      msgEl.innerHTML = '<div class="msg err">Passwords don’t match.</div>';
      return;
    }
    submitBtn.disabled = true;
    msgEl.innerHTML = '<div class="msg ok">Resetting…</div>';
    try{
      const res = await fetch(CONFIRM_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token, newPassword: password}),
      });
      const data = await res.json().catch(()=>({ok:false, error:'Unexpected response from the server.'}));
      if(data.ok){
        formEl.hidden = true;
        successEl.hidden = false;
      } else {
        msgEl.innerHTML = '<div class="msg err">'+escapeHtml(data.error || 'Something went wrong. Try again.')+'</div>';
        submitBtn.disabled = false;
      }
    }catch(err){
      msgEl.innerHTML = '<div class="msg err">Couldn’t reach the server — check your connection and try again.</div>';
      submitBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
