<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGPC Hiscores</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#10162a; color:#f4eedd; font-family:system-ui,sans-serif; font-size:14px; }
</style>
</head>
<body>
<div>Redirecting&hellip;</div>
<script>
  // Every game's QR encodes a full URL whose first path segment is that game's folder name in
  // QR alphanumeric mode's UPPERCASE-only charset (e.g. https://www.ngpc-dev.com/LB/<payload>),
  // so it always 404s against the real lowercase folder (/lb/) GitHub Pages actually serves.
  // Fix: lowercase just the first segment and redirect there, leaving everything after it (the
  // payload, further slashes) untouched. This is intentionally generic across every game -- a
  // new game's QR "just works" through here with no changes to this file, as long as its folder
  // name is the lowercase of whatever uppercase segment its own QR encodes.
  (function(){
    var path = location.pathname;
    var slashIdx = path.indexOf('/', 1);
    var first = slashIdx === -1 ? path.slice(1) : path.slice(1, slashIdx);
    var rest = slashIdx === -1 ? '' : path.slice(slashIdx);
    if(!first){ location.replace('/'); return; }
    var lower = first.toLowerCase();
    // Already lowercase and still not found -- a genuinely unknown path, not a casing mismatch.
    // Send home instead of redirecting to the exact same URL (which would just 404 again).
    if(lower === first){ location.replace('/'); return; }
    location.replace('/' + lower + rest);
  })();
</script>
</body>
</html>
