<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGPC Hiscores</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#10162a; color:#f4eedd; font-family:system-ui,sans-serif; font-size:14px; }
</style>
</head>
<body>
<div>Redirecting&hellip;</div>
<script>
  // Every game's QR encodes a full URL whose first path segment is that game's folder name in
  // QR alphanumeric mode's UPPERCASE-only charset (e.g. https://www.ngpc-dev.com/LB/<payload>),
  // so it always 404s against the real lowercase folder (/lb/) GitHub Pages actually serves.
  //
  // Fixing just the casing and redirecting to /lb/<payload> was the first attempt here, but that
  // 404s AGAIN -- /lb/<payload> isn't a real file either, only /lb/ (the folder's index.html) is
  // -- which bounces back through this exact script a second time, and by then the segment is
  // already lowercase so it gives up to the homepage instead of ever reaching the app. Putting
  // the remainder in the URL HASH instead fixes this in one hop: /lb/#<payload> is a literal
  // match against the real /lb/ file (a hash never reaches the server at all), so it's a normal
  // 200 straight to that game's own index.html, which reads the payload back out of
  // location.hash. Generic across every future game -- a new game's QR "just works" through here
  // with no changes to this file, as long as its folder name is the lowercase of whatever
  // uppercase segment its own QR encodes.
  (function(){
    var path = location.pathname;
    var slashIdx = path.indexOf('/', 1);
    var first = slashIdx === -1 ? path.slice(1) : path.slice(1, slashIdx);
    var rest = slashIdx === -1 ? '' : path.slice(slashIdx + 1); // no leading slash
    if(!first){ location.replace('/'); return; }
    var lower = first.toLowerCase();
    // Already lowercase and still not found -- a genuinely unknown path, not a casing mismatch.
    // Send home instead of redirecting to the exact same URL (which would just 404 again).
    if(lower === first){ location.replace('/'); return; }
    location.replace('/' + lower + '/' + (rest ? '#' + rest : ''));
  })();
</script>
</body>
</html>
