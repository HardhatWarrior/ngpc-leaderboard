      activeProjectIdx=clamp(obj.activeIndex||0,0,projects.length-1);
      loadSnapshotIntoLive(projects[activeProjectIdx]); scheduleAutosave();
    } else this.addProject(obj);
  },
  addProject:function(snap){
    if(!snap.version||snap.version&lt;2) snap=migrateLegacy(snap);
    projects[activeProjectIdx]=captureActiveProjectSnapshot();
    var rec={name:snap.name||&#x27;my_tiles&#x27;,snapshot:snap,zoom:18,anchor:&#x27;tl&#x27;,undoStack:[],redoStack:[]};
    projects.push(rec); activeProjectIdx=projects.length-1; loadSnapshotIntoLive(rec); scheduleAutosave();
  },
  startNew:function(){ projects=[blankProjectRecord()]; activeProjectIdx=0; loadSnapshotIntoLive(projects[0]); scheduleAutosave(); },
  summary:function(){ return projects.length+&#x27; project tab&#x27;+(projects.length===1?&#x27;&#x27;:&#x27;s&#x27;)+&#x27;, &#x27;+assets.length+&#x27; asset&#x27;+(assets.length===1?&#x27;&#x27;:&#x27;s&#x27;)+&#x27; in the active one&#x27;; },
  importNtt:function(fs){ return importNttFiles(fs); },
  activate:function(){ render(); }
};
(function(){
  var b=document.getElementById(&#x27;btnKitSendMap&#x27;); if(!b) return;
  b.onclick=function(){
    var K=window.parent.NGPC_KIT, snap=serializeProject();
    K.sendToMap(snap,(snap.name||&#x27;my_tiles&#x27;)+&#x27; (Tile Editor)&#x27;);
  };
})();
})();
&lt;/script&gt;

&lt;script&gt;
(function(){
var K=(window.parent&amp;&amp;window.parent!==window)?window.parent.NGPC_KIT:null; if(!K) return;
var LINKS={&#x27;tilemap/&#x27;:&#x27;map&#x27;,&#x27;voxel/&#x27;:&#x27;voxel&#x27;,&#x27;../&#x27;:&#x27;tile&#x27;};
document.addEventListener(&#x27;click&#x27;,function(e){
  var a=e.target&amp;&amp;e.target.closest?e.target.closest(&#x27;a[href]&#x27;):null; if(!a) return;
  var t=LINKS[a.getAttribute(&#x27;href&#x27;)]; if(t){ e.preventDefault(); e.stopPropagation(); K.activate(t); }
},true);
document.addEventListener(&#x27;keydown&#x27;,function(e){
  if((e.ctrlKey||e.metaKey)&amp;&amp;!e.shiftKey&amp;&amp;!e.altKey&amp;&amp;e.key.toLowerCase()===&#x27;s&#x27;){ e.preventDefault(); e.stopPropagation(); K.save(); }
},true);
document.addEventListener(&#x27;dragover&#x27;,function(e){ if(e.dataTransfer&amp;&amp;Array.prototype.some.call(e.dataTransfer.items||[],function(i){return i.kind===&#x27;file&#x27;;})) e.preventDefault(); });
document.addEventListener(&#x27;drop&#x27;,function(e){
  if(e.defaultPrevented) return;
  var fs=Array.prototype.slice.call((e.dataTransfer&amp;&amp;e.dataTransfer.files)||[]);
  if(fs.length&amp;&amp;fs.every(function(f){return /\.(json|ntt)$/i.test(f.name);})){ e.preventDefault(); K.openFiles(fs); }
});
})();

&lt;head&gt;

&lt;title&gt;NGPC Tilemap Editor&lt;/title&gt;
&lt;style&gt;
:root{
  --bg:#1e1f26; --panel:#262832; --panel2:#2d3040; --border:#3a3d4d;

body.light{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:13px/1.4 &quot;Segoe UI&quot;,system-ui,sans-serif;height:100%;}
button,input,select{font:inherit;color:inherit;}
button{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:5px 10px;border-radius:4px;cursor:pointer;}
button:hover{border-color:var(--accent);}
button.active{background:var(--accent);color:#0b0d12;border-color:var(--accent);font-weight:600;}
button:disabled{opacity:.4;cursor:default;}
button.danger:hover{border-color:var(--danger);}
input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:4px 6px;border-radius:4px;width:60px;}
select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;}
h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em;}

.hint{color:var(--dim);font-size:11px;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;gap:6px;}
.sep{width:1px;align-self:stretch;background:var(--border);margin:0 4px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;}
#app{display:grid;grid-template-columns:250px 1fr 260px;grid-template-rows:auto 1fr auto;

#left{grid-row:2;overflow:auto;display:flex;flex-direction:column;gap:8px;}
#right{grid-row:2;overflow:auto;display:flex;flex-direction:column;gap:8px;}
#center{grid-row:2;display:flex;flex-direction:column;overflow:hidden;gap:0;}
#topStatusBar{flex:0 0 auto;display:flex;justify-content:space-between;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:6px 12px;margin-bottom:8px;color:var(--dim);font-size:11px;flex-wrap:wrap;}
#mapScroll{flex:1 1 auto;overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;padding:6px;}
#mapWrap{background:
  linear-gradient(45deg,var(--checker) 25%,transparent 25%),
  linear-gradient(-45deg,var(--checker) 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,var(--checker) 75%),
  linear-gradient(-45deg,transparent 75%,var(--checker) 75%);
  background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0px;
  background-color:var(--canvas-bg);
  border:1px solid var(--border);display:inline-block;line-height:0;border-radius:4px;
  cursor:crosshair;touch-action:none;
}
#mapCanvas{image-rendering:pixelated;display:block;touch-action:none;}
#tilesetCanvas{image-rendering:pixelated;display:block;border:1px solid var(--border);border-radius:4px;
  background:var(--canvas-bg);cursor:pointer;touch-action:none;max-width:100%;}
#bottom{grid-column:1/4;grid-row:3;}
textarea{width:100%;background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);
  border-radius:4px;padding:8px;font:12px/1.4 Consolas,&quot;Courier New&quot;,monospace;resize:vertical;}
#codeOut{height:160px;}
label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;}
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.layerList{display:flex;flex-direction:column;gap:4px;}
.layerRow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;
  border:1px solid transparent;cursor:pointer;}
.layerRow:hover{border-color:var(--border);}
.layerRow.active{background:var(--panel2);border-color:var(--accent);}
.statBad{color:var(--danger);font-weight:600;}
.statOk{color:var(--good);}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;
  align-items:center;justify-content:center;z-index:1000;}
.modalOverlay[hidden]{display:none;}
.modalBox{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:18px 20px;max-width:440px;box-shadow:0 8px 30px rgba(0,0,0,0.5);}
.modalMessage{white-space:pre-line;margin-bottom:14px;font-size:13px;line-height:1.5;}
.modalButtons{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.modalButtons button.primary{background:var(--accent);color:#0b0d12;border-color:var(--accent);font-weight:600;}
.currentTilePreview{border:2px solid var(--border);border-radius:4px;
  image-rendering:pixelated;background:var(--canvas-bg);max-width:160px;max-height:160px;}
.sidebarToggle{align-self:flex-start;}
@media (max-width: 900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto;height:auto;min-height:100vh;}
  #left,#right,#center,#topbar,#bottom{grid-row:auto;grid-column:1;}
}

&lt;body&gt;

&lt;div id=&quot;app&quot;&gt;
  &lt;div id=&quot;topbar&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;h1&gt;NGPC Tilemap Editor&lt;/h1&gt;
      &lt;span class=&quot;sep&quot;&gt;&lt;/span&gt;
      &lt;input id=&quot;mapName&quot; type=&quot;text&quot; value=&quot;my_map&quot; style=&quot;width:120px&quot; title=&quot;Array/project name&quot;&gt;
      &lt;button id=&quot;btnNewMap&quot;&gt;New&lt;/button&gt;
      &lt;button id=&quot;btnSaveMap&quot;&gt;Save Map&lt;/button&gt;
      &lt;button id=&quot;btnLoadMap&quot;&gt;Load Map&lt;/button&gt;
      &lt;input id=&quot;fileLoadMap&quot; type=&quot;file&quot; accept=&quot;.json&quot; style=&quot;display:none&quot;&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button id=&quot;btnImportTileset&quot;&gt;Import Tileset (.json)&lt;/button&gt;
      &lt;input id=&quot;fileImportTileset&quot; type=&quot;file&quot; accept=&quot;.json&quot; style=&quot;display:none&quot;&gt;
      &lt;span class=&quot;hint statusText&quot; id=&quot;tilesetInfo&quot;&gt;no tileset imported&lt;/span&gt;
      &lt;span class=&quot;sep&quot;&gt;&lt;/span&gt;
      &lt;label class=&quot;chk&quot; title=&quot;Light background + dark text, for e-ink displays.&quot;&gt;
        &lt;input type=&quot;checkbox&quot; id=&quot;chkLightMode&quot;&gt; Light mode
      &lt;/label&gt;
      &lt;span class=&quot;sep&quot;&gt;&lt;/span&gt;
      &lt;span class=&quot;hint statusText&quot; id=&quot;autosaveHint&quot;&gt;autosaved&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;left&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Tileset&lt;/h2&gt;
      &lt;div class=&quot;hint&quot;&gt;Import a project &lt;code&gt;.json&lt;/code&gt; saved from the NGPC Tile Editor. Pick which tileset layer to stamp FROM with the tabs below, independent of which map layer (Layer 1/Layer 2) you&#x27;re stamping ONTO. Click a tile below, or drag to select a rectangular block of tiles to stamp as one unit.&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot; id=&quot;tilesetLayerTabs&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px;align-items:flex-start&quot;&gt;
        &lt;canvas id=&quot;tilesetCanvas&quot; width=&quot;128&quot; height=&quot;128&quot;&gt;&lt;/canvas&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint statusText&quot; id=&quot;tileInfo&quot; style=&quot;margin-top:6px&quot;&gt;No tile selected.&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Stamp&lt;/h2&gt;
      &lt;div class=&quot;row&quot;&gt;
        &lt;canvas class=&quot;currentTilePreview&quot; id=&quot;stampPreview&quot; width=&quot;48&quot; height=&quot;48&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;col&quot;&gt;
          &lt;label class=&quot;chk&quot;&gt;Palette
            &lt;select id=&quot;stampPalOverride&quot; style=&quot;width:120px&quot;&gt;&lt;/select&gt;
          &lt;/label&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;button id=&quot;btnFlipH&quot; title=&quot;Flip stamp horizontally (Shift+H)&quot;&gt;Flip H&lt;/button&gt;
            &lt;button id=&quot;btnFlipV&quot; title=&quot;Flip stamp vertically (Shift+V)&quot;&gt;Flip V&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;button id=&quot;btnStampRotateCCW&quot; title=&quot;Rotate the stamp 90° counter-clockwise before placing ([). Real hardware has no tile-rotate flag, so this bakes a brand-new rotated tile bitmap the first time it&#x27;s needed (reusing an identical one already generated where possible) -- same mechanism as Rotate CW/CCW on a selection.&quot;&gt;&amp;#8634;&lt;/button&gt;
            &lt;span class=&quot;hint statusText&quot; id=&quot;stampRotationLabel&quot; style=&quot;min-width:34px;text-align:center&quot;&gt;0&amp;deg;&lt;/span&gt;
            &lt;button id=&quot;btnStampRotateCW&quot; title=&quot;Rotate the stamp 90° clockwise before placing (]). See the CCW button for how this works.&quot;&gt;&amp;#8635;&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin-top:4px&quot;&gt;Palette &quot;Inherit&quot; uses the tile&#x27;s own default palette from the tile editor. Pick a click on the map with Eyedrop to load its tile/palette/flip back into the stamp (this also resets rotation to 0&amp;deg;, since a baked tile&#x27;s rotation can&#x27;t be recovered from its bitmap).&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Text (BIOS Font)&lt;/h2&gt;
      &lt;div class=&quot;hint&quot;&gt;Places real tiles using the console&#x27;s built-in 8x8 ASCII font (a redistributable Liberation-Mono stand-in for the proprietary BIOS glyphs -- same tile index == ASCII code convention `ngpc_text_print` uses, so it&#x27;s included in the C export like any other tile). Good for mocking up menus/HUD text directly on the map. Click Text below, type a string, then click the map to place it (clips at the map edge).&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;input id=&quot;textInput&quot; type=&quot;text&quot; value=&quot;MENU&quot; maxlength=&quot;64&quot; style=&quot;width:160px&quot; placeholder=&quot;Text to place&quot;&gt;
        &lt;label class=&quot;chk&quot;&gt;Palette
          &lt;select id=&quot;textPalOverride&quot; style=&quot;width:120px&quot;&gt;&lt;/select&gt;
        &lt;/label&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Tools&lt;/h2&gt;
      &lt;div class=&quot;toolgrid&quot;&gt;
        &lt;button id=&quot;toolStamp&quot; class=&quot;active&quot; title=&quot;Stamp (B)&quot;&gt;&amp;#9997; Stamp&lt;/button&gt;
        &lt;button id=&quot;toolErase&quot; title=&quot;Erase (E)&quot;&gt;&amp;#9003; Erase&lt;/button&gt;
        &lt;button id=&quot;toolFill&quot; title=&quot;Flood fill (F)&quot;&gt;&amp;#129691; Fill&lt;/button&gt;
        &lt;button id=&quot;toolEyedrop&quot; title=&quot;Eyedrop (I)&quot;&gt;&amp;#128167; Pick&lt;/button&gt;
        &lt;button id=&quot;toolSelect&quot; title=&quot;Rectangle select (S) -- drag from inside an existing selection to move it&quot;&gt;&amp;#9645; Select&lt;/button&gt;
        &lt;button id=&quot;toolSprite&quot; title=&quot;Sprite preview placement (P)&quot;&gt;&amp;#128100; Sprite&lt;/button&gt;
        &lt;button id=&quot;toolText&quot; title=&quot;Place BIOS-font text (T)&quot;&gt;&amp;#128196; Text&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin-top:4px&quot;&gt;Stamp/Erase place the whole selected tile block. Fill and Eyedrop always work on a single cell (Fill uses just the block&#x27;s top-left tile). Select: drag to define a rectangle, drag again from inside it to move its content. Sprite: click empty space to place a preview-only sprite from the current stamp block, drag an existing one to move it.&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;button id=&quot;btnCopy&quot;&gt;Copy&lt;/button&gt;
        &lt;button id=&quot;btnCut&quot;&gt;Cut&lt;/button&gt;
        &lt;button id=&quot;btnPasteTool&quot;&gt;Paste&lt;/button&gt;
        &lt;button id=&quot;btnClearSel&quot;&gt;Clear&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;button id=&quot;btnRotateCW&quot; title=&quot;Rotate the selection 90° clockwise. Real hardware has no tile-rotate flag, so each affected tile&#x27;s current (post-flip) look gets baked into a brand-new rotated tile bitmap (reusing an identical one already generated where possible) and its flip flags reset to 0.&quot;&gt;Rotate CW&lt;/button&gt;
        &lt;button id=&quot;btnRotateCCW&quot; title=&quot;Rotate the selection 90° counter-clockwise (see Rotate CW for how this works).&quot;&gt;Rotate CCW&lt;/button&gt;
        &lt;button id=&quot;btnRotate180&quot; title=&quot;Rotate the selection 180°. Unlike 90°/270°, this is free on real hardware -- just both flip flags toggled, no new tiles needed.&quot;&gt;Rotate 180°&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint statusText&quot; id=&quot;selInfo&quot; style=&quot;margin-top:4px&quot;&gt;No selection — actions apply to whole map.&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px;border-top:1px solid var(--border);padding-top:6px&quot;&gt;
        &lt;button id=&quot;btnUndo&quot;&gt;Undo&lt;/button&gt;
        &lt;button id=&quot;btnRedo&quot;&gt;Redo&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;center&quot;&gt;
    &lt;div id=&quot;topStatusBar&quot;&gt;
      &lt;span id=&quot;posInfo&quot;&gt;—&lt;/span&gt;
      &lt;span id=&quot;dimInfo&quot;&gt;0x0 tiles&lt;/span&gt;
      &lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkTransparentPreview&quot; checked&gt; Preview empty cells as transparent&lt;/label&gt;
      &lt;span class=&quot;row&quot;&gt;Zoom &lt;input id=&quot;zoomVal&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;48&quot; value=&quot;18&quot; style=&quot;width:48px&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;mapScroll&quot;&gt;
      &lt;div id=&quot;mapWrap&quot;&gt;&lt;canvas id=&quot;mapCanvas&quot; width=&quot;144&quot; height=&quot;144&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;right&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Map Layers&lt;/h2&gt;
      &lt;div class=&quot;layerList&quot; id=&quot;mapLayerList&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin-top:4px&quot;&gt;Always exactly Layer 1 and Layer 2, regardless of how many tileset layers are imported. Assign each one to SCR_1 (back) or SCR_2 (front) with its dropdown -- each cell also remembers which tileset layer its tile came from. The 3rd row, Sprite Plane, is fixed to SPR_PLANE and can&#x27;t be reassigned -- click it to switch to the Sprite tool below and place preview sprites for reference.&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Sprite Preview Layer&lt;/h2&gt;
      &lt;div class=&quot;hint&quot;&gt;Preview only -- placed sprites are &lt;strong&gt;not&lt;/strong&gt; included in the C export. Uses whatever tile block is currently selected in the Stamp panel. Sprites are a free-floating list, not a grid, so they can overlap each other and the map without erasing anything.&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;label class=&quot;chk&quot;&gt;New sprite priority
          &lt;select id=&quot;spritePriority&quot; style=&quot;width:180px&quot;&gt;
            &lt;option value=&quot;behind&quot;&gt;Behind both planes (SPR_BEHIND)&lt;/option&gt;
            &lt;option value=&quot;middle&quot;&gt;Between SCR_1 and SCR_2 (SPR_MIDDLE)&lt;/option&gt;
            &lt;option value=&quot;front&quot; selected&gt;In front of everything (SPR_FRONT)&lt;/option&gt;
          &lt;/select&gt;
        &lt;/label&gt;
      &lt;/div&gt;
      &lt;label class=&quot;chk&quot; style=&quot;margin-top:6px&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkSpritesVisible&quot; checked&gt; Show sprite layer&lt;/label&gt;
      &lt;div class=&quot;layerList&quot; id=&quot;spriteList&quot; style=&quot;margin-top:6px&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint statusText&quot; id=&quot;spriteInfo&quot; style=&quot;margin-top:4px&quot;&gt;No sprites placed.&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Map Size (tiles)&lt;/h2&gt;
      &lt;div class=&quot;row&quot;&gt;
        &lt;input id=&quot;mapW&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;512&quot; value=&quot;32&quot;&gt;
        &lt;span&gt;x&lt;/span&gt;
        &lt;input id=&quot;mapH&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;512&quot; value=&quot;32&quot;&gt;
        &lt;button id=&quot;btnResizeMap&quot;&gt;Resize&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin-top:4px&quot;&gt;Grows/crops from the top-left. The real SCR1/SCR2 VRAM window is only 32x32 tiles at once — a bigger map means streaming rows/columns in at runtime as the camera scrolls.&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;

&lt;script&gt;
(function(){
&quot;use strict&quot;;

const TILE=8;
const FREE_TILE_SLOTS=384; // 512 total - 128 reserved (0-31 hardware, 32-127 BIOS sysfont)
const MAX_PALETTES_PER_PLANE=16;
const MAX_MAP_TILES=512;

/* ---------- built-in BIOS-font text tool ----------
   The real NGPC BIOS SYSFONTSET glyphs are proprietary and not redistributable, so (matching the
   convention this toolchain&#x27;s own JS emulator/transpiler already uses -- see NgpCraft_MCP&#x27;s

   same 8x8 size and the same tile-index-equals-ASCII-code convention ngpc_text_print() expects.
   Each entry is 32 hex chars = 16 bytes = one real NGPC 2bpp tile (K2GETechRef 4-3-5-1): 2 bytes
   per row, byte0 = the row&#x27;s 4 right-hand pixels (dots 4-7), byte1 = the 4 left-hand pixels (dots
   0-3), 2 bits/pixel packed MSB-first within each byte. */
const BIOS_FONT_HEX = {

  0x32:&quot;00154010400040000001000400104055&quot;,0x33:&quot;00154050400000054000404040400015&quot;,

  0x3A:&quot;00000000004000000000000000000040&quot;,0x3B:&quot;00000000004000000000000000400040&quot;,
  0x3C:&quot;00000000000040010014001400014000&quot;,0x3D:&quot;00000000000040150000401500000000&quot;,
  0x3E:&quot;00000000000000144001400100040010&quot;,0x3F:&quot;00140041000100010004000400000004&quot;,
  0x40:&quot;54000105540444110411141155100004&quot;,0x41:&quot;00054005400440044015101010101040&quot;,
  0x42:&quot;40151010101000105015101010104015&quot;,0x43:&quot;40151010104000400040104010104015&quot;,
  0x44:&quot;40151010041004100410041010104015&quot;,0x45:&quot;50150010001000104015001000105015&quot;,
  0x46:&quot;50150010001000104015001000100010&quot;,0x47:&quot;40155010104000405041104050105015&quot;,
  0x48:&quot;04100410041004105415041004100410&quot;,0x49:&quot;00100010001000100010001000100010&quot;,
  0x4A:&quot;40004000400040004000401040100005&quot;,0x4B:&quot;10104010401100150015401140101010&quot;,
  0x4C:&quot;00100010001000100010001000105015&quot;,0x4D:&quot;05140514051411111111111151114110&quot;,
  0x4E:&quot;04140414041104114410441014101410&quot;,0x4F:&quot;40151010044004400440044010104015&quot;,
  0x50:&quot;40151010101010104015001000100010&quot;,0x51:&quot;40151010044004400440044010105405&quot;,
  0x52:&quot;40151010101010104015501010101010&quot;,0x53:&quot;40051010001000055001100010104005&quot;,
  0x54:&quot;50150001000100010001000100010001&quot;,0x55:&quot;10101010101010101010101010104005&quot;,

  0x5C:&quot;00400040000000100010001000040004&quot;,0x5D:&quot;00100010001000100010001000100010&quot;,
  0x5E:&quot;00000000000500054010401000000000&quot;,0x5F:&quot;00000000000000000000000000000000&quot;,
  0x60:&quot;00000010000000000000000000000000&quot;,0x61:&quot;00000000001500410015005100410055&quot;,
  0x62:&quot;00100010401510101010101010104015&quot;,0x63:&quot;00000000001540410040004040410015&quot;,

  0x66:&quot;00140010005400100010001000100010&quot;,0x67:&quot;00000000401540404040404040404015&quot;,
  0x68:&quot;00100010401510141010101010101010&quot;,0x69:&quot;00100000001000100010001000100010&quot;,
  0x6A:&quot;00000000001000100010001000100010&quot;,0x6B:&quot;00100010401000110015001540114010&quot;,
  0x6C:&quot;00100010001000100010001000100014&quot;,0x6D:&quot;00000000551541104110411041104110&quot;,
  0x6E:&quot;00000000401510141010101010101010&quot;,0x6F:&quot;00000000001540404040404040400015&quot;,
  0x70:&quot;00000000401510101010101010104015&quot;,0x71:&quot;00000000401540404040404040404015&quot;,
  0x72:&quot;00000000001500100010001000100010&quot;,0x73:&quot;00000000005400410050000500410055&quot;,
  0x74:&quot;00100010005400100010001000100014&quot;,0x75:&quot;00000000101010101010101050105005&quot;,
  0x76:&quot;00000000404040500011001100150004&quot;,0x77:&quot;00000000414144414411441414141014&quot;,
  0x78:&quot;00000000004100110014001400114041&quot;,0x79:&quot;00000000404040500011001100150004&quot;,
  0x7A:&quot;00000000401540010001000400144015&quot;,0x7B:&quot;00100010001000100010001000100010&quot;,
  0x7C:&quot;00100010001000100010001000100010&quot;,0x7D:&quot;00100010001000100010001000100010&quot;,
  0x7E:&quot;00000000000000001014401100000000&quot;,0x7F:&quot;00004055405140404044405040514055&quot;,
};
const FONT_LAYER_NAME=&#x27;BIOS Font (ASCII 32-127)&#x27;;
function decodeFontGlyph(hex){
  const bytes=new Uint8Array(16);
  for(let i=0;i&lt;16;i++) bytes[i]=parseInt(hex.slice(i*2,i*2+2),16);
  const px=new Uint8Array(TILE*TILE);
  for(let py=0;py&lt;TILE;py++){
    for(let x=0;x&lt;TILE;x++){
      const byte=bytes[py*2+(x&lt;4?1:0)];
      const shift=(3-(x&amp;3))*2;
      px[py*TILE+x]=(byte&gt;&gt;&gt;shift)&amp;3;
    }
  }
  return px;
}
// Lazily builds (or restores, if a prior &quot;Replace&quot; tileset import wiped it) the font tileset
// layer and returns its index -- a real tileset.layers[] entry so it flows through every
// existing stamp/select/rotate/export code path for free, exactly like an imported tileset.
function ensureFontLayer(){
  if(!tileset) tileset={ sourceName:&#x27;(no tileset imported)&#x27;, paletteBank:[], layers:[] };
  let idx=tileset.layers.findIndex(l=&gt;l.name===FONT_LAYER_NAME);
  if(idx&gt;=0) return idx;
  const fontPalIdx=tileset.paletteBank.length;
  tileset.paletteBank.push({name:&#x27;BIOS Font&#x27;,colors:[{r:0,g:0,b:0},{r:5,g:5,b:5},{r:10,g:10,b:10},{r:15,g:15,b:15}]});
  const tiles=[];
  for(let cp=0x20;cp&lt;=0x7F;cp++) tiles.push({pixels:decodeFontGlyph(BIOS_FONT_HEX[cp]), defaultPalette:fontPalIdx});
  tileset.layers.push({name:FONT_LAYER_NAME, tileGridW:16, tileGridH:6, tiles});
  return tileset.layers.length-1;
}

function clamp(v,a,b){ return v&lt;a?a:(v&gt;b?b:v); }
function css255(c){ return `rgb(${c.r*17},${c.g*17},${c.b*17})`; }
function hexWord(c){ return &#x27;0x0&#x27;+((c.r&amp;0xF)|((c.g&amp;0xF)&lt;&lt;4)|((c.b&amp;0xF)&lt;&lt;8)).toString(16).toUpperCase().padStart(3,&#x27;0&#x27;); }
function sanitizeIdent(s){ return (String(s||&#x27;x&#x27;).toLowerCase().replace(/[^a-z0-9_]+/g,&#x27;_&#x27;).replace(/^_+|_+$/g,&#x27;&#x27;))||&#x27;x&#x27;; }

/* ---------- in-page modal (never uses window.confirm/alert -- see NGPC Tile Editor&#x27;s own notes on why) ---------- */
function showModal(message,buttons){
  return new Promise(resolve=&gt;{
    const overlay=document.getElementById(&#x27;modalOverlay&#x27;);
    document.getElementById(&#x27;modalMessage&#x27;).textContent=message;
    document.getElementById(&#x27;modalExtra&#x27;).innerHTML=&#x27;&#x27;;
    const wrap=document.getElementById(&#x27;modalButtons&#x27;);
    wrap.innerHTML=&#x27;&#x27;;
    let escapeValue=false;
    buttons.forEach(b=&gt;{
      const el=document.createElement(&#x27;button&#x27;);
      el.textContent=b.label;
      if(b.primary){ el.className=&#x27;primary&#x27;; escapeValue=b.value; }
      if(b.danger) el.classList.add(&#x27;danger&#x27;);
      el.onclick=()=&gt;{ overlay.hidden=true; document.removeEventListener(&#x27;keydown&#x27;,onKey); resolve(b.value); };
      wrap.appendChild(el);
    });
    function onKey(e){
      if(e.key===&#x27;Escape&#x27;){ overlay.hidden=true; document.removeEventListener(&#x27;keydown&#x27;,onKey); resolve(escapeValue===undefined?false:escapeValue); }
    }
    document.addEventListener(&#x27;keydown&#x27;,onKey);
    overlay.hidden=false;
  });
}
function modalConfirm(message){ return showModal(message,[{label:&#x27;Cancel&#x27;,value:false},{label:&#x27;OK&#x27;,value:true,primary:true}]); }
function modalAlert(message){ return showModal(message,[{label:&#x27;OK&#x27;,value:true,primary:true}]); }
function showLayerPickModal(names){
  return showModal(&#x27;Multiple tileset layers found in this file -- which one first? (all are imported either way, this just picks the initially active one)&#x27;,
    names.map((n,i)=&gt;({label:n,value:i,primary:i===0})));
}

/* ---------- state ---------- */
let tileset=null; // {sourceName, paletteBank:[{name,colors}], layers:[{name, tileGridW, tileGridH, tiles:[{pixels:Uint8Array(64),defaultPalette}]}]}
let mapState=null; // {name, mapW, mapH, layers:[{name,visible,tileId:Int16Array,pal:Int16Array,flip:Uint8Array}]}
let activeTilesetLayer=0;
let activeMapLayer=0;
let stampSel=null; // {x0,y0,x1,y1} tileset tile-grid coords (inclusive) -- the current stamp, 1 or more tiles
let tsDragStart=null; // {tx,ty} while drag-selecting on the tileset picker
let stampHoverCell=null; // {x,y} map-cell coords the stamp block would land at, for the hover ghost preview
let currentFlipH=false, currentFlipV=false;
let currentRotation=0; // 0/90/180/270 -- CW degrees applied to the stamp on top of flip; see resolvedStampCells
let tool=&#x27;stamp&#x27;;
let drawing=false, drawButton=0;
let selection=null; // {x0,y0,x1,y1} map-cell coords, inclusive
let dragStartCell=null;
let clipboard=null; // {w,h,tileId:Int16Array,pal:Int16Array,srcLayer:Int16Array,flip:Uint8Array}
let undoStack=[], redoStack=[];
const UNDO_LIMIT=60;
let zoom=18;
// Move-existing-selection state (tool===&#x27;select&#x27;, dragging from inside the current selection
// instead of defining a new one) -- mirrors the Tile Editor&#x27;s own click-inside-selection-to-move.
let moveBuffer=null; // {w,h,tileId,pal,srcLayer,flip} extracted from the layer at drag start
let moveOrigin=null; // {x,y} top-left the block was extracted from
let moveDragStart=null; // {x,y} cell where the move-drag started
let moveOffset={dx:0,dy:0};
// Sprite preview layer -- placed instances are a flat list, not a grid, so they can freely overlap.
let selectedSpriteIdx=-1;
let moveSpriteActive=null; // {idx,x,y} while dragging an existing sprite instance
let spriteDragStart=null; // {x,y} cell where a sprite move-drag started
let spritePriority=&#x27;front&#x27;; // priority applied to the NEXT placed sprite

function mapW(){ return mapState.mapW; }
function mapH(){ return mapState.mapH; }
function currentMapLayer(){ return mapState.layers[activeMapLayer]; }
function tilesetLayer(i){ return tileset.layers[i]; }

// Every map cell remembers WHICH tileset layer its tile came from (srcLayer), not just a tile
// index -- this decouples the 2 fixed map planes from however many tileset layers happen to be
// imported, so either plane can freely mix tiles from any tileset layer.
// The layer&#x27;s display NAME (Layer 1/Layer 2) is separate from its scrTarget (SCR_1/SCR_2) --
// the name is just a fixed generic label, scrTarget is the user-assignable hardware plane that
// controls both render/export order and which array names come out in the generated C.
function makeMapLayer(name,scrTarget,w,h){
  return { name, scrTarget, visible:true,
    tileId:new Int16Array(w*h).fill(-1),
    srcLayer:new Int16Array(w*h).fill(-1), // tileset.layers[] index this cell&#x27;s tile came from, -1=empty
    pal:new Int16Array(w*h).fill(-1),
    flip:new Uint8Array(w*h) };
}
function scrLayer(target){ return mapState.layers.find(l=&gt;l.scrTarget===target); }
// Swaps the OTHER layer&#x27;s target when one layer is assigned a target the other already holds --
// with exactly 2 layers and 2 hardware planes, this keeps the assignment always a valid 1:1
// mapping with no &quot;both layers on SCR_1&quot; dead state to design around.
function setLayerScrTarget(layer,target){
  const other=mapState.layers.find(l=&gt;l!==layer);
  if(other &amp;&amp; other.scrTarget===target) other.scrTarget = layer.scrTarget;
  layer.scrTarget=target;
}
function resizeMapTo(newW,newH){
  const oldW=mapState.mapW, oldH=mapState.mapH;
  mapState.layers.forEach(layer=&gt;{
    const nt=new Int16Array(newW*newH).fill(-1), ns=new Int16Array(newW*newH).fill(-1),
          np=new Int16Array(newW*newH).fill(-1), nf=new Uint8Array(newW*newH);
    for(let y=0;y&lt;Math.min(oldH,newH);y++)for(let x=0;x&lt;Math.min(oldW,newW);x++){
      const so=y*oldW+x, dO=y*newW+x;
      nt[dO]=layer.tileId[so]; ns[dO]=layer.srcLayer[so]; np[dO]=layer.pal[so]; nf[dO]=layer.flip[so];
    }
    layer.tileId=nt; layer.srcLayer=ns; layer.pal=np; layer.flip=nf;
  });
  mapState.mapW=newW; mapState.mapH=newH;
}
// Fills in srcLayer/scrTarget for map data saved before those fields existed: assumes the old
// rigid pairing that was in effect at the time (map layer i &lt;- tileset layer i, and layer 0/1
// named literally &quot;SCR_1&quot;/&quot;SCR_2&quot; which is how scrTarget is recovered for old saves).
function normalizeLoadedLayers(rawLayers,w,h){
  const base=rawLayers.map((l,i)=&gt;{
    const tileId=Int16Array.from(l.tileId);
    const srcLayer = l.srcLayer ? Int16Array.from(l.srcLayer) : tileId.map(t=&gt;t&gt;=0?i:-1);
    const scrTarget = l.scrTarget || (l.name===&#x27;SCR_2&#x27; ? &#x27;SCR_2&#x27; : (i===0?&#x27;SCR_1&#x27;:&#x27;SCR_2&#x27;));
    return { name:&#x27;Layer &#x27;+(i+1), scrTarget, visible:l.visible!==false, tileId, srcLayer,
      pal:Int16Array.from(l.pal), flip:Uint8Array.from(l.flip) };
  });
  while(base.length&lt;2) base.push(makeMapLayer(&#x27;Layer &#x27;+(base.length+1), base.length===0?&#x27;SCR_1&#x27;:&#x27;SCR_2&#x27;, w,h));
  return base;
}

/* ---------- undo/redo ---------- */
function snapshotMap(){
  return { mapW:mapState.mapW, mapH:mapState.mapH,
    layers: mapState.layers.map(l=&gt;({name:l.name,scrTarget:l.scrTarget,visible:l.visible,
      tileId:l.tileId.slice(), srcLayer:l.srcLayer.slice(), pal:l.pal.slice(), flip:l.flip.slice()})),
    sprites: mapState.sprites.map(s=&gt;({x:s.x,y:s.y,w:s.w,h:s.h,srcLayer:s.srcLayer,priority:s.priority,
      cells:s.cells.map(c=&gt;({...c}))})) };
}
function pushUndo(){
  undoStack.push(snapshotMap());
  if(undoStack.length&gt;UNDO_LIMIT) undoStack.shift();
  redoStack.length=0;
}
function applySnapshot(s){
  mapState.mapW=s.mapW; mapState.mapH=s.mapH;
  mapState.layers=s.layers.map(l=&gt;({name:l.name,scrTarget:l.scrTarget,visible:l.visible,
    tileId:l.tileId.slice(), srcLayer:l.srcLayer.slice(), pal:l.pal.slice(), flip:l.flip.slice()}));
  mapState.sprites=s.sprites.map(spr=&gt;({x:spr.x,y:spr.y,w:spr.w,h:spr.h,srcLayer:spr.srcLayer,priority:spr.priority,
    cells:spr.cells.map(c=&gt;({...c}))}));
  activeMapLayer=clamp(activeMapLayer,0,mapState.layers.length-1);
  selectedSpriteIdx=-1;
  syncMapInputs(); renderAllLayerUI(); renderSpriteList(); render(); scheduleAutosave();
}
function undo(){ if(!undoStack.length)return; redoStack.push(snapshotMap()); applySnapshot(undoStack.pop()); }
function redo(){ if(!redoStack.length)return; undoStack.push(snapshotMap()); applySnapshot(redoStack.pop()); }

/* ---------- New / reset ---------- */
// The map ALWAYS has exactly 2 layers (Layer 1, Layer 2), regardless of how many layers the
// imported tileset has -- each map cell records its OWN srcLayer, so either plane can freely mix
// tiles pulled from any tileset layer. Layer 1/Layer 2 default to SCR_1/SCR_2 but either can be
// individually reassigned to the other hardware plane via the Map Layers panel.
function freshMap(w,h){
  return { name:&#x27;my_map&#x27;, mapW:w, mapH:h,
    layers: [makeMapLayer(&#x27;Layer 1&#x27;,&#x27;SCR_1&#x27;,w,h), makeMapLayer(&#x27;Layer 2&#x27;,&#x27;SCR_2&#x27;,w,h)],
    sprites: [] };
}
document.getElementById(&#x27;btnNewMap&#x27;).onclick=async ()=&gt;{
  const ok=await modalConfirm(&#x27;Start a new blank map at 32x32 tiles? Unsaved changes will be lost.&#x27;);
  if(!ok) return;
  mapState=freshMap(32,32);
  activeMapLayer=0; selection=null; selectedSpriteIdx=-1; undoStack.length=0; redoStack.length=0;
  syncMapInputs(); renderAllLayerUI(); renderSpriteList(); render(); scheduleAutosave();
};

/* ---------- import tileset (reads an NGPC Tile Editor project .json) ---------- */
document.getElementById(&#x27;btnImportTileset&#x27;).onclick=()=&gt;document.getElementById(&#x27;fileImportTileset&#x27;).click();
document.getElementById(&#x27;fileImportTileset&#x27;).onchange=(e)=&gt;{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ()=&gt;{
    let obj;
    try{ obj=JSON.parse(reader.result); }
    catch(err){ await modalAlert(&#x27;That file is not valid JSON.&#x27;); return; }
    await importTileset(obj, file.name);
  };
  reader.readAsText(file);
  e.target.value=&#x27;&#x27;;
};
async function importTileset(obj, fileName){
  // Accepts a single-asset project (version 2: gridW/gridH/layers) or a multi-asset project
  // (version 4: assets[], each with its own grid size) -- every asset&#x27;s layers become tileset layers.
  const parts = (obj &amp;&amp; obj.version===4 &amp;&amp; Array.isArray(obj.assets) &amp;&amp; obj.assets.length)
    ? obj.assets.map(a=&gt;({prefix: obj.assets.length&gt;1 ? (a.name+&#x27; / &#x27;) : &#x27;&#x27;, gw:a.gridW, gh:a.gridH, layers:a.layers||[]}))
    : (obj &amp;&amp; Array.isArray(obj.layers) &amp;&amp; obj.gridW &amp;&amp; obj.gridH) ? [{prefix:&#x27;&#x27;, gw:obj.gridW, gh:obj.gridH, layers:obj.layers}] : null;
  if(!parts || !Array.isArray(obj.paletteBank)){
    await modalAlert(&#x27;This does not look like an NGPC Tile Editor project file (missing gridW/gridH/paletteBank/layers).&#x27;);
    return;
  }
  const paletteBank=obj.paletteBank.map(p=&gt;({name:p.name,colors:p.colors.map(c=&gt;({r:c.r,g:c.g,b:c.b}))}));
  const layers=[];
  parts.forEach(pt=&gt;{
    const gw=pt.gw, gh=pt.gh;
    pt.layers.forEach(l=&gt;{
      const pixels=Uint8Array.from(l.pixels);
      const tilePalette=Int16Array.from(l.tilePalette);
      const pixW=gw*TILE;
      const tiles=[];
      for(let ty=0;ty&lt;gh;ty++)for(let tx=0;tx&lt;gw;tx++){
        const buf=new Uint8Array(TILE*TILE);
        for(let y=0;y&lt;TILE;y++)for(let x=0;x&lt;TILE;x++){
          buf[y*TILE+x]=pixels[(ty*TILE+y)*pixW+(tx*TILE+x)];
        }
        const ov=tilePalette[ty*gw+tx];
        tiles.push({pixels:buf, defaultPalette: ov&gt;=0?ov:l.defaultPalette});
      }
      layers.push({name:pt.prefix+l.name, tileGridW:gw, tileGridH:gh, tiles});
    });
  });
  let mode=&#x27;replace&#x27;;
  if(tileset){
    mode=await showModal(&#x27;A tileset is already imported. Replace it entirely, or append this file\&#x27;s layers to the end of the current layer list (existing map cells keep pointing at their original layers either way)?&#x27;,
      [{label:&#x27;Cancel&#x27;,value:&#x27;cancel&#x27;},{label:&#x27;Append&#x27;,value:&#x27;append&#x27;},{label:&#x27;Replace&#x27;,value:&#x27;replace&#x27;,primary:true}]);
    if(mode===&#x27;cancel&#x27;||mode===false) return;
  }
  if(mode===&#x27;append&#x27;){
    const palOffset=tileset.paletteBank.length;
    const offsetLayers=layers.map(l=&gt;({...l, tiles:l.tiles.map(t=&gt;({pixels:t.pixels, defaultPalette:t.defaultPalette+palOffset}))}));
    tileset.paletteBank=tileset.paletteBank.concat(paletteBank);
    tileset.layers=tileset.layers.concat(offsetLayers);
    tileset.sourceName=tileset.sourceName+&#x27; + &#x27;+fileName;
    activeTilesetLayer=tileset.layers.length-layers.length;
  } else {
    tileset={ sourceName: fileName, paletteBank, layers };
    activeTilesetLayer=0;
  }
  stampSel=null;
  if(!mapState) mapState=freshMap(32,32);
  document.getElementById(&#x27;tilesetInfo&#x27;).textContent=`${tileset.sourceName}: ${tileset.layers.length} layer(s) total, ${paletteBank.length===tileset.paletteBank.length?paletteBank.length:tileset.paletteBank.length} palette(s) total`;
  renderTilesetLayerTabs();
  renderStampPaletteOptions();
  renderTextPaletteOptions();
  renderAllLayerUI();
  syncMapInputs();
  renderTilesetCanvas();
  renderStampPreview();
  updateTileInfo();
  render();
  scheduleAutosave();
}

/* ---------- tileset picker canvas ---------- */
const tsCanvas=document.getElementById(&#x27;tilesetCanvas&#x27;);
const tsCtx=tsCanvas.getContext(&#x27;2d&#x27;);
const TS_ZOOM=16;
function renderTilesetCanvas(){
  if(!tileset){ tsCanvas.width=128; tsCanvas.height=128; tsCtx.clearRect(0,0,128,128); return; }
  const layer=tilesetLayer(activeTilesetLayer);
  const w=layer.tileGridW*TILE, h=layer.tileGridH*TILE;
  tsCanvas.width=w*TS_ZOOM; tsCanvas.height=h*TS_ZOOM;
  tsCtx.imageSmoothingEnabled=false;
  tsCtx.clearRect(0,0,tsCanvas.width,tsCanvas.height);
  layer.tiles.forEach((tile,ti)=&gt;{
    const tx=ti%layer.tileGridW, ty=Math.floor(ti/layer.tileGridW);
    const pal=tileset.paletteBank[tile.defaultPalette] || tileset.paletteBank[0];
    for(let y=0;y&lt;TILE;y++)for(let x=0;x&lt;TILE;x++){
      const v=tile.pixels[y*TILE+x];
      if(v===0) continue;
      tsCtx.fillStyle=css255(pal.colors[v]);
      tsCtx.fillRect((tx*TILE+x)*TS_ZOOM,(ty*TILE+y)*TS_ZOOM,TS_ZOOM,TS_ZOOM);
    }
  });
  // grid lines
  tsCtx.strokeStyle=&#x27;rgba(255,255,255,0.12)&#x27;; tsCtx.lineWidth=1;
  for(let tx=0;tx&lt;=layer.tileGridW;tx++){ tsCtx.beginPath(); tsCtx.moveTo(tx*TILE*TS_ZOOM+0.5,0); tsCtx.lineTo(tx*TILE*TS_ZOOM+0.5,h*TS_ZOOM); tsCtx.stroke(); }
  for(let ty=0;ty&lt;=layer.tileGridH;ty++){ tsCtx.beginPath(); tsCtx.moveTo(0,ty*TILE*TS_ZOOM+0.5); tsCtx.lineTo(w*TS_ZOOM,ty*TILE*TS_ZOOM+0.5); tsCtx.stroke(); }
  // selection highlight (whole block, not just one tile)
  if(stampSel){
    const bx=stampSel.x0*TILE*TS_ZOOM, by=stampSel.y0*TILE*TS_ZOOM;
    const bw=(stampSel.x1-stampSel.x0+1)*TILE*TS_ZOOM, bh=(stampSel.y1-stampSel.y0+1)*TILE*TS_ZOOM;
    tsCtx.strokeStyle=&#x27;#5fb3ff&#x27;; tsCtx.lineWidth=2;
    tsCtx.strokeRect(bx+1,by+1,bw-2,bh-2);
  }
}
function tilesetClickToCell(evt){
  const layer=tilesetLayer(activeTilesetLayer);
  const r=tsCanvas.getBoundingClientRect();
  const scaleX=tsCanvas.width/r.width, scaleY=tsCanvas.height/r.height;
  const px=(evt.clientX-r.left)*scaleX, py=(evt.clientY-r.top)*scaleY;
  const tx=clamp(Math.floor(px/(TILE*TS_ZOOM)),0,layer.tileGridW-1);
  const ty=clamp(Math.floor(py/(TILE*TS_ZOOM)),0,layer.tileGridH-1);
  return {tx,ty};
}

  const el=document.getElementById(&#x27;tileInfo&#x27;);

/* ---------- stamp preview + palette override + flip ---------- */
const stampCanvas=document.getElementById(&#x27;stampPreview&#x27;);
const stampCtx=stampCanvas.getContext(&#x27;2d&#x27;);
// &quot;Inherit tile default&quot; resolves PER TILE (each cell in a multi-tile stamp may have its own
// default palette); an explicit override applies that one palette to every cell in the stamp.
function resolveCellPalette(tile){
  const palSel=document.getElementById(&#x27;stampPalOverride&#x27;).value;
  const palIdx = palSel===&#x27;-1&#x27; ? tile.defaultPalette : +palSel;
  return { pal: tileset.paletteBank[palIdx]||tileset.paletteBank[0], palIdx: palSel===&#x27;-1&#x27;?-1:+palSel };
}
// Flipping a multi-tile stamp mirrors the WHOLE block: reverses cell order across the block AND
// flips each individual tile&#x27;s own pixels -- not just flipping each tile in place, which would
// leave the tiles in their original relative positions and look wrong for anything but a 1x1 stamp.
// Rotation (currentRotation, 0/90/180/270) is layered on top the same way Rotate CW/CCW/180 already
// work for an existing map selection (see rotateSelection below): 180 is free on real hardware (just
// both flip bits), but 90/270 need each affected tile&#x27;s current (post-flip) look baked into a new
// rotated tile bitmap via getOrCreateRotatedTile, deduped so repeated stamps of the same look don&#x27;t
// keep growing the tileset.
function resolvedStampCells(){
  if(!tileset || !stampSel) return null;
  const layer=tilesetLayer(activeTilesetLayer);
  const w=stampSel.x1-stampSel.x0+1, h=stampSel.y1-stampSel.y0+1;
  const tileIdArr=new Int16Array(w*h), flipArr=new Uint8Array(w*h);
  for(let ry=0;ry&lt;h;ry++)for(let rx=0;rx&lt;w;rx++){
    const srcRx = currentFlipH ? (w-1-rx) : rx;
    const srcRy = currentFlipV ? (h-1-ry) : ry;
    const tx=stampSel.x0+srcRx, ty=stampSel.y0+srcRy;
    tileIdArr[ry*w+rx]=ty*layer.tileGridW+tx;
    flipArr[ry*w+rx]=(currentFlipH?1:0)|(currentFlipV?2:0);
  }
  let nw=w, nh=h, outTileId=tileIdArr, outFlip=flipArr;
  if(currentRotation===180){
    outTileId=new Int16Array(w*h); outFlip=new Uint8Array(w*h);
    for(let i=0;i&lt;w*h;i++){
      const di=w*h-1-i;
      outTileId[di]=tileIdArr[i];
      outFlip[di]=flipArr[i]^3;
    }
  } else if(currentRotation===90 || currentRotation===270){
    const rotFn = currentRotation===90 ? rotateGridCW : rotateGridCCW;
    const rTile=rotFn(w,h,tileIdArr,Int16Array);
    const rFlip=rotFn(w,h,flipArr,Uint8Array);
    nw=rTile.w; nh=rTile.h;
    outTileId=new Int16Array(nw*nh); outFlip=new Uint8Array(nw*nh);
    for(let i=0;i&lt;rTile.data.length;i++){
      const srcTile=layer.tiles[rTile.data[i]];
      const fh=!!(rFlip.data[i]&amp;1), fv=!!(rFlip.data[i]&amp;2);
      const eff=applyFlipToPixels(srcTile.pixels,fh,fv);
      const rotatedPixels=rotFn(TILE,TILE,eff,Uint8Array).data;
      outTileId[i]=getOrCreateRotatedTile(activeTilesetLayer, rotatedPixels, srcTile.defaultPalette);
      outFlip[i]=0; // baked into the new tile&#x27;s own pixels
    }
  }
  const cells=new Array(nw*nh);
  for(let i=0;i&lt;nw*nh;i++) cells[i]={ tileIdx:outTileId[i], flipH:!!(outFlip[i]&amp;1), flipV:!!(outFlip[i]&amp;2) };
  return {w:nw,h:nh,cells};
}
function renderStampPreview(){
  const rc=resolvedStampCells();
  if(!rc){ stampCanvas.width=48; stampCanvas.height=48; stampCtx.clearRect(0,0,48,48); return; }
  const layer=tilesetLayer(activeTilesetLayer);
  const Z=6; // px per source pixel -- matches the old fixed 48x48 preview exactly for a single tile
  stampCanvas.width=rc.w*TILE*Z; stampCanvas.height=rc.h*TILE*Z;
  stampCtx.imageSmoothingEnabled=false;
  stampCtx.clearRect(0,0,stampCanvas.width,stampCanvas.height);
  for(let ry=0;ry&lt;rc.h;ry++)for(let rx=0;rx&lt;rc.w;rx++){
    const cell=rc.cells[ry*rc.w+rx];
    const tile=layer.tiles[cell.tileIdx];
    const {pal}=resolveCellPalette(tile);
    drawTileAt(stampCtx, tile, pal, cell.flipH, cell.flipV, rx*TILE*Z, ry*TILE*Z, Z);
  }
}

  if([...sel.options].some(o=&gt;o.value===prev)) sel.value=prev;

// Places one tile per character of the Text input, left-to-right starting at (x0,y0) on the
// active map layer -- clips at the map edge like stampAt. Characters outside the printable ASCII
// range the font covers (0x20-0x7F) fall back to &#x27;?&#x27;, same as ngpc_text_print&#x27;s own convention.
function placeText(x0,y0){
  const str=document.getElementById(&#x27;textInput&#x27;).value;
  if(!str) return;
  const hadLayerIdx=tileset?tileset.layers.findIndex(l=&gt;l.name===FONT_LAYER_NAME):-1;
  const fontLayerIdx=ensureFontLayer();
  if(fontLayerIdx!==hadLayerIdx){ renderTilesetLayerTabs(); renderStampPaletteOptions(); renderTextPaletteOptions(); }
  const fLayer=tileset.layers[fontLayerIdx];
  const layer=currentMapLayer();
  const palSel=document.getElementById(&#x27;textPalOverride&#x27;).value;
  for(let i=0;i&lt;str.length;i++){
    const dx=x0+i, dy=y0;
    if(!inBounds(dx,dy)) continue;
    let code=str.charCodeAt(i);
    if(code&lt;0x20||code&gt;0x7F) code=0x3F; // &#x27;?&#x27;
    const tileIdx=code-0x20;
    const idx=cellIndex(dx,dy);
    layer.tileId[idx]=tileIdx;
    layer.srcLayer[idx]=fontLayerIdx;
    layer.pal[idx]=palSel===&#x27;-1&#x27; ? -1 : +palSel;
    layer.flip[idx]=0;
  }
}

function renderBudget(){
  const el=document.getElementById(&#x27;budgetInfo&#x27;);
  if(!mapState){ el.textContent=&#x27;Import a tileset and build a map to see budget usage.&#x27;; return; }
  const lines=mapState.layers.map((l,i)=&gt;{
    const usedTiles=new Set(); const usedPals=new Set();
    for(let k=0;k&lt;l.tileId.length;k++){
      const t=l.tileId[k]; if(t&lt;0) continue;
      const sl=l.srcLayer[k];
      usedTiles.add(sl+&#x27;:&#x27;+t); // distinct tileset layers can reuse the same numeric tile index
      const srcTileset = tileset &amp;&amp; tileset.layers[sl];
      const p = l.pal[k]&gt;=0 ? l.pal[k] : (srcTileset ? srcTileset.tiles[t].defaultPalette : 0);
      usedPals.add(p);
    }
    const tOver = usedTiles.size&gt;FREE_TILE_SLOTS, pOver = usedPals.size&gt;MAX_PALETTES_PER_PLANE;
    return `&quot;${l.name}&quot; (${l.scrTarget}): ${usedTiles.size} unique tile(s) `+
      `&lt;span class=&quot;${tOver?&#x27;statBad&#x27;:&#x27;statOk&#x27;}&quot;&gt;${tOver?&#x27;(over the ~&#x27;+FREE_TILE_SLOTS+&#x27; free budget!)&#x27;:&#x27;(ok)&#x27;}&lt;/span&gt;, `+
      `${usedPals.size} palette(s) `+
      `&lt;span class=&quot;${pOver?&#x27;statBad&#x27;:&#x27;statOk&#x27;}&quot;&gt;${pOver?&#x27;(over the &#x27;+MAX_PALETTES_PER_PLANE+&#x27;-palette limit!)&#x27;:&#x27;(ok)&#x27;}&lt;/span&gt;`;
  });
  el.innerHTML=lines.join(&#x27;&lt;br&gt;&#x27;);
}

  resizeMapTo(nw,nh);
  selection=null;
  mapState.sprites.forEach(s=&gt;{ s.x=clamp(s.x,0,Math.max(0,nw-s.w)); s.y=clamp(s.y,0,Math.max(0,nh-s.h)); });
  syncMapInputs(); renderSpriteList(); render(); scheduleAutosave();
};

/* ---------- render map canvas ---------- */
const canvas=document.getElementById(&#x27;mapCanvas&#x27;);
const ctx=canvas.getContext(&#x27;2d&#x27;);
function drawTileAt(ctxTarget, tile, pal, flipH, flipV, dx, dy, z){
  for(let y=0;y&lt;TILE;y++)for(let x=0;x&lt;TILE;x++){
    const sx=flipH?TILE-1-x:x, sy=flipV?TILE-1-y:y;
    const v=tile.pixels[sy*TILE+sx];
    if(v===0) continue;
    ctxTarget.fillStyle=css255(pal.colors[v]);
    ctxTarget.fillRect(dx+x*z,dy+y*z,z,z);
  }
}
function render(){
  if(!mapState){ canvas.width=144; canvas.height=144; ctx.clearRect(0,0,144,144); return; }
  const w=mapState.mapW, h=mapState.mapH;
  canvas.width=w*TILE*zoom; canvas.height=h*TILE*zoom;
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const transPrev=document.getElementById(&#x27;chkTransparentPreview&#x27;).checked;

  function drawMapLayer(layer,li){
    if(!layer.visible) return;
    ctx.globalAlpha=(li===activeMapLayer)?1:0.35;
    for(let y=0;y&lt;h;y++)for(let x=0;x&lt;w;x++){
      const idx=y*w+x;
      const t=layer.tileId[idx];
      if(t&lt;0){ continue; } // empty cell -- always shows backdrop/layer-below regardless of transPrev
      const sl = tileset ? tileset.layers[layer.srcLayer[idx]] : null;
      if(!sl || !sl.tiles[t]) continue;
      const tile=sl.tiles[t];
      const palIdx = layer.pal[idx]&gt;=0 ? layer.pal[idx] : tile.defaultPalette;
      const pal=tileset.paletteBank[palIdx]||tileset.paletteBank[0];
      const flipH=!!(layer.flip[idx]&amp;1), flipV=!!(layer.flip[idx]&amp;2);
      drawTileAt(ctx, tile, pal, flipH, flipV, x*TILE*zoom, y*TILE*zoom, zoom);
    }
  }
  // Sprite preview layer: real hardware OAM priority bits give exactly 3 z-order slots relative to
  // the 2 fixed scroll planes -- behind both, between them, or in front of everything. Sprites are
  // a separate list (not a grid), so placements can freely overlap each other and the map.
  function drawSpriteGroup(prio){
    if(!document.getElementById(&#x27;chkSpritesVisible&#x27;).checked) return;
    ctx.globalAlpha=1;
    mapState.sprites.forEach((spr,si)=&gt;{
      if(spr.priority!==prio) return;
      const sl = tileset ? tileset.layers[spr.srcLayer] : null;
      if(!sl) return;
      const sx = (moveSpriteActive &amp;&amp; moveSpriteActive.idx===si) ? moveSpriteActive.x : spr.x;
      const sy = (moveSpriteActive &amp;&amp; moveSpriteActive.idx===si) ? moveSpriteActive.y : spr.y;
      spr.cells.forEach((cell,ci)=&gt;{
        const cx=ci%spr.w, cy=Math.floor(ci/spr.w);
        const tile=sl.tiles[cell.tileIdx]; if(!tile) return;
        const pal=tileset.paletteBank[cell.palIdx]||tileset.paletteBank[0];
        drawTileAt(ctx, tile, pal, cell.flipH, cell.flipV, (sx+cx)*TILE*zoom, (sy+cy)*TILE*zoom, zoom);
      });
      if(si===selectedSpriteIdx || (moveSpriteActive&amp;&amp;moveSpriteActive.idx===si)){
        ctx.save(); ctx.strokeStyle=&#x27;#ff9f5f&#x27;; ctx.lineWidth=2;
        ctx.strokeRect(sx*TILE*zoom+1, sy*TILE*zoom+1, spr.w*TILE*zoom-2, spr.h*TILE*zoom-2);
        ctx.restore();
      }
    });
  }
  // Draw order follows each layer&#x27;s scrTarget (SCR_1 back, SCR_2 front), NOT array order --
  // either Layer 1 or Layer 2 can be assigned to either plane via the Map Layers panel.
  const backLayer=scrLayer(&#x27;SCR_1&#x27;), frontLayer=scrLayer(&#x27;SCR_2&#x27;);
  drawSpriteGroup(&#x27;behind&#x27;);
  drawMapLayer(backLayer, mapState.layers.indexOf(backLayer));
  drawSpriteGroup(&#x27;middle&#x27;);
  drawMapLayer(frontLayer, mapState.layers.indexOf(frontLayer));
  drawSpriteGroup(&#x27;front&#x27;);
  ctx.globalAlpha=1;

  // grid lines
  ctx.strokeStyle=&#x27;rgba(255,255,255,0.10)&#x27;; ctx.lineWidth=1;
  for(let x=0;x&lt;=w;x++){ ctx.beginPath(); ctx.moveTo(x*TILE*zoom+0.5,0); ctx.lineTo(x*TILE*zoom+0.5,h*TILE*zoom); ctx.stroke(); }
  for(let y=0;y&lt;=h;y++){ ctx.beginPath(); ctx.moveTo(0,y*TILE*zoom+0.5); ctx.lineTo(w*TILE*zoom,y*TILE*zoom+0.5); ctx.stroke(); }
  // 32x32 hardware VRAM window outline
  if(w&gt;32||h&gt;32){
    ctx.strokeStyle=&#x27;rgba(255,159,95,0.7)&#x27;; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.strokeRect(1,1,Math.min(32,w)*TILE*zoom-2,Math.min(32,h)*TILE*zoom-2);
    ctx.setLineDash([]);
  }
  // moving-selection ghost -- shows the extracted block following the drag before it&#x27;s dropped
  if(moveBuffer){
    const mx=clamp(moveOrigin.x+moveOffset.dx,0,w-moveBuffer.w), my=clamp(moveOrigin.y+moveOffset.dy,0,h-moveBuffer.h);
    ctx.save(); ctx.globalAlpha=0.85;
    for(let ry=0;ry&lt;moveBuffer.h;ry++)for(let rx=0;rx&lt;moveBuffer.w;rx++){
      const si=ry*moveBuffer.w+rx;
      const t=moveBuffer.tileId[si]; if(t&lt;0) continue;
      const sl=tileset?tileset.layers[moveBuffer.srcLayer[si]]:null; if(!sl||!sl.tiles[t]) continue;
      const palIdx=moveBuffer.pal[si]&gt;=0?moveBuffer.pal[si]:sl.tiles[t].defaultPalette;
      const pal=tileset.paletteBank[palIdx]||tileset.paletteBank[0];
      const flipH=!!(moveBuffer.flip[si]&amp;1), flipV=!!(moveBuffer.flip[si]&amp;2);
      drawTileAt(ctx, sl.tiles[t], pal, flipH, flipV, (mx+rx)*TILE*zoom, (my+ry)*TILE*zoom, zoom);
    }
    ctx.strokeStyle=&#x27;#5fb3ff&#x27;; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.strokeRect(mx*TILE*zoom+1, my*TILE*zoom+1, moveBuffer.w*TILE*zoom-2, moveBuffer.h*TILE*zoom-2);
    ctx.restore();
  } else if(selection){
    const sx=selection.x0*TILE*zoom, sy=selection.y0*TILE*zoom;
    const sw=(selection.x1-selection.x0+1)*TILE*zoom, sh=(selection.y1-selection.y0+1)*TILE*zoom;
    ctx.save(); ctx.strokeStyle=&#x27;#5fb3ff&#x27;; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.strokeRect(sx+1,sy+1,sw-2,sh-2); ctx.restore();
  }
  // stamp/sprite hover ghost -- shows where a (possibly multi-tile) block would land before you click
  if((tool===&#x27;stamp&#x27;||tool===&#x27;sprite&#x27;) &amp;&amp; stampHoverCell &amp;&amp; stampSel &amp;&amp; !drawing &amp;&amp; !moveSpriteActive){
    const rc=resolvedStampCells();
    const srcLayer=tilesetLayer(activeTilesetLayer);
    ctx.save(); ctx.globalAlpha=0.55;
    for(let ry=0;ry&lt;rc.h;ry++)for(let rx=0;rx&lt;rc.w;rx++){
      const cell=rc.cells[ry*rc.w+rx];
      const tile=srcLayer.tiles[cell.tileIdx];
      const {pal}=resolveCellPalette(tile);
      drawTileAt(ctx, tile, pal, cell.flipH, cell.flipV, (stampHoverCell.x+rx)*TILE*zoom, (stampHoverCell.y+ry)*TILE*zoom, zoom);
    }
    ctx.strokeStyle=&#x27;#ff9f5f&#x27;; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.strokeRect(stampHoverCell.x*TILE*zoom+1, stampHoverCell.y*TILE*zoom+1, rc.w*TILE*zoom-2, rc.h*TILE*zoom-2);
    ctx.restore();
  }
  // text hover ghost -- previews where the typed string would land before you click
  if(tool===&#x27;text&#x27; &amp;&amp; stampHoverCell &amp;&amp; tileset){
    const str=document.getElementById(&#x27;textInput&#x27;).value;
    const fontLayerIdx=tileset.layers.findIndex(l=&gt;l.name===FONT_LAYER_NAME);
    const fLayer=fontLayerIdx&gt;=0?tileset.layers[fontLayerIdx]:null;
    if(str &amp;&amp; fLayer){
      const palSel=document.getElementById(&#x27;textPalOverride&#x27;).value;
      ctx.save(); ctx.globalAlpha=0.55;
      for(let i=0;i&lt;str.length;i++){
        let code=str.charCodeAt(i);
        if(code&lt;0x20||code&gt;0x7F) code=0x3F;
        const tile=fLayer.tiles[code-0x20];
        const palIdx=palSel===&#x27;-1&#x27; ? tile.defaultPalette : +palSel;
        const pal=tileset.paletteBank[palIdx]||tileset.paletteBank[0];
        drawTileAt(ctx, tile, pal, false, false, (stampHoverCell.x+i)*TILE*zoom, stampHoverCell.y*TILE*zoom, zoom);
      }
      ctx.strokeStyle=&#x27;#ff9f5f&#x27;; ctx.lineWidth=2; ctx.setLineDash([4,3]);
      ctx.strokeRect(stampHoverCell.x*TILE*zoom+1, stampHoverCell.y*TILE*zoom+1, str.length*TILE*zoom-2, TILE*zoom-2);
      ctx.restore();
    }
  }
  updateSelInfo();
  renderBudget();
  refreshCode();
}
function updateSelInfo(){
  const el=document.getElementById(&#x27;selInfo&#x27;);
  if(!mapState){ el.textContent=&#x27;No map yet.&#x27;; return; }
  el.textContent = selection
    ? `Selected ${selection.x1-selection.x0+1}x${selection.y1-selection.y0+1} tile(s) at (${selection.x0},${selection.y0}).`
    : &#x27;No selection — actions apply to whole map.&#x27;;
}

/* ---------- cell ops ---------- */
function cellIndex(x,y){ return y*mapState.mapW+x; }
function inBounds(x,y){ return x&gt;=0&amp;&amp;y&gt;=0&amp;&amp;x&lt;mapState.mapW&amp;&amp;y&lt;mapState.mapH; }
// Stamps the WHOLE resolved block (1 or more tiles) anchored with its top-left at (x,y),
// clipping any cells that fall off the map edge.
function stampAt(x,y){
  const rc=resolvedStampCells(); if(!rc) return;
  const layer=currentMapLayer();
  const srcLayer=tilesetLayer(activeTilesetLayer);
  for(let ry=0;ry&lt;rc.h;ry++)for(let rx=0;rx&lt;rc.w;rx++){
    const dx=x+rx, dy=y+ry;
    if(!inBounds(dx,dy)) continue;
    const cell=rc.cells[ry*rc.w+rx];
    const tile=srcLayer.tiles[cell.tileIdx];
    const {palIdx}=resolveCellPalette(tile);
    const idx=cellIndex(dx,dy);
    layer.tileId[idx]=cell.tileIdx;
    layer.srcLayer[idx]=activeTilesetLayer;
    layer.pal[idx]=palIdx;
    layer.flip[idx]=(cell.flipH?1:0)|(cell.flipV?2:0);
  }
}
function eraseAt(x,y){
  if(!inBounds(x,y)) return;
  const layer=currentMapLayer();
  const idx=cellIndex(x,y);
  layer.tileId[idx]=-1; layer.srcLayer[idx]=-1; layer.pal[idx]=-1; layer.flip[idx]=0;
}
// Eyedrop always picks up a SINGLE cell (that&#x27;s all a map cell can hold) into a fresh 1x1 stamp.
// The cell&#x27;s OWN srcLayer is used (not whatever tileset tab happens to be open) since a plane can
// hold tiles from multiple tileset layers.
function eyedropAt(x,y){
  if(!inBounds(x,y)) return;
  const layer=currentMapLayer();
  const idx=cellIndex(x,y);
  const t=layer.tileId[idx];
  if(t&lt;0) return;
  const sl=layer.srcLayer[idx];
  if(!tileset || !tileset.layers[sl]) return;
  activeTilesetLayer=sl;
  const srcLayer=tilesetLayer(activeTilesetLayer);
  const tx=t%srcLayer.tileGridW, ty=Math.floor(t/srcLayer.tileGridW);
  stampSel={x0:tx,y0:ty,x1:tx,y1:ty};
  currentFlipH=!!(layer.flip[idx]&amp;1); currentFlipV=!!(layer.flip[idx]&amp;2);
  currentRotation=0; // a baked tile&#x27;s rotation can&#x27;t be recovered from its bitmap -- reset, matching flip&#x27;s own restore
  document.getElementById(&#x27;btnFlipH&#x27;).classList.toggle(&#x27;active&#x27;,currentFlipH);
  document.getElementById(&#x27;btnFlipV&#x27;).classList.toggle(&#x27;active&#x27;,currentFlipV);
  updateStampRotationLabel();
  document.getElementById(&#x27;stampPalOverride&#x27;).value = layer.pal[idx]&gt;=0 ? String(layer.pal[idx]) : &#x27;-1&#x27;;
  renderTilesetLayerTabs(); renderTilesetCanvas(); renderStampPreview(); updateTileInfo();
}
// Fill only ever places a SINGLE tile repeatedly (flood-filling a tiled multi-tile brush across
// an irregular region isn&#x27;t attempted) -- uses just the top-left cell of the current stamp.
function floodFillAt(x0,y0){
  const rc=resolvedStampCells(); if(!rc) return;
  const layer=currentMapLayer();
  const startIdx=cellIndex(x0,y0);
  const targetTile=layer.tileId[startIdx], targetSrc=layer.srcLayer[startIdx];
  const cell=rc.cells[0];
  if(targetTile===cell.tileIdx &amp;&amp; targetSrc===activeTilesetLayer) return;
  const srcLayer=tilesetLayer(activeTilesetLayer);
  const tile=srcLayer.tiles[cell.tileIdx];
  const {palIdx}=resolveCellPalette(tile);
  const w=mapState.mapW,h=mapState.mapH;
  const stack=[[x0,y0]];
  const replFlip=(cell.flipH?1:0)|(cell.flipV?2:0);
  while(stack.length){
    const [x,y]=stack.pop();
    if(x&lt;0||y&lt;0||x&gt;=w||y&gt;=h) continue;
    const idx=cellIndex(x,y);
    if(layer.tileId[idx]!==targetTile || layer.srcLayer[idx]!==targetSrc) continue;
    layer.tileId[idx]=cell.tileIdx; layer.srcLayer[idx]=activeTilesetLayer; layer.pal[idx]=palIdx; layer.flip[idx]=replFlip;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
}

/* ---------- pointer input (Pointer Events from day one -- touch/stylus need continuous move events) ---------- */
function canvasToCell(evt){
  const r=canvas.getBoundingClientRect();
  const scaleX=canvas.width/r.width, scaleY=canvas.height/r.height;
  const px=(evt.clientX-r.left)*scaleX, py=(evt.clientY-r.top)*scaleY;
  const x=Math.floor(px/(TILE*zoom)), y=Math.floor(py/(TILE*zoom));
  return {x:clamp(x,0,mapState.mapW-1), y:clamp(y,0,mapState.mapH-1)};
}
// Extract/clear/write helpers -- shared by the map-select move-drag and the Copy/Cut/Paste/Clear
// button handlers, all of which move or duplicate a rectangular block on the ACTIVE map layer.
function extractBlock(layer,rect){
  const w=rect.x1-rect.x0+1, h=rect.y1-rect.y0+1;
  const tileId=new Int16Array(w*h), pal=new Int16Array(w*h), srcLayerArr=new Int16Array(w*h), flip=new Uint8Array(w*h);
  for(let y=0;y&lt;h;y++)for(let x=0;x&lt;w;x++){
    const si=cellIndex(rect.x0+x,rect.y0+y), di=y*w+x;
    tileId[di]=layer.tileId[si]; pal[di]=layer.pal[si]; srcLayerArr[di]=layer.srcLayer[si]; flip[di]=layer.flip[si];
  }
  return {w,h,tileId,pal,srcLayer:srcLayerArr,flip};
}
function clearBlock(layer,rect){
  for(let y=rect.y0;y&lt;=rect.y1;y++)for(let x=rect.x0;x&lt;=rect.x1;x++){
    const i=cellIndex(x,y); layer.tileId[i]=-1; layer.srcLayer[i]=-1; layer.pal[i]=-1; layer.flip[i]=0;
  }
}
function writeBlock(layer,buf,x0,y0){
  for(let y=0;y&lt;buf.h;y++)for(let x=0;x&lt;buf.w;x++){
    const dx=x0+x, dy=y0+y; if(!inBounds(dx,dy)) continue;
    const si=y*buf.w+x, di=cellIndex(dx,dy);
    layer.tileId[di]=buf.tileId[si]; layer.pal[di]=buf.pal[si]; layer.srcLayer[di]=buf.srcLayer[si]; layer.flip[di]=buf.flip[si];
  }
}
/* ---------- selection rotation ----------
   Real NGPC hardware has no tile-rotate flag -- only H/V flip (bits 15/14 of the tilemap entry).
   180° is therefore free (just toggle both flip bits on every cell), but a true 90°/270° needs an
   actual new tile bitmap, matching the toolchain&#x27;s own ngpc_tile_rotate90/270 helpers (software
   rotation into a new dest tile, not an in-place hardware op). Position remap reuses the same
   generic CW/CCW grid primitive as the sibling Tile Editor&#x27;s own rotate feature. */
function rotateGridCW(w,h,data,Ctor){
  const out=new Ctor(w*h);
  for(let y=0;y&lt;h;y++)for(let x=0;x&lt;w;x++) out[x*h+(h-1-y)]=data[y*w+x];
  return {w:h,h:w,data:out};
}
function rotateGridCCW(w,h,data,Ctor){
  let r={w,h,data};
  r=rotateGridCW(r.w,r.h,r.data,Ctor);
  r=rotateGridCW(r.w,r.h,r.data,Ctor);
  r=rotateGridCW(r.w,r.h,r.data,Ctor);
  return r;
}
function applyFlipToPixels(pixels,fh,fv){
  if(!fh &amp;&amp; !fv) return pixels;
  const out=new Uint8Array(TILE*TILE);
  for(let y=0;y&lt;TILE;y++)for(let x=0;x&lt;TILE;x++){
    const sx=fh?TILE-1-x:x, sy=fv?TILE-1-y:y;
    out[y*TILE+x]=pixels[sy*TILE+sx];
  }
  return out;
}
function tileBitmapKey(pixels){ return pixels.join(&#x27;,&#x27;); }
const generatedTileCache=new Map(); // session-only dedup (&quot;layerIdx|64-byte-key&quot; -&gt; tile index); never persisted
function getOrCreateRotatedTile(layerIdx, pixels, defaultPalette){
  const srcLayer=tileset.layers[layerIdx];
  const key=layerIdx+&#x27;|&#x27;+tileBitmapKey(pixels);
  if(generatedTileCache.has(key)) return generatedTileCache.get(key);
  for(let i=0;i&lt;srcLayer.tiles.length;i++){
    if(tileBitmapKey(srcLayer.tiles[i].pixels)===tileBitmapKey(pixels)){ generatedTileCache.set(key,i); return i; }
  }
  const idx=srcLayer.tiles.length;
  srcLayer.tiles.push({pixels:Uint8Array.from(pixels), defaultPalette});
  generatedTileCache.set(key,idx);
  return idx;
}
function rotateSelection(kind){
  if(!selection){ modalAlert(&#x27;Select a rectangle first.&#x27;); return; }
  if(!tileset){ modalAlert(&#x27;Import a tileset first.&#x27;); return; }
  pushUndo();
  const layer=currentMapLayer();
  const buf=extractBlock(layer,selection);
  const {w,h}=buf;
  let nw,nh,tileId,pal,srcLayerArr,flip;

  if(kind===&#x27;180&#x27;){
    nw=w; nh=h;
    tileId=new Int16Array(w*h); pal=new Int16Array(w*h); srcLayerArr=new Int16Array(w*h); flip=new Uint8Array(w*h);
    for(let i=0;i&lt;w*h;i++){
      const di=w*h-1-i;
      tileId[di]=buf.tileId[i]; pal[di]=buf.pal[i]; srcLayerArr[di]=buf.srcLayer[i];
      flip[di] = buf.tileId[i]&lt;0 ? 0 : (buf.flip[i]^3);
    }
  } else {
    const rotFn = kind===&#x27;cw&#x27; ? rotateGridCW : rotateGridCCW;
    const rTile=rotFn(w,h,buf.tileId,Int16Array);
    const rPal=rotFn(w,h,buf.pal,Int16Array);
    const rSrc=rotFn(w,h,buf.srcLayer,Int16Array);
    const rFlip=rotFn(w,h,buf.flip,Uint8Array);
    nw=rTile.w; nh=rTile.h;
    tileId=rTile.data; pal=rPal.data; srcLayerArr=rSrc.data; flip=new Uint8Array(nw*nh);
    for(let i=0;i&lt;tileId.length;i++){
      const t=tileId[i];
      if(t&lt;0) continue;
      const li=srcLayerArr[i];
      const srcTile=tileset.layers[li].tiles[t];
      const fh=!!(rFlip.data[i]&amp;1), fv=!!(rFlip.data[i]&amp;2);
      const eff=applyFlipToPixels(srcTile.pixels,fh,fv);
      const rotatedPixels=rotFn(TILE,TILE,eff,Uint8Array).data;
      const resolvedPal = pal[i]&gt;=0 ? pal[i] : srcTile.defaultPalette;
      tileId[i]=getOrCreateRotatedTile(li, rotatedPixels, resolvedPal);
      // Pin the cell&#x27;s palette explicitly instead of leaving it &quot;inherit&quot; (-1): the reuse-match
      // in getOrCreateRotatedTile keys on pixel bitmap alone, so a rotated tile can land on an
      // EXISTING tileset slot whose own defaultPalette differs (e.g. two tiles that share the same
      // shape/index pattern but are recolored via different default palettes) -- without this, an
      // inherited cell would silently pick up that other tile&#x27;s color instead of its own.
      pal[i]=resolvedPal;
      // flip[i] stays 0 -- the rotation is now baked into the new tile&#x27;s own pixels
    }
  }

  clearBlock(layer,selection);
  writeBlock(layer,{w:nw,h:nh,tileId,pal,srcLayer:srcLayerArr,flip},selection.x0,selection.y0);
  selection={x0:selection.x0,y0:selection.y0,
    x1:Math.min(mapState.mapW-1,selection.x0+nw-1),
    y1:Math.min(mapState.mapH-1,selection.y0+nh-1)};
  render(); scheduleAutosave();
}

function cellInSelection(c){
  return selection &amp;&amp; c.x&gt;=selection.x0 &amp;&amp; c.x&lt;=selection.x1 &amp;&amp; c.y&gt;=selection.y0 &amp;&amp; c.y&lt;=selection.y1;
}
function spriteHitTest(x,y){
  for(let i=mapState.sprites.length-1;i&gt;=0;i--){
    const s=mapState.sprites[i];
    if(x&gt;=s.x &amp;&amp; x&lt;s.x+s.w &amp;&amp; y&gt;=s.y &amp;&amp; y&lt;s.y+s.h) return i;
  }
  return -1;
}
// Snapshots the current stamp block into a standalone sprite instance -- placed sprites are a flat
// list, not a grid cell, so overlapping placements never erase each other or the map underneath.
function placeSprite(x,y){
  const rc=resolvedStampCells(); if(!rc) return;
  const srcLayer=tilesetLayer(activeTilesetLayer);
  const cells=rc.cells.map(cell=&gt;{
    const tile=srcLayer.tiles[cell.tileIdx];
    const {palIdx}=resolveCellPalette(tile);
    return {tileIdx:cell.tileIdx, flipH:cell.flipH, flipV:cell.flipV, palIdx};
  });
  mapState.sprites.push({x,y,w:rc.w,h:rc.h,srcLayer:activeTilesetLayer,priority:spritePriority,cells});
  selectedSpriteIdx=mapState.sprites.length-1;
}
function onDown(evt){
  if(!mapState) return;
  if(evt.button!==0 &amp;&amp; evt.button!==2) return;
  const c=canvasToCell(evt);
  if(tool===&#x27;stamp&#x27;){ pushUndo(); drawing=true; stampAt(c.x,c.y); render(); scheduleAutosave(); }
  else if(tool===&#x27;erase&#x27;){ pushUndo(); drawing=true; eraseAt(c.x,c.y); render(); scheduleAutosave(); }
  else if(tool===&#x27;fill&#x27;){ pushUndo(); floodFillAt(c.x,c.y); render(); scheduleAutosave(); }
  else if(tool===&#x27;eyedrop&#x27;){ eyedropAt(c.x,c.y); }
  else if(tool===&#x27;select&#x27;){
    if(evt.button===2){ selection=null; render(); return; }
    if(selection &amp;&amp; cellInSelection(c)){
      // Click landed inside the existing selection -- move it instead of redefining it (mirrors
      // the Tile Editor&#x27;s own click-inside-selection-to-move mechanic).
      pushUndo();
      const layer=currentMapLayer();
      moveBuffer=extractBlock(layer,selection);
      moveOrigin={x:selection.x0,y:selection.y0};
      moveDragStart=c; moveOffset={dx:0,dy:0};
      clearBlock(layer,selection);
      drawing=true; render();
    } else {
      dragStartCell={x:c.x,y:c.y}; selection={x0:c.x,y0:c.y,x1:c.x,y1:c.y}; drawing=true; render();
    }
  }
  else if(tool===&#x27;sprite&#x27;){
    if(evt.button===2){ selectedSpriteIdx=-1; render(); renderSpriteList(); return; }
    const hitIdx=spriteHitTest(c.x,c.y);
    if(hitIdx&gt;=0){
      pushUndo();
      selectedSpriteIdx=hitIdx;
      const spr=mapState.sprites[hitIdx];
      moveSpriteActive={idx:hitIdx,x:spr.x,y:spr.y};
      spriteDragStart=c;
      drawing=true; render(); renderSpriteList();
    } else if(stampSel){
      pushUndo();
      placeSprite(c.x,c.y);
      render(); scheduleAutosave(); renderSpriteList();
    }
  }
  else if(tool===&#x27;text&#x27;){
    pushUndo();
    placeText(c.x,c.y);
    render(); scheduleAutosave();
  }
}
function onMove(evt){
  if(!mapState) return;
  const c=canvasToCell(evt);
  document.getElementById(&#x27;posInfo&#x27;).textContent=`tile ${c.x},${c.y}`;
  if(!drawing){
    if((tool===&#x27;stamp&#x27;||tool===&#x27;sprite&#x27;) &amp;&amp; stampSel){ stampHoverCell=c; render(); }
    else if(tool===&#x27;text&#x27;){ stampHoverCell=c; render(); }
    else if(stampHoverCell){ stampHoverCell=null; render(); }
    return;
  }
  if(tool===&#x27;stamp&#x27;){ stampHoverCell=c; stampAt(c.x,c.y); render(); }
  else if(tool===&#x27;erase&#x27;){ eraseAt(c.x,c.y); render(); }
  else if(tool===&#x27;select&#x27;){
    if(moveBuffer){
      moveOffset={dx:c.x-moveDragStart.x, dy:c.y-moveDragStart.y};
      render();
    } else {
      selection={x0:Math.min(dragStartCell.x,c.x),y0:Math.min(dragStartCell.y,c.y),
                 x1:Math.max(dragStartCell.x,c.x),y1:Math.max(dragStartCell.y,c.y)};
      render();
    }
  }
  else if(tool===&#x27;sprite&#x27; &amp;&amp; moveSpriteActive){
    const spr=mapState.sprites[moveSpriteActive.idx];
    const dx=c.x-spriteDragStart.x, dy=c.y-spriteDragStart.y;
    moveSpriteActive.x=clamp(spr.x+dx,0,mapState.mapW-spr.w);
    moveSpriteActive.y=clamp(spr.y+dy,0,mapState.mapH-spr.h);
    render();
  }
}
function onUp(){
  if(drawing &amp;&amp; (tool===&#x27;stamp&#x27;||tool===&#x27;erase&#x27;)) scheduleAutosave();
  if(tool===&#x27;select&#x27; &amp;&amp; moveBuffer){
    const layer=currentMapLayer();
    const mx=clamp(moveOrigin.x+moveOffset.dx,0,mapState.mapW-moveBuffer.w);
    const my=clamp(moveOrigin.y+moveOffset.dy,0,mapState.mapH-moveBuffer.h);
    writeBlock(layer,moveBuffer,mx,my);
    selection={x0:mx,y0:my,x1:mx+moveBuffer.w-1,y1:my+moveBuffer.h-1};
    moveBuffer=null; moveOrigin=null; moveDragStart=null; moveOffset={dx:0,dy:0};
    scheduleAutosave(); render();
  }
  if(tool===&#x27;sprite&#x27; &amp;&amp; moveSpriteActive){
    const spr=mapState.sprites[moveSpriteActive.idx];
    spr.x=moveSpriteActive.x; spr.y=moveSpriteActive.y;
    moveSpriteActive=null; spriteDragStart=null;
    scheduleAutosave(); render(); renderSpriteList();
  }
  drawing=false;
}

function tryRestoreAutosave(){

  if(!raw) return false;
  try{

        layers:obj.tileset.layers.map(l=&gt;({name:l.name, tileGridW:l.tileGridW, tileGridH:l.tileGridH,
          tiles:l.tiles.map(t=&gt;({pixels:Uint8Array.from(t.pixels), defaultPalette:t.defaultPalette}))})) };
      document.getElementById(&#x27;tilesetInfo&#x27;).textContent=`${tileset.sourceName}: ${tileset.layers.length} layer(s) (restored)`;
    }
    activeMapLayer=clamp(obj.activeMapLayer||0,0,obj.layers.length-1);
    mapState={ name:obj.name, mapW:obj.mapW, mapH:obj.mapH,
