    return true;
  }catch(e){ return false; }
}

/* ---------- C export ---------- */
function packRowFor(tile,flipH,flipV,rowY){
  let word=0;
  for(let i=0;i&lt;TILE;i++){
    const sx=flipH?TILE-1-i:i, sy=flipV?TILE-1-rowY:rowY;
    const v=tile.pixels[sy*TILE+sx]&amp;3;
    word |= v &lt;&lt; (14-i*2);
  }
  return word;
}
function refreshCode(){ document.getElementById(&#x27;codeOut&#x27;).value=generateCode(); }
function generateCode(onlyLayerIdx){
  const name=sanitizeIdent(document.getElementById(&#x27;mapName&#x27;).value.trim()||&#x27;my_map&#x27;);
  const far=document.getElementById(&#x27;chkFar&#x27;).checked?&#x27;NGP_FAR &#x27;:&#x27;&#x27;;
  if(!mapState || !tileset) return &#x27;/* Import a tileset and build a map first. */&#x27;;
  const lines=[];
  // Export order follows scrTarget (SCR_1 then SCR_2), not array order -- either Layer 1 or
  // Layer 2 can be assigned to either plane, but the generated arrays should always list SCR_1
  // before SCR_2 regardless of which array slot holds which.
  const allIndices=[...mapState.layers.keys()].sort((a,b)=&gt; mapState.layers[a].scrTarget&lt;mapState.layers[b].scrTarget?-1:1);
  const layerIndices = (onlyLayerIdx===undefined||onlyLayerIdx===null) ? allIndices : [onlyLayerIdx];
  const scopeNote = layerIndices.length&lt;mapState.layers.length ? `, layer &quot;${mapState.layers[layerIndices[0]].name}&quot; (${mapState.layers[layerIndices[0]].scrTarget}) only (self-contained -- includes the full shared palette table below)` : `, ${mapState.layers.length} layer(s)`;
  lines.push(`/* Generated by NGPC Tilemap Editor. ${mapState.mapW}x${mapState.mapH} tile map${scopeNote}. */`);
  lines.push(`/* Consume with ngpc_gfx_put_tile_ex(plane, x, y, TILE_BASE + &lt;layer&gt;_map_tiles[i], &lt;layer&gt;_map_pals[i], &lt;layer&gt;_map_flip[i]&amp;1, (&lt;layer&gt;_map_flip[i]&gt;&gt;1)&amp;1) for each i = y*map_w+x. */`);
  lines.push(`/* The real SCR1/SCR2 VRAM tilemap is only 32x32 tiles at once -- for a bigger map, stream the visible 32x32 window from this array as the camera scrolls. */`);
  lines.push(&#x27;&#x27;);
  layerIndices.forEach(li=&gt;{
    const layer=mapState.layers[li];
    const lname=sanitizeIdent(layer.scrTarget);
    // A plane&#x27;s cells can now come from ANY tileset layer, so tiles are deduped/keyed by the
    // (srcLayer,tileId) pair rather than by tileId alone -- two different source layers can
    // reuse the same numeric tile index for unrelated art.
    const used=new Set();
    for(let i=0;i&lt;layer.tileId.length;i++){
      const t=layer.tileId[i]; if(t&lt;0) continue;
      const sl=layer.srcLayer[i];
      if(!tileset.layers[sl] || !tileset.layers[sl].tiles[t]) continue;
      used.add(sl+&#x27;:&#x27;+t);
    }
    const usedList=[...used].sort((a,b)=&gt;{ const[as,at]=a.split(&#x27;:&#x27;).map(Number),[bs,bt]=b.split(&#x27;:&#x27;).map(Number); return as-bs||at-bt; });
    const remap=new Map(usedList.map((key,ni)=&gt;[key,ni]));
    lines.push(`/* ---- &quot;${layer.name}&quot; -&gt; ${layer.scrTarget} (${usedList.length} unique tile(s) used) ---- */`);
    const tileWords=[];
    usedList.forEach(key=&gt;{
      const [sl,t]=key.split(&#x27;:&#x27;).map(Number);
      const tile=tileset.layers[sl].tiles[t];
      for(let r=0;r&lt;TILE;r++) tileWords.push(&#x27;0x&#x27;+packRowFor(tile,false,false,r).toString(16).toUpperCase().padStart(4,&#x27;0&#x27;));
    });
    lines.push(`static const u16 ${far}${name}_${lname}_tiles[] = {`);
    for(let i=0;i&lt;tileWords.length;i+=8) lines.push(&#x27;    &#x27;+tileWords.slice(i,i+8).join(&#x27;, &#x27;)+(i+8&lt;tileWords.length?&#x27;,&#x27;:&#x27;&#x27;));
    lines.push(&#x27;};&#x27;);
    lines.push(`static const u16 ${name}_${lname}_tiles_count = ${tileWords.length}u;`);
    const mapTiles=[], mapPals=[], mapFlip=[];
    for(let i=0;i&lt;layer.tileId.length;i++){
      const t=layer.tileId[i];
      const sl=layer.srcLayer[i];
      const srcTileset = t&gt;=0 ? tileset.layers[sl] : null;
      if(t&lt;0 || !srcTileset || !srcTileset.tiles[t]){ mapTiles.push(0); mapPals.push(0); mapFlip.push(0); continue; }
      mapTiles.push(remap.get(sl+&#x27;:&#x27;+t));
      const palIdx = layer.pal[i]&gt;=0 ? layer.pal[i] : srcTileset.tiles[t].defaultPalette;
      mapPals.push(clamp(palIdx,0,15));
      mapFlip.push(layer.flip[i]&amp;3);
    }
    lines.push(`static const u16 ${name}_${lname}_map_tiles[] = {`);
    for(let i=0;i&lt;mapTiles.length;i+=mapState.mapW) lines.push(&#x27;    &#x27;+mapTiles.slice(i,i+mapState.mapW).join(&#x27;, &#x27;)+(i+mapState.mapW&lt;mapTiles.length?&#x27;,&#x27;:&#x27;&#x27;));
    lines.push(&#x27;};&#x27;);
    lines.push(`static const u8 ${name}_${lname}_map_pals[] = {`);
    for(let i=0;i&lt;mapPals.length;i+=mapState.mapW) lines.push(&#x27;    &#x27;+mapPals.slice(i,i+mapState.mapW).join(&#x27;, &#x27;)+(i+mapState.mapW&lt;mapPals.length?&#x27;,&#x27;:&#x27;&#x27;));
    lines.push(&#x27;};&#x27;);
    lines.push(`static const u8 ${name}_${lname}_map_flip[] = { /* bit0=hflip, bit1=vflip -- not part of the standard ngpc_tilemap.py convention, ignore if you don&#x27;t need per-cell flip */`);
    for(let i=0;i&lt;mapFlip.length;i+=mapState.mapW) lines.push(&#x27;    &#x27;+mapFlip.slice(i,i+mapState.mapW).join(&#x27;, &#x27;)+(i+mapState.mapW&lt;mapFlip.length?&#x27;,&#x27;:&#x27;&#x27;));
    lines.push(&#x27;};&#x27;);
    lines.push(`static const u8 ${name}_${lname}_map_w = ${mapState.mapW}u;`);
    lines.push(`static const u8 ${name}_${lname}_map_h = ${mapState.mapH}u;`);
    lines.push(&#x27;&#x27;);
  });
  lines.push(`/* Shared palette table -- every layer above references indices into this. */`);
  lines.push(`static const u8 ${name}_palette_count = ${tileset.paletteBank.length}u;`);
  lines.push(`static const u16 ${far}${name}_palettes[] = {`);
  tileset.paletteBank.forEach((pal,pi)=&gt;{
    const words=pal.colors.map(hexWord);
    lines.push(&#x27;    &#x27;+words.join(&#x27;, &#x27;)+(pi&lt;tileset.paletteBank.length-1?&#x27;,&#x27;:&#x27;&#x27;)+`  /* palette ${pi} &quot;${pal.name}&quot; */`);
  });
  lines.push(&#x27;};&#x27;);
  return lines.join(&#x27;\n&#x27;);
}
document.getElementById(&#x27;btnRegen&#x27;).onclick=refreshCode;
document.getElementById(&#x27;chkFar&#x27;).onchange=refreshCode;
document.getElementById(&#x27;btnCopyCode&#x27;).onclick=async ()=&gt;{
  try{ await navigator.clipboard.writeText(document.getElementById(&#x27;codeOut&#x27;).value); }
  catch(e){ document.getElementById(&#x27;codeOut&#x27;).select(); document.execCommand(&#x27;copy&#x27;); }
};
document.getElementById(&#x27;btnDownloadCode&#x27;).onclick=()=&gt;{
  const blob=new Blob([document.getElementById(&#x27;codeOut&#x27;).value],{type:&#x27;text/plain&#x27;});
  const url=URL.createObjectURL(blob);
  const a=document.createElement(&#x27;a&#x27;);
  a.href=url; a.download=(document.getElementById(&#x27;mapName&#x27;).value.trim()||&#x27;my_map&#x27;)+&#x27;.c&#x27;;
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById(&#x27;btnDownloadPerLayer&#x27;).onclick=async ()=&gt;{
  if(!mapState || !tileset){ await modalAlert(&#x27;Import a tileset and build a map first.&#x27;); return; }
  const baseName=document.getElementById(&#x27;mapName&#x27;).value.trim()||&#x27;my_map&#x27;;
  const orderedIndices=[...mapState.layers.keys()].sort((a,b)=&gt; mapState.layers[a].scrTarget&lt;mapState.layers[b].scrTarget?-1:1);
  orderedIndices.forEach((li,order)=&gt;{
    const layer=mapState.layers[li];
    const code=generateCode(li);
    const blob=new Blob([code],{type:&#x27;text/plain&#x27;});
    const url=URL.createObjectURL(blob);
    // staggered so multiple near-simultaneous downloads don&#x27;t get coalesced/blocked by the browser
    setTimeout(()=&gt;{
      const a=document.createElement(&#x27;a&#x27;);
      a.href=url; a.download=`${baseName}_${sanitizeIdent(layer.scrTarget)}.c`;
      a.click();
      setTimeout(()=&gt;URL.revokeObjectURL(url),2000);
    }, order*350);
  });
};

/* ---------- light mode ---------- */
function setupLightModeToggle(){
  const chk=document.getElementById(&#x27;chkLightMode&#x27;);
  let light=false;
  try{ const saved=localStorage.getItem(&#x27;ngpc_tilemap_editor_light_mode&#x27;); if(saved!==null) light=saved===&#x27;1&#x27;; }catch(e){}
  chk.checked=light;
  document.body.classList.toggle(&#x27;light&#x27;, light);
  chk.onchange=()=&gt;{
    document.body.classList.toggle(&#x27;light&#x27;, chk.checked);
    try{ localStorage.setItem(&#x27;ngpc_tilemap_editor_light_mode&#x27;, chk.checked?&#x27;1&#x27;:&#x27;0&#x27;); }catch(e){}
  };
}

/* ---------- init ---------- */
(function init(){
  setupLightModeToggle();
  if(!tryRestoreAutosave()){
    mapState=freshMap(32,32);

  renderTilesetLayerTabs();
  renderStampPaletteOptions();
  renderTextPaletteOptions();
  renderAllLayerUI();
  renderSpriteList();
  syncMapInputs();
  renderTilesetCanvas();
  renderStampPreview();
  updateTileInfo();
  render();
})();

  --text:#1a1a17; --dim:#63635c; --accent:#0063c6; --accent2:#c1520a;
  --danger:#c92a2a; --good:#1a8f4c; --warn:#a07000;
  --code-bg:#ffffff; --code-text:#1a1a17;
  --canvas-bg:#dedecf; --checker:#cfcfc2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:13px/1.4 &quot;Segoe UI&quot;,system-ui,sans-serif;height:100%;}
button,input,select{font:inherit;color:inherit;}
button{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:5px 10px;border-radius:4px;cursor:pointer;}
button:hover{border-color:var(--accent);}
button.active{background:var(--accent);color:#0b0d12;border-color:var(--accent);font-weight:600;}
button:disabled{opacity:.4;cursor:default;}
button.small{padding:2px 7px;font-size:12px;}
input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:4px 6px;border-radius:4px;width:60px;}
select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;}
input[type=range]{accent-color:var(--accent);}
h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em;}
h2{font-size:11px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);}
.hint{color:var(--dim);font-size:11px;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;gap:6px;}
.sep{width:1px;align-self:stretch;background:var(--border);margin:0 4px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;}
a.filelike{color:var(--accent);text-decoration:underline;cursor:pointer;}
#app{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;grid-template-rows:auto 1fr;
  height:100vh;gap:8px;padding:8px;}
#topbar{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 12px;flex-wrap:wrap;}
#left,#right{overflow:auto;display:flex;flex-direction:column;gap:8px;}
#center{overflow:auto;display:flex;flex-direction:column;gap:8px;}
.views{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;}
.views .panel{flex:1 1 360px;min-width:0;}
.checker{background:
  linear-gradient(45deg,var(--checker) 25%,transparent 25%),
  linear-gradient(-45deg,var(--checker) 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,var(--checker) 75%),
  linear-gradient(-45deg,transparent 75%,var(--checker) 75%);
  background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0px;background-color:var(--canvas-bg);}
canvas{image-rendering:pixelated;display:block;touch-action:none;}
.canvasBox{border:1px solid var(--border);border-radius:4px;overflow:auto;max-width:100%;line-height:0;}
#sliceCanvas{cursor:crosshair;}
#viewCanvas{cursor:crosshair;width:100%;height:auto;max-width:520px;aspect-ratio:1/1;}
.toolgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.mat{display:flex;align-items:center;gap:6px;padding:4px;border:1px solid transparent;border-radius:4px;cursor:pointer;}
.mat:hover{background:var(--panel2);}
.mat.sel{border-color:var(--accent);background:var(--panel2);}
.mat .num{width:16px;color:var(--dim);font-size:11px;text-align:right;}
.mat input[type=text]{width:70px;background:transparent;border:none;padding:2px;}
.sw{width:22px;height:22px;border-radius:3px;border:1px solid var(--border);position:relative;overflow:hidden;flex-shrink:0;}
.sw input[type=color]{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;}
.kv label{color:var(--dim);font-size:12px;}
.kv .row input[type=range]{flex:1;min-width:80px;}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed var(--border);}
.stat b.ok{color:var(--good);} .stat b.bad{color:var(--danger);} .stat b.warn{color:var(--warn);}
textarea{width:100%;height:160px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);
  border-radius:4px;font:11px/1.35 Consolas,monospace;padding:6px;resize:vertical;}
.frameTab{padding:3px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--panel2);font-size:12px;}
.frameTab.sel{background:var(--accent);color:#0b0d12;border-color:var(--accent);font-weight:600;}
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;}
#modalBox{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;max-width:440px;white-space:pre-wrap;}
@media (max-width:1100px){
  #app{grid-template-columns:1fr;height:auto;}
  #topbar{grid-column:1;}
  #left,#right,#center{overflow:visible;}
}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;app&quot;&gt;
  &lt;div id=&quot;topbar&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;h1&gt;NGPC Voxel Sprite Tool&lt;/h1&gt;
      &lt;span class=&quot;sep&quot;&gt;&lt;/span&gt;
      &lt;input id=&quot;projName&quot; type=&quot;text&quot; value=&quot;my_object&quot; style=&quot;width:120px&quot; title=&quot;Project / C array name&quot;&gt;
      &lt;button id=&quot;btnNew&quot;&gt;New&lt;/button&gt;
      &lt;button id=&quot;btnSave&quot;&gt;Save Project&lt;/button&gt;
      &lt;button id=&quot;btnLoad&quot;&gt;Load Project&lt;/button&gt;
      &lt;input id=&quot;fileLoad&quot; type=&quot;file&quot; accept=&quot;.json&quot; style=&quot;display:none&quot;&gt;
      &lt;button id=&quot;btnImportPal&quot; title=&quot;Pull palettes from a Tile Editor .ngptile.json — each palette&#x27;s indices 1-3 become a material (dark, mid, light)&quot;&gt;Import Palettes&lt;/button&gt;
      &lt;input id=&quot;fileImportPal&quot; type=&quot;file&quot; accept=&quot;.json&quot; style=&quot;display:none&quot;&gt;
      &lt;button id=&quot;btnUndo&quot; title=&quot;Ctrl+Z&quot;&gt;Undo&lt;/button&gt;
      &lt;button id=&quot;btnRedo&quot; title=&quot;Ctrl+Y&quot;&gt;Redo&lt;/button&gt;
      &lt;a class=&quot;filelike&quot; href=&quot;../&quot; title=&quot;Back to the indexed 2bpp Tile Editor&quot; style=&quot;margin-left:6px&quot;&gt;&amp;larr; Tile Editor&lt;/a&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label class=&quot;hint&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkLightMode&quot;&gt; Light mode&lt;/label&gt;
      &lt;span id=&quot;status&quot; class=&quot;hint&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ================= LEFT: tools + materials + model ================= --&gt;
  &lt;div id=&quot;left&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Tools&lt;/h2&gt;
      &lt;div class=&quot;toolgrid&quot;&gt;
        &lt;button data-tool=&quot;pencil&quot; class=&quot;active&quot; title=&quot;B — place voxels (slice) / add on face (3D)&quot;&gt;Pencil&lt;/button&gt;
        &lt;button data-tool=&quot;erase&quot; title=&quot;E — remove voxels&quot;&gt;Erase&lt;/button&gt;
        &lt;button data-tool=&quot;paint&quot; title=&quot;P — recolor existing voxels only&quot;&gt;Paint&lt;/button&gt;
        &lt;button data-tool=&quot;fill&quot; title=&quot;F — flood-fill the slice (2D)&quot;&gt;Fill&lt;/button&gt;
        &lt;button data-tool=&quot;rect&quot; title=&quot;R — filled rectangle in the slice&quot;&gt;Rect&lt;/button&gt;
        &lt;button data-tool=&quot;pick&quot; title=&quot;I — pick a voxel&#x27;s material&quot;&gt;Pick&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkMirror&quot;&gt; Mirror X&lt;/label&gt;
        &lt;label title=&quot;Show the slice below as a faint ghost&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkOnion&quot; checked&gt; Onion skin&lt;/label&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Materials = palettes&lt;/h2&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin-bottom:6px&quot;&gt;Each material is one NGPC palette: index 0 transparent, 1 dark, 2 mid, 3 light. The renderer picks the shade from lighting. Max 16 (sprite palette bank).&lt;/div&gt;
      &lt;div id=&quot;matList&quot; class=&quot;col&quot; style=&quot;gap:2px&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;button id=&quot;btnAddMat&quot; class=&quot;small&quot;&gt;+ Material&lt;/button&gt;
        &lt;button id=&quot;btnAutoShade&quot; class=&quot;small&quot; title=&quot;Rebuild dark/light from the selected material&#x27;s mid color&quot;&gt;Auto shade&lt;/button&gt;
        &lt;button id=&quot;btnDelMat&quot; class=&quot;small&quot;&gt;Delete&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Model&lt;/h2&gt;
      &lt;div class=&quot;row&quot;&gt;
        &lt;label class=&quot;hint&quot;&gt;Size X/Y/Z&lt;/label&gt;
        &lt;input id=&quot;dimX&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;48&quot; style=&quot;width:46px&quot;&gt;
        &lt;input id=&quot;dimY&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;48&quot; style=&quot;width:46px&quot;&gt;
        &lt;input id=&quot;dimZ&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;48&quot; style=&quot;width:46px&quot;&gt;
        &lt;button id=&quot;btnResize&quot; class=&quot;small&quot;&gt;Apply&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin:6px 0 4px&quot;&gt;Y is up. The model&#x27;s front faces +Z (bottom of the top-down slice). Rotation 0 looks at the front.&lt;/div&gt;
      &lt;div class=&quot;row&quot;&gt;
        &lt;button class=&quot;small&quot; data-shift=&quot;x,-1&quot;&gt;X−&lt;/button&gt;&lt;button class=&quot;small&quot; data-shift=&quot;x,1&quot;&gt;X+&lt;/button&gt;
        &lt;button class=&quot;small&quot; data-shift=&quot;y,-1&quot;&gt;Y−&lt;/button&gt;&lt;button class=&quot;small&quot; data-shift=&quot;y,1&quot;&gt;Y+&lt;/button&gt;
        &lt;button class=&quot;small&quot; data-shift=&quot;z,-1&quot;&gt;Z−&lt;/button&gt;&lt;button class=&quot;small&quot; data-shift=&quot;z,1&quot;&gt;Z+&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:4px&quot;&gt;
        &lt;button class=&quot;small&quot; id=&quot;btnRotY&quot; title=&quot;Rotate the model 90° around the vertical axis&quot;&gt;Rotate 90°&lt;/button&gt;
        &lt;button class=&quot;small&quot; id=&quot;btnFlipX&quot;&gt;Flip X&lt;/button&gt;
        &lt;button class=&quot;small&quot; id=&quot;btnCenter&quot; title=&quot;Center the model in X/Z and sit it on the floor&quot;&gt;Center&lt;/button&gt;
        &lt;button class=&quot;small&quot; id=&quot;btnClear&quot;&gt;Clear&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Animation frames&lt;/h2&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin-bottom:6px&quot;&gt;Each frame is a full voxel model. Sheet rows = frames, columns = rotations.&lt;/div&gt;
      &lt;div id=&quot;frameTabs&quot; class=&quot;row&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;button id=&quot;btnDupFrame&quot; class=&quot;small&quot;&gt;Duplicate&lt;/button&gt;
        &lt;button id=&quot;btnNewFrame&quot; class=&quot;small&quot;&gt;Blank&lt;/button&gt;
        &lt;button id=&quot;btnDelFrame&quot; class=&quot;small&quot;&gt;Delete&lt;/button&gt;
        &lt;button id=&quot;btnFrameLeft&quot; class=&quot;small&quot; title=&quot;Move frame earlier&quot;&gt;◀&lt;/button&gt;
        &lt;button id=&quot;btnFrameRight&quot; class=&quot;small&quot; title=&quot;Move frame later&quot;&gt;▶&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ================= CENTER: slice editor + 3D view ================= --&gt;
  &lt;div id=&quot;center&quot;&gt;
    &lt;div class=&quot;views&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;row&quot; style=&quot;justify-content:space-between;margin-bottom:6px&quot;&gt;
          &lt;h2 style=&quot;margin:0&quot;&gt;Slice editor&lt;/h2&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;select id=&quot;sliceAxis&quot; title=&quot;Which axis to slice along&quot;&gt;
              &lt;option value=&quot;y&quot;&gt;Top (Y layers)&lt;/option&gt;
              &lt;option value=&quot;z&quot;&gt;Front (Z layers)&lt;/option&gt;
              &lt;option value=&quot;x&quot;&gt;Side (X layers)&lt;/option&gt;
            &lt;/select&gt;
            &lt;button class=&quot;small&quot; id=&quot;btnSliceDown&quot; title=&quot;[&quot;&gt;−&lt;/button&gt;
            &lt;span id=&quot;sliceLabel&quot; class=&quot;hint&quot; style=&quot;min-width:58px;text-align:center&quot;&gt;&lt;/span&gt;
            &lt;button class=&quot;small&quot; id=&quot;btnSliceUp&quot; title=&quot;]&quot;&gt;+&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;canvasBox checker&quot; style=&quot;display:inline-block&quot;&gt;&lt;canvas id=&quot;sliceCanvas&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
          &lt;label class=&quot;hint&quot;&gt;Cell&lt;/label&gt;&lt;input id=&quot;sliceZoom&quot; type=&quot;range&quot; min=&quot;8&quot; max=&quot;36&quot; value=&quot;20&quot; style=&quot;width:110px&quot;&gt;
          &lt;span class=&quot;hint&quot;&gt;Left = tool, right-click = erase. Keys: [ ] change slice.&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;row&quot; style=&quot;justify-content:space-between;margin-bottom:6px&quot;&gt;
          &lt;h2 style=&quot;margin:0&quot;&gt;3D view&lt;/h2&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;button class=&quot;small&quot; id=&quot;btnViewSprite&quot; title=&quot;Match the sprite camera (rotation 0)&quot;&gt;Sprite cam&lt;/button&gt;
            &lt;button class=&quot;small&quot; id=&quot;btnViewReset&quot;&gt;Reset&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;canvasBox checker&quot;&gt;&lt;canvas id=&quot;viewCanvas&quot; width=&quot;400&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot; style=&quot;margin-top:6px&quot;&gt;Pencil adds onto the clicked face (or the floor), Erase/Paint act on the clicked voxel. Right-drag or Shift-drag orbits, wheel zooms. Colors shown are the exact NGPC shades.&lt;/div&gt;
        &lt;div class=&quot;row&quot; style=&quot;margin-top:4px&quot;&gt;
          &lt;label class=&quot;hint&quot;&gt;Yaw&lt;/label&gt;&lt;input id=&quot;viewYaw&quot; type=&quot;range&quot; min=&quot;-180&quot; max=&quot;180&quot; value=&quot;-35&quot; style=&quot;width:100px&quot;&gt;
          &lt;label class=&quot;hint&quot;&gt;Pitch&lt;/label&gt;&lt;input id=&quot;viewPitch&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;90&quot; value=&quot;30&quot; style=&quot;width:80px&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;row&quot; style=&quot;justify-content:space-between;margin-bottom:6px&quot;&gt;
        &lt;h2 style=&quot;margin:0&quot;&gt;Sprite sheet (NGPC output)&lt;/h2&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;label class=&quot;hint&quot;&gt;Zoom&lt;/label&gt;&lt;input id=&quot;sheetZoom&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;8&quot; value=&quot;4&quot; style=&quot;width:90px&quot;&gt;
          &lt;label class=&quot;hint&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkSheetGrid&quot; checked&gt; Tile grid&lt;/label&gt;
          &lt;label class=&quot;hint&quot; title=&quot;Composite both layers, or view one&quot;&gt;&lt;select id=&quot;sheetLayerView&quot;&gt;&lt;option value=&quot;all&quot;&gt;All layers&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;Layer 0&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;Layer 1&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;canvasBox checker&quot; style=&quot;display:inline-block&quot;&gt;&lt;canvas id=&quot;sheetCanvas&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot; id=&quot;sheetLegend&quot; style=&quot;margin-top:6px&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ================= RIGHT: render settings, budget, export ================= --&gt;
  &lt;div id=&quot;right&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Spin preview&lt;/h2&gt;
      &lt;div class=&quot;row&quot; style=&quot;align-items:flex-start&quot;&gt;
        &lt;div class=&quot;canvasBox checker&quot;&gt;&lt;canvas id=&quot;spinCanvas&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
        &lt;div class=&quot;col&quot;&gt;
          &lt;label class=&quot;hint&quot;&gt;FPS &lt;input id=&quot;spinFps&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;30&quot; value=&quot;6&quot; style=&quot;width:46px&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;hint&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkSpinAnim&quot;&gt; Also play frames&lt;/label&gt;
          &lt;label class=&quot;hint&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkSpinPause&quot;&gt; Pause&lt;/label&gt;
          &lt;span id=&quot;spinLabel&quot; class=&quot;hint&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;h2&gt;Camera &amp;amp; frame&lt;/h2&gt;
      &lt;div class=&quot;kv&quot;&gt;
        &lt;label&gt;Rotations&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;select id=&quot;rRot&quot;&gt;&lt;option&gt;1&lt;/option&gt;&lt;option&gt;2&lt;/option&gt;&lt;option&gt;4&lt;/option&gt;&lt;option selected&gt;8&lt;/option&gt;&lt;option&gt;16&lt;/option&gt;&lt;option&gt;32&lt;/option&gt;&lt;/select&gt;
          &lt;span class=&quot;hint&quot;&gt;start&lt;/span&gt;&lt;input id=&quot;rStart&quot; type=&quot;number&quot; step=&quot;5&quot; value=&quot;0&quot; style=&quot;width:52px&quot;&gt;&lt;span class=&quot;hint&quot;&gt;°&lt;/span&gt;
          &lt;select id=&quot;rDir&quot; title=&quot;Spin direction&quot;&gt;&lt;option value=&quot;1&quot;&gt;CW&lt;/option&gt;&lt;option value=&quot;-1&quot;&gt;CCW&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
        &lt;label&gt;Pitch&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;input id=&quot;rPitch&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;90&quot; value=&quot;30&quot;&gt;&lt;span id=&quot;rPitchV&quot; class=&quot;hint&quot; style=&quot;width:28px&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;label&gt;Frame&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;input id=&quot;rFW&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;8&quot; value=&quot;4&quot; style=&quot;width:44px&quot;&gt;&lt;span class=&quot;hint&quot;&gt;×&lt;/span&gt;&lt;input id=&quot;rFH&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;8&quot; value=&quot;4&quot; style=&quot;width:44px&quot;&gt;&lt;span id=&quot;rFpx&quot; class=&quot;hint&quot;&gt;tiles&lt;/span&gt;&lt;/div&gt;
        &lt;label&gt;Scale&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;input id=&quot;rScale&quot; type=&quot;number&quot; min=&quot;0.1&quot; max=&quot;8&quot; step=&quot;0.05&quot; value=&quot;1&quot; style=&quot;width:62px&quot;&gt;&lt;span class=&quot;hint&quot;&gt;px/voxel&lt;/span&gt;&lt;button id=&quot;btnFit&quot; class=&quot;small&quot; title=&quot;Largest scale where every rotation and frame fits in the frame&quot;&gt;Auto-fit&lt;/button&gt;&lt;/div&gt;
        &lt;label&gt;Offset&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;input id=&quot;rOffX&quot; type=&quot;number&quot; step=&quot;1&quot; value=&quot;0&quot; style=&quot;width:48px&quot;&gt;&lt;input id=&quot;rOffY&quot; type=&quot;number&quot; step=&quot;1&quot; value=&quot;0&quot; style=&quot;width:48px&quot;&gt;&lt;span class=&quot;hint&quot;&gt;px (x, y)&lt;/span&gt;&lt;/div&gt;
        &lt;label&gt;Sampling&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;select id=&quot;rSS&quot;&gt;&lt;option value=&quot;1&quot;&gt;1× (sharp)&lt;/option&gt;&lt;option value=&quot;3&quot; selected&gt;3×3 majority&lt;/option&gt;&lt;/select&gt;
          &lt;span class=&quot;hint&quot;&gt;cover&lt;/span&gt;&lt;input id=&quot;rCover&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;9&quot; value=&quot;4&quot; style=&quot;width:42px&quot; title=&quot;How many of the 9 sub-samples must hit for the pixel to be solid&quot;&gt;&lt;/div&gt;
        &lt;label&gt;Outline&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;select id=&quot;rOutline&quot;&gt;&lt;option value=&quot;none&quot;&gt;None&lt;/option&gt;&lt;option value=&quot;dark&quot; selected&gt;Dark shade&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
      &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;

        &lt;label&gt;Direction&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;input id=&quot;lAz&quot; type=&quot;range&quot; min=&quot;-180&quot; max=&quot;180&quot; value=&quot;-40&quot;&gt;&lt;span id=&quot;lAzV&quot; class=&quot;hint&quot; style=&quot;width:34px&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;label&gt;Elevation&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;input id=&quot;lEl&quot; type=&quot;range&quot; min=&quot;-30&quot; max=&quot;90&quot; value=&quot;45&quot;&gt;&lt;span id=&quot;lElV&quot; class=&quot;hint&quot; style=&quot;width:34px&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;label&gt;Light ≥&lt;/label&gt;

        &lt;label&gt;Mid ≥&lt;/label&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;input id=&quot;lT1&quot; type=&quot;range&quot; min=&quot;-100&quot; max=&quot;100&quot; value=&quot;5&quot;&gt;&lt;span id=&quot;lT1V&quot; class=&quot;hint&quot; style=&quot;width:34px&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint&quot; style=&quot;margin-top:4px&quot;&gt;Each visible face gets N·L; above &quot;Light&quot; → index 3, above &quot;Mid&quot; → 2, else 1. Camera-fixed light keeps every rotation lit the same way (classic sprite look).&lt;/div&gt;

    &lt;/div&gt;

      &lt;div class=&quot;row&quot;&gt;
        &lt;button id=&quot;btnExpTile&quot; title=&quot;Opens in the Tile Editor (Load Project) and the Tilemap Editor (Import Tileset)&quot;&gt;.ngptile.json&lt;/button&gt;
        &lt;button id=&quot;btnKitSendTile&quot; title=&quot;Open the rendered sheet as a new project tab in the Tile Editor&quot;&gt;Send to Tile Editor&lt;/button&gt;
        &lt;button id=&quot;btnExpC&quot;&gt;Download .c&lt;/button&gt;
        &lt;button id=&quot;btnCopyC&quot;&gt;Copy C&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;button id=&quot;btnExpPng&quot;&gt;Sheet PNG&lt;/button&gt;
        &lt;button id=&quot;btnExpPngLayers&quot; title=&quot;One PNG per layer — feeds tools/ngpc_sprite_export.py (base + --layer2 overlay)&quot;&gt;PNG per layer&lt;/button&gt;
        &lt;label class=&quot;hint&quot;&gt;×&lt;input id=&quot;pngScale&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;16&quot; value=&quot;1&quot; style=&quot;width:42px&quot;&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;label class=&quot;hint&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkFar&quot;&gt; NGP_FAR&lt;/label&gt;
        &lt;label class=&quot;hint&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;chkComments&quot; checked&gt; Comments&lt;/label&gt;
      &lt;/div&gt;

&lt;div id=&quot;modalOverlay&quot;&gt;&lt;div id=&quot;modalBox&quot;&gt;&lt;div id=&quot;modalMsg&quot;&gt;&lt;/div&gt;&lt;div class=&quot;row&quot; id=&quot;modalBtns&quot; style=&quot;justify-content:flex-end;margin-top:12px&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
&#x27;use strict&#x27;;
/* =====================================================================================
   NGPC Voxel Sprite Tool
   Builds a voxel model and ray-casts it into an NGPC-legal sprite sheet:
   8x8 tiles, 2bpp (MSB-first, 2 bits/pixel, pixel 0 in bits 15-14), RGB444 palettes
   (word = r | g&lt;&lt;4 | b&lt;&lt;8), palette index 0 = transparent, max 3 visible colors per tile,
   one palette per tile per layer, 16-palette sprite bank. Output formats match the
   NGPC Tile Editor (.ngptile.json v2 and its C array layout).
   ===================================================================================== */
const TILE=8;
const MAX_MATS=16;
const $=id=&gt;document.getElementById(id);
const clamp=(v,a,b)=&gt;v&lt;a?a:v&gt;b?b:v;

/* ---------------- state ---------------- */
const DEFAULT_RENDER={rotations:8,start:0,dir:1,pitch:30,fw:4,fh:4,scale:1,offX:0,offY:0,ss:3,cover:4,outline:&#x27;dark&#x27;,
  lightMode:&#x27;camera&#x27;,lightAz:-40,lightEl:45,t2:60,t1:5,tileMode:&#x27;fix&#x27;};
let S=null;           // project state
let undoStack=[],redoStack=[];
let tool=&#x27;pencil&#x27;;
let sliceIdx=0, sliceAxis=&#x27;y&#x27;;
let view={yaw:-35,pitch:30,zoom:1};
let sheet=null;       // last render result

function mkMat(name,dark,mid,light){return {name,colors:[dark,mid,light].map(c=&gt;({r:c[0],g:c[1],b:c[2]}))};}
function blankProject(){
  return {name:&#x27;my_object&#x27;,X:16,Y:16,Z:16,
    materials:[mkMat(&#x27;wall&#x27;,[6,4,2],[11,8,4],[15,13,8]),mkMat(&#x27;roof&#x27;,[6,1,1],[11,3,2],[15,7,5]),
               mkMat(&#x27;stone&#x27;,[4,4,5],[8,8,9],[12,12,13]),mkMat(&#x27;leaf&#x27;,[1,5,2],[3,9,3],[8,13,5])],
    frames:[new Uint8Array(16*16*16)],cur:0,activeMat:0,render:{...DEFAULT_RENDER}};
}
function sampleModel(){
  // small house: walls, door gap, stepped roof -- a quick demo of a 2-material object
  const p=blankProject(); const v=p.frames[0];
  const set=(x,y,z,m)=&gt;{ if(x&gt;=0&amp;&amp;y&gt;=0&amp;&amp;z&gt;=0&amp;&amp;x&lt;p.X&amp;&amp;y&lt;p.Y&amp;&amp;z&lt;p.Z) v[x+p.X*(z+p.Z*y)]=m; };
  for(let y=0;y&lt;6;y++) for(let x=3;x&lt;13;x++) for(let z=4;z&lt;12;z++){
    const edge=x===3||x===12||z===4||z===11;
    if(!edge) continue;
    if(z===11 &amp;&amp; x&gt;=7&amp;&amp;x&lt;=8 &amp;&amp; y&lt;4) continue; // door
    set(x,y,z,1);
  }
  for(let k=0;k&lt;5;k++) for(let x=2+k;x&lt;14-k;x++) for(let z=3;z&lt;13;z++) set(x,6+k,z,2); // roof
  set(10,11,6,3); set(10,12,6,3); set(10,11,7,3); set(10,12,7,3); // chimney
  return p;
}

const vi=(x,y,z)=&gt;x+S.X*(z+S.Z*y);
const curVox=()=&gt;S.frames[S.cur];
function getV(x,y,z){ if(x&lt;0||y&lt;0||z&lt;0||x&gt;=S.X||y&gt;=S.Y||z&gt;=S.Z) return 0; return curVox()[vi(x,y,z)]; }
function setV(x,y,z,m){
  if(x&lt;0||y&lt;0||z&lt;0||x&gt;=S.X||y&gt;=S.Y||z&gt;=S.Z) return;
  curVox()[vi(x,y,z)]=m;
  if($(&#x27;chkMirror&#x27;).checked){ const mx=S.X-1-x; curVox()[vi(mx,y,z)]=m; }
}

/* ---------------- undo ---------------- */
function snap(){ return {X:S.X,Y:S.Y,Z:S.Z,cur:S.cur,frames:S.frames.map(f=&gt;f.slice()),materials:JSON.parse(JSON.stringify(S.materials))}; }
function restore(s){ S.X=s.X;S.Y=s.Y;S.Z=s.Z;S.cur=s.cur;S.frames=s.frames;S.materials=s.materials; }
function pushUndo(){ undoStack.push(snap()); if(undoStack.length&gt;80) undoStack.shift(); redoStack=[]; }
function undo(){ if(!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); afterStructural(); }
function redo(){ if(!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); afterStructural(); }

/* ---------------- color helpers ---------------- */
const hex4=c=&gt;&#x27;#&#x27;+[c.r,c.g,c.b].map(v=&gt;(v*17).toString(16).padStart(2,&#x27;0&#x27;)).join(&#x27;&#x27;);
const css4=c=&gt;`rgb(${c.r*17},${c.g*17},${c.b*17})`;
const word444=c=&gt;(c.r&amp;15)|((c.g&amp;15)&lt;&lt;4)|((c.b&amp;15)&lt;&lt;8);
const dist2=(a,b)=&gt;{const dr=a.r-b.r,dg=a.g-b.g,db=a.b-b.b; return 2*dr*dr+4*dg*dg+db*db;};
function autoShade(mid){
  const d=v=&gt;Math.round(v*0.55), l=v=&gt;Math.min(15,Math.round(v+(15-v)*0.5));
  return [{r:d(mid.r),g:d(mid.g),b:d(mid.b)},{...mid},{r:l(mid.r),g:l(mid.g),b:l(mid.b)}];
}

/* =====================================================================================
   Ray caster (orthographic). Shared by the 3D view and the sprite renderer so the
   preview is exactly what gets exported.
   ===================================================================================== */
function camera(yawDeg,pitchDeg){
  const th=yawDeg*Math.PI/180, ph=pitchDeg*Math.PI/180;
  const c=[Math.sin(th)*Math.cos(ph),Math.sin(ph),Math.cos(th)*Math.cos(ph)]; // toward camera
  const f=[-c[0],-c[1],-c[2]];
  const r=[Math.cos(th),0,-Math.sin(th)];
  const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return {c,f,r,u};
}
function lightVec(cam,R){
  const az=R.lightAz*Math.PI/180, el=R.lightEl*Math.PI/180;
  // in camera space: x=right, y=up, z=toward camera; az 0 = from above, negative = from the left
  const lx=Math.sin(az)*Math.cos(el), ly=Math.cos(az)*Math.cos(el), lz=Math.sin(el);
  if(R.lightMode===&#x27;world&#x27;){
    const w=camera(R.start,R.pitch); // world light = camera light as seen from rotation 0
    return norm([w.r[0]*lx+w.u[0]*ly+w.c[0]*lz, w.r[1]*lx+w.u[1]*ly+w.c[1]*lz, w.r[2]*lx+w.u[2]*ly+w.c[2]*lz]);
  }
  return norm([cam.r[0]*lx+cam.u[0]*ly+cam.c[0]*lz, cam.r[1]*lx+cam.u[1]*ly+cam.c[1]*lz, cam.r[2]*lx+cam.u[2]*ly+cam.c[2]*lz]);
}
function norm(v){const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l];}

// Returns hit info into `out` ({m, x,y,z, axis, sign, t}) or false. vox is the voxel array.
function castRay(vox,X,Y,Z,ox,oy,oz,dx,dy,dz,out){
  // slab intersection with [0,X]x[0,Y]x[0,Z]
  let t0=-Infinity,t1=Infinity,enterAxis=0;
  const o=[ox,oy,oz],d=[dx,dy,dz],mx=[X,Y,Z];
  for(let a=0;a&lt;3;a++){
    if(Math.abs(d[a])&lt;1e-12){ if(o[a]&lt;0||o[a]&gt;mx[a]) return false; continue; }
    let ta=(0-o[a])/d[a], tb=(mx[a]-o[a])/d[a];
    if(ta&gt;tb){const t=ta;ta=tb;tb=t;}
    if(ta&gt;t0){t0=ta;enterAxis=a;}
    if(tb&lt;t1)t1=tb;
  }
  if(t0&gt;t1||t1&lt;0) return false;
  const tStart=Math.max(t0,0)+1e-7;
  const p=[o[0]+d[0]*tStart,o[1]+d[1]*tStart,o[2]+d[2]*tStart];
  const ip=[clamp(Math.floor(p[0]),0,X-1),clamp(Math.floor(p[1]),0,Y-1),clamp(Math.floor(p[2]),0,Z-1)];
  const step=[d[0]&gt;0?1:-1,d[1]&gt;0?1:-1,d[2]&gt;0?1:-1];
  const tMax=[0,0,0],tDelta=[0,0,0];
  for(let a=0;a&lt;3;a++){
    if(Math.abs(d[a])&lt;1e-12){tMax[a]=Infinity;tDelta[a]=Infinity;continue;}
    const bound=step[a]&gt;0?ip[a]+1:ip[a];
    tMax[a]=tStart+(bound-p[a])/d[a];
    tDelta[a]=Math.abs(1/d[a]);
  }
  let axis=enterAxis, t=tStart;
  const XZ=X*Z;
  for(let guard=0;guard&lt;4096;guard++){
    const m=vox[ip[0]+X*ip[2]+XZ*ip[1]];
    if(m){ out.m=m; out.x=ip[0]; out.y=ip[1]; out.z=ip[2]; out.axis=axis; out.sign=-step[axis]; out.t=t; return true; }
    // advance
    let a=0; if(tMax[1]&lt;tMax[a])a=1; if(tMax[2]&lt;tMax[a])a=2;
    ip[a]+=step[a]; t=tMax[a]; tMax[a]+=tDelta[a]; axis=a;
    if(ip[a]&lt;0||ip[a]&gt;=mx[a]) return false;
  }
  return false;
}
function shadeFor(axis,sign,L,R){
  const n=L[axis]*sign; // dot(normal,L), normal is axis-aligned
  if(n&gt;=R.t2/100) return 3;
  if(n&gt;=R.t1/100) return 2;
  return 1;
}

/* ---------------- model bounds (union of all frames) ---------------- */
function modelBounds(){
  let b={x0:Infinity,y0:Infinity,z0:Infinity,x1:-Infinity,y1:-Infinity,z1:-Infinity,empty:true};
  for(const f of S.frames){
    for(let y=0;y&lt;S.Y;y++) for(let z=0;z&lt;S.Z;z++) for(let x=0;x&lt;S.X;x++){
      if(f[x+S.X*(z+S.Z*y)]){ b.empty=false;
        if(x&lt;b.x0)b.x0=x; if(x+1&gt;b.x1)b.x1=x+1; if(y&lt;b.y0)b.y0=y; if(y+1&gt;b.y1)b.y1=y+1; if(z&lt;b.z0)b.z0=z; if(z+1&gt;b.z1)b.z1=z+1; }
    }
  }
  if(b.empty) b={x0:0,y0:0,z0:0,x1:S.X,y1:S.Y,z1:S.Z,empty:true};
  return b;
}
// Center used by the sprite camera: the grid&#x27;s X/Z center (so spinning stays put) and the bounds&#x27; Y center.
function spriteCenter(b){ return [S.X/2,(b.y0+b.y1)/2,S.Z/2]; }
function rotationYaw(k){ const R=S.render; return R.start + R.dir*k*360/R.rotations; }

function autoFit(){
  const R=S.render, b=modelBounds(), ctr=spriteCenter(b);
  const W=R.fw*TILE, H=R.fh*TILE, margin=R.outline!==&#x27;none&#x27;?1.5:0.5;
  let mx=0.01,my=0.01;
  for(let k=0;k&lt;R.rotations;k++){
    const cam=camera(rotationYaw(k),R.pitch);
    for(const cx of [b.x0,b.x1]) for(const cy of [b.y0,b.y1]) for(const cz of [b.z0,b.z1]){
      const p=[cx-ctr[0],cy-ctr[1],cz-ctr[2]];
      mx=Math.max(mx,Math.abs(p[0]*cam.r[0]+p[1]*cam.r[1]+p[2]*cam.r[2]));
      my=Math.max(my,Math.abs(p[0]*cam.u[0]+p[1]*cam.u[1]+p[2]*cam.u[2]));
    }
  }
  const s=Math.min((W/2-margin)/mx,(H/2-margin)/my);
  R.scale=Math.max(0.1,Math.floor(s*20)/20);
  R.offX=0; R.offY=0;
}

/* =====================================================================================
   Sprite renderer: one frame (model f, rotation k) -&gt; per-pixel material + shade
   ===================================================================================== */
function renderCell(vox,yaw,b){
  const R=S.render, W=R.fw*TILE, H=R.fh*TILE;
  const cam=camera(yaw,R.pitch), L=lightVec(cam,R);
  const ctr=spriteCenter(b);
  const mat=new Int16Array(W*H), shd=new Uint8Array(W*H);
  const D=1000, out={};
  const ss=R.ss|0, cover=ss===1?1:clamp(R.cover|0,1,ss*ss);
  const counts=new Map();
  for(let py=0;py&lt;H;py++) for(let px=0;px&lt;W;px++){
    counts.clear(); let hits=0, centerKey=-1;
    for(let sy=0;sy&lt;ss;sy++) for(let sx=0;sx&lt;ss;sx++){
      const fx=px+(sx+0.5)/ss, fy=py+(sy+0.5)/ss;
      const u=(fx-W/2-R.offX)/R.scale, v=-(fy-H/2-R.offY)/R.scale;
      const ox=ctr[0]+cam.r[0]*u+cam.u[0]*v+cam.c[0]*D;
      const oy=ctr[1]+cam.r[1]*u+cam.u[1]*v+cam.c[1]*D;
      const oz=ctr[2]+cam.r[2]*u+cam.u[2]*v+cam.c[2]*D;
      if(castRay(vox,S.X,S.Y,S.Z,ox,oy,oz,cam.f[0],cam.f[1],cam.f[2],out)){
        const key=(out.m-1)*4+shadeFor(out.axis,out.sign,L,R);
        counts.set(key,(counts.get(key)||0)+1); hits++;
        if(sx===(ss&gt;&gt;1)&amp;&amp;sy===(ss&gt;&gt;1)) centerKey=key;
      }
    }
    const i=py*W+px;
    if(hits&lt;cover){ mat[i]=-1; continue; }
    let best=-1,bc=-1;
    for(const [k,c] of counts){ if(c&gt;bc||(c===bc&amp;&amp;k===centerKey)){best=k;bc=c;} }
    mat[i]=best&gt;&gt;2; shd[i]=best&amp;3;
  }
  if(R.outline===&#x27;dark&#x27;){
    const m2=mat.slice();
    for(let y=0;y&lt;H;y++) for(let x=0;x&lt;W;x++){
      const i=y*W+x; if(mat[i]&gt;=0) continue;
      let nm=-1;
      if(x&gt;0&amp;&amp;mat[i-1]&gt;=0)nm=mat[i-1]; else if(x&lt;W-1&amp;&amp;mat[i+1]&gt;=0)nm=mat[i+1];
      else if(y&gt;0&amp;&amp;mat[i-W]&gt;=0)nm=mat[i-W]; else if(y&lt;H-1&amp;&amp;mat[i+W]&gt;=0)nm=mat[i+W];
      if(nm&gt;=0){ m2[i]=nm; shd[i]=1; }
    }
    mat.set(m2);
  }
  return {mat,shd,W,H};
}

/* =====================================================================================
   Sheet build + NGPC tile-rule enforcement
   ===================================================================================== */
function buildSheet(){
  const R=S.render, fw=R.fw, fh=R.fh, W=fw*TILE, H=fh*TILE;
  const cols=R.rotations, rows=S.frames.length;
  const gridW=cols*fw, gridH=rows*fh, PW=gridW*TILE, PH=gridH*TILE;
  const mat=new Int16Array(PW*PH).fill(-1), shd=new Uint8Array(PW*PH);
  const bounds=modelBounds();
  for(let f=0;f&lt;rows;f++) for(let k=0;k&lt;cols;k++){
    const cell=renderCell(S.frames[f],rotationYaw(k),bounds);
    for(let y=0;y&lt;H;y++) for(let x=0;x&lt;W;x++){
      const si=y*W+x, di=(f*H+y)*PW+(k*W+x);
      mat[di]=cell.mat[si]; shd[di]=cell.shd[si];
    }
  }
  const split=R.tileMode===&#x27;split&#x27;;
  const nL=split?2:1;
  const layers=[];
  for(let l=0;l&lt;nL;l++) layers.push({name:split?(l===0?&#x27;base&#x27;:&#x27;overlay&#x27;):&#x27;sprite&#x27;,pixels:new Uint8Array(PW*PH),tilePalette:new Int16Array(gridW*gridH).fill(-1)});
  const conflicts=[]; // {tx,ty,severity}
  const mats=S.materials;
  for(let ty=0;ty&lt;gridH;ty++) for(let tx=0;tx&lt;gridW;tx++){
    const cnt=new Map();
    for(let y=0;y&lt;TILE;y++) for(let x=0;x&lt;TILE;x++){
      const m=mat[(ty*TILE+y)*PW+tx*TILE+x]; if(m&gt;=0) cnt.set(m,(cnt.get(m)||0)+1);
    }
    if(!cnt.size) continue;
    const order=[...cnt.entries()].sort((a,b)=&gt;b[1]-a[1]||a[0]-b[0]).map(e=&gt;e[0]);
    const keep=order.slice(0,nL);       // materials that get a real palette in this tile (one per layer)
    keep.forEach((m,l)=&gt;{ layers[l].tilePalette[ty*gridW+tx]=m; });
    if(order.length&gt;nL) conflicts.push({tx,ty,mats:order.length});
    for(let y=0;y&lt;TILE;y++) for(let x=0;x&lt;TILE;x++){
      const i=(ty*TILE+y)*PW+tx*TILE+x, m=mat[i]; if(m&lt;0) continue;
      let l=keep.indexOf(m), idx=shd[i];
      if(l&lt;0){ // remap to nearest shade among the kept palettes
        const col=mats[m].colors[shd[i]-1]; let bd=Infinity;
        keep.forEach((km,kl)=&gt;{ for(let s=1;s&lt;=3;s++){ const d=dist2(col,mats[km].colors[s-1]); if(d&lt;bd){bd=d;l=kl;idx=s;} } });
      }
      layers[l].pixels[i]=idx;
    }
  }
  return {gridW,gridH,PW,PH,fw,fh,cols,rows,layers,conflicts};
}

/* ---------------- budget ---------------- */
function tileWords(layer,PW,tx,ty){
  const w=[]; for(let r=0;r&lt;TILE;r++){ let word=0; for(let i=0;i&lt;TILE;i++) word|=(layer.pixels[(ty*TILE+r)*PW+tx*TILE+i]&amp;3)&lt;&lt;(14-i*2); w.push(word); } return w;
}
function computeBudget(sh){
  const uniq=new Set(); let maxParts=0, emptyAll=true;
  for(let f=0;f&lt;sh.rows;f++) for(let k=0;k&lt;sh.cols;k++){
    let parts=0;
    sh.layers.forEach(L=&gt;{
      for(let y=0;y&lt;sh.fh;y++) for(let x=0;x&lt;sh.fw;x++){
        const tx=k*sh.fw+x, ty=f*sh.fh+y, w=tileWords(L,sh.PW,tx,ty);
        if(w.some(v=&gt;v)){ parts++; uniq.add(w.join(&#x27;,&#x27;)); emptyAll=false; }
      }
    });
    maxParts=Math.max(maxParts,parts);
  }
  const usedPals=new Set(); sh.layers.forEach(L=&gt;L.tilePalette.forEach(p=&gt;{ if(p&gt;=0) usedPals.add(p); }));
  return {uniqTiles:uniq.size,maxParts,usedPals:usedPals.size,mats:S.materials.length,conflicts:sh.conflicts.length,empty:emptyAll};
}
function renderBudget(b){
  const row=(k,v,cls)=&gt;`&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;${k}&lt;/span&gt;&lt;b class=&quot;${cls}&quot;&gt;${v}&lt;/b&gt;&lt;/div&gt;`;
  $(&#x27;budget&#x27;).innerHTML=
    row(&#x27;Palettes (materials)&#x27;, `${S.materials.length} / 16`, S.materials.length&gt;16?&#x27;bad&#x27;:&#x27;ok&#x27;)+
    row(&#x27;Palettes actually used&#x27;, b.usedPals, &#x27;ok&#x27;)+
    row(&#x27;Unique tiles (whole sheet)&#x27;, `${b.uniqTiles} / 512 shared`, b.uniqTiles&gt;512?&#x27;bad&#x27;:b.uniqTiles&gt;256?&#x27;warn&#x27;:&#x27;ok&#x27;)+
    row(&#x27;Sprites per pose (worst)&#x27;, `${b.maxParts} / 16 metasprite parts`, b.maxParts&gt;16?&#x27;bad&#x27;:b.maxParts&gt;12?&#x27;warn&#x27;:&#x27;ok&#x27;)+
    row(&#x27;Hardware sprites (64 total)&#x27;, `${b.maxParts} used by one pose`, b.maxParts&gt;64?&#x27;bad&#x27;:&#x27;ok&#x27;)+
    row(&#x27;Mixed-material tiles remapped&#x27;, b.conflicts, b.conflicts?&#x27;warn&#x27;:&#x27;ok&#x27;)+
    `&lt;div class=&quot;hint&quot; style=&quot;margin-top:4px&quot;&gt;Tile slots are counted after de-duplication (identical 2bpp patterns share one slot; palettes are per sprite).&lt;/div&gt;`;
}

/* =====================================================================================
   Drawing: sheet, spin preview, slice editor, 3D view

const bankColor=(pal,idx)=&gt;S.materials[pal]?S.materials[pal].colors[idx-1]:{r:15,g:0,b:15};

    for(let x=0;x&lt;=sh.gridW;x++){ctx.moveTo(x*TILE*z+.5,0);ctx.lineTo(x*TILE*z+.5,cv.height);}
    for(let y=0;y&lt;=sh.gridH;y++){ctx.moveTo(0,y*TILE*z+.5);ctx.lineTo(cv.width,y*TILE*z+.5);}

    (sh.conflicts.length?`${sh.conflicts.length} tile(s) outlined red had extra materials remapped.`:&#x27;No tile-rule conflicts.&#x27;);
}

let spinT=0, spinTimer=null;

}

/* ---- slice editor ---- */
function sliceDims(){
  if(sliceAxis===&#x27;y&#x27;) return {w:S.X,h:S.Z,n:S.Y};
  if(sliceAxis===&#x27;z&#x27;) return {w:S.X,h:S.Y,n:S.Z};
  return {w:S.Z,h:S.Y,n:S.X};
}
function sliceToVox(h,v,idx){
  if(sliceAxis===&#x27;y&#x27;) return [h,idx,v];
  if(sliceAxis===&#x27;z&#x27;) return [h,S.Y-1-v,idx];
  return [idx,S.Y-1-v,S.Z-1-h];
}
function drawSlice(){
  const {w,h,n}=sliceDims(); sliceIdx=clamp(sliceIdx,0,n-1);
  const cz=+$(&#x27;sliceZoom&#x27;).value, cv=$(&#x27;sliceCanvas&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
  cv.width=w*cz; cv.height=h*cz; ctx.clearRect(0,0,cv.width,cv.height);
  const onion=$(&#x27;chkOnion&#x27;).checked;
  const below=sliceAxis===&#x27;y&#x27;?sliceIdx-1:sliceAxis===&#x27;z&#x27;?sliceIdx-1:sliceIdx-1;
  for(let v=0;v&lt;h;v++) for(let u=0;u&lt;w;u++){
    const [x,y,z]=sliceToVox(u,v,sliceIdx), m=getV(x,y,z);
    if(m){ ctx.fillStyle=css4(S.materials[m-1].colors[1]); ctx.fillRect(u*cz,v*cz,cz,cz);
      ctx.fillStyle=css4(S.materials[m-1].colors[2]); ctx.fillRect(u*cz,v*cz,cz,Math.max(2,cz/6)); }
    else if(onion &amp;&amp; below&gt;=0){
      const [bx,by,bz]=sliceToVox(u,v,below), bm=getV(bx,by,bz);
      if(bm){ ctx.globalAlpha=.28; ctx.fillStyle=css4(S.materials[bm-1].colors[1]); ctx.fillRect(u*cz,v*cz,cz,cz); ctx.globalAlpha=1; }
    }
  }
  ctx.strokeStyle=&#x27;rgba(128,128,140,.35)&#x27;; ctx.lineWidth=1; ctx.beginPath();
  for(let u=0;u&lt;=w;u++){ctx.moveTo(u*cz+.5,0);ctx.lineTo(u*cz+.5,cv.height);}
  for(let v=0;v&lt;=h;v++){ctx.moveTo(0,v*cz+.5);ctx.lineTo(cv.width,v*cz+.5);}
  ctx.stroke();
  // center lines every 8 for orientation
  ctx.strokeStyle=&#x27;rgba(128,128,140,.7)&#x27;; ctx.beginPath();
  for(let u=8;u&lt;w;u+=8){ctx.moveTo(u*cz+.5,0);ctx.lineTo(u*cz+.5,cv.height);}
  for(let v=8;v&lt;h;v+=8){ctx.moveTo(0,v*cz+.5);ctx.lineTo(cv.width,v*cz+.5);}
  ctx.stroke();
  if($(&#x27;chkMirror&#x27;).checked &amp;&amp; sliceAxis!==&#x27;x&#x27;){
    ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue(&#x27;--accent2&#x27;).trim(); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(w*cz/2,0); ctx.lineTo(w*cz/2,cv.height); ctx.stroke();
  }
  if(rectStart&amp;&amp;rectEnd){
    const u0=Math.min(rectStart[0],rectEnd[0]),u1=Math.max(rectStart[0],rectEnd[0]),v0=Math.min(rectStart[1],rectEnd[1]),v1=Math.max(rectStart[1],rectEnd[1]);
    ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue(&#x27;--accent&#x27;).trim(); ctx.lineWidth=2;
    ctx.strokeRect(u0*cz+1,v0*cz+1,(u1-u0+1)*cz-2,(v1-v0+1)*cz-2);
  }
  const axisName={y:&#x27;Y&#x27;,z:&#x27;Z&#x27;,x:&#x27;X&#x27;}[sliceAxis];
  $(&#x27;sliceLabel&#x27;).textContent=`${axisName} ${sliceIdx} / ${n-1}`;
}

/* ---- 3D view ---- */
let viewHit=null; // per-pixel hit buffer for picking
let hover=null;
function drawView(){
  const cv=$(&#x27;viewCanvas&#x27;), W=cv.width, H=cv.height, ctx=cv.getContext(&#x27;2d&#x27;);
  const img=ctx.createImageData(W,H), d=img.data;
  const R=S.render, cam=camera(view.yaw,view.pitch), L=lightVec(cam,R);
  const ctr=[S.X/2,S.Y/2,S.Z/2], diag=Math.hypot(S.X,S.Y,S.Z);
  const sc=(W/diag)*0.95*view.zoom, out={}, D=1000, vox=curVox();
  viewHit=new Int32Array(W*H).fill(-1);
  const viewFaceAxis=new Int8Array(W*H);
  for(let py=0;py&lt;H;py++) for(let px=0;px&lt;W;px++){
    const u=(px+0.5-W/2)/sc, v=-(py+0.5-H/2)/sc;
    const ox=ctr[0]+cam.r[0]*u+cam.u[0]*v+cam.c[0]*D, oy=ctr[1]+cam.r[1]*u+cam.u[1]*v+cam.c[1]*D, oz=ctr[2]+cam.r[2]*u+cam.u[2]*v+cam.c[2]*D;
    const i=py*W+px;
    if(castRay(vox,S.X,S.Y,S.Z,ox,oy,oz,cam.f[0],cam.f[1],cam.f[2],out)){
      const s=shadeFor(out.axis,out.sign,L,R), c=S.materials[out.m-1].colors[s-1];
      // subtle voxel edge lines (display only)
      const hx=ox+cam.f[0]*out.t, hy=oy+cam.f[1]*out.t, hz=oz+cam.f[2]*out.t;
      const fr=[hx-Math.floor(hx),hy-Math.floor(hy),hz-Math.floor(hz)];
      let edge=false; const e=Math.max(0.035,0.7/sc);
      for(let a=0;a&lt;3;a++){ if(a===out.axis) continue; if(fr[a]&lt;e||fr[a]&gt;1-e) edge=true; }
      const k=edge?0.82:1;
      d[i*4]=c.r*17*k; d[i*4+1]=c.g*17*k; d[i*4+2]=c.b*17*k; d[i*4+3]=255;
      viewHit[i]=vi(out.x,out.y,out.z); viewFaceAxis[i]=(out.axis*2+(out.sign&gt;0?1:0));
    }
  }
  viewHit.face=viewFaceAxis;
  ctx.putImageData(img,0,0);
  // wireframe: bounding box + active slice plane + floor
  const proj=p=&gt;[W/2+((p[0]-ctr[0])*cam.r[0]+(p[1]-ctr[1])*cam.r[1]+(p[2]-ctr[2])*cam.r[2])*sc,
                 H/2-((p[0]-ctr[0])*cam.u[0]+(p[1]-ctr[1])*cam.u[1]+(p[2]-ctr[2])*cam.u[2])*sc];
  const line=(a,b)=&gt;{const A=proj(a),B=proj(b); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]);};
  const quad=(q)=&gt;{ for(let i=0;i&lt;4;i++) line(q[i],q[(i+1)%4]); };
  ctx.lineWidth=1; ctx.strokeStyle=&#x27;rgba(128,128,140,.55)&#x27;; ctx.beginPath();
  const X=S.X,Y=S.Y,Z=S.Z;
  quad([[0,0,0],[X,0,0],[X,0,Z],[0,0,Z]]); quad([[0,Y,0],[X,Y,0],[X,Y,Z],[0,Y,Z]]);
  line([0,0,0],[0,Y,0]); line([X,0,0],[X,Y,0]); line([X,0,Z],[X,Y,Z]); line([0,0,Z],[0,Y,Z]);
  ctx.stroke();
  // front marker (+Z)
  ctx.strokeStyle=&#x27;rgba(95,224,160,.9)&#x27;; ctx.lineWidth=2; ctx.beginPath(); line([X/2-1,0,Z],[X/2+1,0,Z]); line([X/2,0,Z],[X/2,0,Z+1.5]); ctx.stroke();
  const cs=getComputedStyle(document.body);
  ctx.strokeStyle=cs.getPropertyValue(&#x27;--accent2&#x27;).trim(); ctx.lineWidth=1.5; ctx.beginPath();
  const s=sliceIdx+0.5;
  if(sliceAxis===&#x27;y&#x27;) quad([[0,s,0],[X,s,0],[X,s,Z],[0,s,Z]]);
  else if(sliceAxis===&#x27;z&#x27;) quad([[0,0,s],[X,0,s],[X,Y,s],[0,Y,s]]);
  else quad([[s,0,0],[s,Y,0],[s,Y,Z],[s,0,Z]]);
  ctx.stroke();
  if(hover){
    ctx.strokeStyle=&#x27;#fff&#x27;; ctx.lineWidth=2; ctx.beginPath();
    const {x,y,z}=hover; quad(faceQuad(x,y,z,hover.axis,hover.sign)); ctx.stroke();
  }
  viewCtx={cam,sc,ctr,W,H};
}
let viewCtx=null;
function faceQuad(x,y,z,axis,sign){
  const o=sign&gt;0?1:0;
  if(axis===0) return [[x+o,y,z],[x+o,y+1,z],[x+o,y+1,z+1],[x+o,y,z+1]];
  if(axis===1) return [[x,y+o,z],[x+1,y+o,z],[x+1,y+o,z+1],[x,y+o,z+1]];
  return [[x,y,z+o],[x+1,y,z+o],[x+1,y+1,z+o],[x,y+1,z+o]];
}
function viewPick(px,py){
  const W=viewCtx.W,H=viewCtx.H; px=clamp(px|0,0,W-1); py=clamp(py|0,0,H-1);
  const i=py*W+px, h=viewHit[i];
  if(h&gt;=0){
    const f=viewHit.face[i], axis=f&gt;&gt;1, sign=(f&amp;1)?1:-1;
    const x=h%S.X, z=Math.floor(h/S.X)%S.Z, y=Math.floor(h/(S.X*S.Z));
    return {x,y,z,axis,sign,floor:false};
  }
  // no voxel: try the floor plane y=0
  const {cam,sc,ctr}=viewCtx, u=(px+0.5-W/2)/sc, v=-(py+0.5-H/2)/sc, D=1000;
  const o=[0,1,2].map(a=&gt;ctr[a]+cam.r[a]*u+cam.u[a]*v+cam.c[a]*D);
  if(Math.abs(cam.f[1])&lt;1e-6) return null;
  const t=(0-o[1])/cam.f[1]; if(t&lt;0) return null;
  const fx=o[0]+cam.f[0]*t, fz=o[2]+cam.f[2]*t;
  if(fx&lt;0||fz&lt;0||fx&gt;=S.X||fz&gt;=S.Z) return null;
  return {x:Math.floor(fx),y:-1,z:Math.floor(fz),axis:1,sign:1,floor:true};
}

/* =====================================================================================
   Update scheduling
   ===================================================================================== */
let pending={sheet:false,view:false,slice:false};
let rafId=0;
function schedule(what){
  for(const k of what) pending[k]=true;
  if(!rafId) rafId=requestAnimationFrame(flush);
}
function flush(){
  rafId=0;
  if(pending.slice){ drawSlice(); }
  if(pending.view){ drawView(); }
  if(pending.sheet){ sheet=buildSheet(); drawSheet(); drawSpin(); renderBudget(computeBudget(sheet)); refreshCode(); scheduleAutosave(); }
  pending={sheet:false,view:false,slice:false};
}
const everything=()=&gt;schedule([&#x27;slice&#x27;,&#x27;view&#x27;,&#x27;sheet&#x27;]);
function afterStructural(){ syncUI(); everything(); }

/* ---- slice editor input ---- */
let sliceDrawing=false, rectStart=null, rectEnd=null, sliceBtn=0;
function sliceCell(e){
  const cv=$(&#x27;sliceCanvas&#x27;), r=cv.getBoundingClientRect(), cz=+$(&#x27;sliceZoom&#x27;).value;
  const u=Math.floor((e.clientX-r.left)*(cv.width/r.width)/cz), v=Math.floor((e.clientY-r.top)*(cv.height/r.height)/cz);
  const {w,h}=sliceDims(); if(u&lt;0||v&lt;0||u&gt;=w||v&gt;=h) return null; return [u,v];
}
function applySliceTool(u,v,btn){
  const [x,y,z]=sliceToVox(u,v,sliceIdx);
  const t=btn===2?&#x27;erase&#x27;:tool;
  if(t===&#x27;pencil&#x27;) setV(x,y,z,S.activeMat+1);
  else if(t===&#x27;erase&#x27;) setV(x,y,z,0);
  else if(t===&#x27;paint&#x27;){ if(getV(x,y,z)) setV(x,y,z,S.activeMat+1); }
}
$(&#x27;sliceCanvas&#x27;).addEventListener(&#x27;contextmenu&#x27;,e=&gt;e.preventDefault());
$(&#x27;sliceCanvas&#x27;).addEventListener(&#x27;pointerdown&#x27;,e=&gt;{
  const c=sliceCell(e); if(!c) return; e.preventDefault();
  $(&#x27;sliceCanvas&#x27;).setPointerCapture(e.pointerId);
  sliceBtn=e.button;
  if(tool===&#x27;pick&#x27;&amp;&amp;e.button!==2){ const [x,y,z]=sliceToVox(c[0],c[1],sliceIdx), m=getV(x,y,z); if(m){S.activeMat=m-1; renderMats();} return; }
  pushUndo();
  if(tool===&#x27;fill&#x27;&amp;&amp;e.button!==2){ floodSlice(c[0],c[1]); everything(); return; }
  if(tool===&#x27;rect&#x27;&amp;&amp;e.button!==2){ rectStart=c; rectEnd=c; sliceDrawing=true; schedule([&#x27;slice&#x27;]); return; }
  sliceDrawing=true; applySliceTool(c[0],c[1],e.button); everything();
});
$(&#x27;sliceCanvas&#x27;).addEventListener(&#x27;pointermove&#x27;,e=&gt;{
  if(!sliceDrawing) return; const c=sliceCell(e); if(!c) return;
  if(rectStart){ rectEnd=c; schedule([&#x27;slice&#x27;]); return; }

});
window.addEventListener(&#x27;pointerup&#x27;,()=&gt;{
  if(rectStart&amp;&amp;rectEnd){
    const u0=Math.min(rectStart[0],rectEnd[0]),u1=Math.max(rectStart[0],rectEnd[0]),v0=Math.min(rectStart[1],rectEnd[1]),v1=Math.max(rectStart[1],rectEnd[1]);
    for(let v=v0;v&lt;=v1;v++) for(let u=u0;u&lt;=u1;u++){ const [x,y,z]=sliceToVox(u,v,sliceIdx); setV(x,y,z,S.activeMat+1); }
    rectStart=rectEnd=null; everything();
  }
  sliceDrawing=false; orbiting=false; viewDrawing=false;
});
function floodSlice(u0,v0){
  const {w,h}=sliceDims(), [x0,y0,z0]=sliceToVox(u0,v0,sliceIdx), target=getV(x0,y0,z0), rep=S.activeMat+1;
  if(target===rep) return;
  const seen=new Uint8Array(w*h), st=[[u0,v0]];
  const mirror=$(&#x27;chkMirror&#x27;).checked; $(&#x27;chkMirror&#x27;).checked=false; // fill region itself, mirror after
  const filled=[];
  while(st.length){
    const [u,v]=st.pop(); if(u&lt;0||v&lt;0||u&gt;=w||v&gt;=h||seen[v*w+u]) continue; seen[v*w+u]=1;
    const [x,y,z]=sliceToVox(u,v,sliceIdx); if(getV(x,y,z)!==target) continue;
    setV(x,y,z,rep); filled.push([x,y,z]);
    st.push([u+1,v],[u-1,v],[u,v+1],[u,v-1]);
  }
  $(&#x27;chkMirror&#x27;).checked=mirror;
  if(mirror) filled.forEach(([x,y,z])=&gt;setV(x,y,z,rep));
}

let orbiting=false, viewDrawing=false, lastXY=null;
function viewXY(e){ const cv=$(&#x27;viewCanvas&#x27;), r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; }
$(&#x27;viewCanvas&#x27;).addEventListener(&#x27;contextmenu&#x27;,e=&gt;e.preventDefault());
$(&#x27;viewCanvas&#x27;).addEventListener(&#x27;pointerdown&#x27;,e=&gt;{
  e.preventDefault(); $(&#x27;viewCanvas&#x27;).setPointerCapture(e.pointerId);
  lastXY=[e.clientX,e.clientY];
  if(e.button===2||e.button===1||e.shiftKey){ orbiting=true; return; }
  const [px,py]=viewXY(e), p=viewPick(px,py);
  if(!p){ orbiting=true; return; }   // empty space: drag to orbit
  if(tool===&#x27;pick&#x27;){ if(!p.floor){S.activeMat=getV(p.x,p.y,p.z)-1; renderMats();} return; }

    view.yaw=((view.yaw-(e.clientX-lastXY[0])*0.6+540)%360)-180; view.pitch=clamp(view.pitch+(e.clientY-lastXY[1])*0.5,-10,90);

  }

$(&#x27;btnResize&#x27;).onclick=()=&gt;{
  const nx=clamp(+$(&#x27;dimX&#x27;).value|0,1,48), ny=clamp(+$(&#x27;dimY&#x27;).value|0,1,48), nz=clamp(+$(&#x27;dimZ&#x27;).value|0,1,48);
  pushUndo();
  S.frames=S.frames.map(f=&gt;{ const n=new Uint8Array(nx*ny*nz);
    for(let y=0;y&lt;Math.min(ny,S.Y);y++) for(let z=0;z&lt;Math.min(nz,S.Z);z++) for(let x=0;x&lt;Math.min(nx,S.X);x++) n[x+nx*(z+nz*y)]=f[x+S.X*(z+S.Z*y)];
    return n; });

function transformAll(fn){ // fn(x,y,z) -&gt; [nx,ny,nz] in the same dims
  pushUndo();
  S.frames=S.frames.map(f=&gt;{ const n=new Uint8Array(f.length);
    for(let y=0;y&lt;S.Y;y++) for(let z=0;z&lt;S.Z;z++) for(let x=0;x&lt;S.X;x++){ const v=f[x+S.X*(z+S.Z*y)]; if(!v) continue;
      const [a,b,c]=fn(x,y,z); if(a&lt;0||b&lt;0||c&lt;0||a&gt;=S.X||b&gt;=S.Y||c&gt;=S.Z) continue; n[a+S.X*(c+S.Z*b)]=v; }
    return n; });
  everything();
}

  var r={ok:false,msg:'',tab:null,name:null}, o;
  try{ var txt=await f.text(); if(txt.charCodeAt(0)===0xFEFF) txt=txt.slice(1); o=JSON.parse(txt); }
  catch(err){ r.msg='Could not open "'+f.name+'": the file is not valid JSON.'; return r; }
  var kind=kindOf(o);
  if(!kind){ r.msg='Could not open "'+f.name+'": it is not a Tile Editor, Map Editor, Voxel or Graphics Kit file.'; return r; }
  try{
    if(kind==='kit'){
      var notes=[];
      for(var i=0;i<KEYS.length;i++){ var k=KEYS[i]; if(o[k]){ await tool(k).load(o[k]); notes.push(NAMES[k]+': '+tool(k).summary()); } }
      if(typeof o.name==='string'&&o.name) setName(o.name);
      r.ok=true; r.msg='"'+f.name+'" opened (all tabs). '+notes.join(' · ')+'.';
    } else {
      await tool(kind).load(o);
      r.ok=true; r.tab=kind;
      r.name=f.name.replace(/\.(ngptile|ngpmap|ngpvox|ngpgfx)?\.?json$/i,'');
      r.msg='"'+f.name+'" → '+NAMES[kind]+' ('+tool(kind).summary()+').';
    }
  }catch(err){ r.msg='Could not open "'+f.name+'": '+((err&&err.message)||'unexpected data')+'.'; }
  return r;
}
async function openFiles(list){
  var fs=Array.prototype.slice.call(list||[]).filter(Boolean);
  if(!fs.length) return;
  await allReady;
  var ntt=fs.filter(function(f){return /\.ntt$/i.test(f.name);});
  fs=fs.filter(function(f){return !/\.ntt$/i.test(f.name);});
  if(ntt.length){
    activate('tile'); say('Importing '+ntt.length+' NeoTile file'+(ntt.length>1?'s':'')+' into the Tile Editor…');
    await tool('tile').importNtt(ntt);
    say('NeoTile import done: '+tool('tile').summary()+'.');
    if(!fs.length) return;
  }
  say('Opening '+fs.length+' file'+(fs.length>1?'s':'')+'…');
  var res=[];
  for(var i=0;i<fs.length;i++) res.push(await openOne(fs[i]));
  var last=res.filter(function(r){return r.tab;}).pop();
  if(last) activate(last.tab);
  if(!$('kitName').value.trim()){ var nm=res.filter(function(r){return r.name;})[0]; if(nm) setName(nm.name); }
  var anySingle=res.some(function(r){return r.tab;});
  say(res.map(function(r){return r.msg;}).join(' ')+(anySingle?' Press Save project to keep everything in one combined file.':''));
}
$('kOpen').addEventListener('click',function(){ $('kFile').value=''; $('kFile').click(); });
$('kFile').addEventListener('change',function(){ var fs=Array.prototype.slice.call($('kFile').files||[]); $('kFile').value=''; openFiles(fs); });
window.addEventListener('dragover',function(ev){ ev.preventDefault(); });
window.addEventListener('drop',function(ev){
  ev.preventDefault();
  var fs=Array.prototype.slice.call((ev.dataTransfer&&ev.dataTransfer.files)||[]).filter(function(x){return /\.(json|ntt)$/i.test(x.name);});
  if(fs.length) openFiles(fs);
});

/* ----- new ----- */
$('kNew').addEventListener('click',async function(){
  var b=$('kNew');
  if(!newArmed){ newArmed=1; b.textContent='Confirm new project'; setTimeout(function(){ newArmed=0; b.textContent='New project'; },3500); return; }
  newArmed=0; b.textContent='New project';
  await allReady;
  for(var i=0;i<KEYS.length;i++) await tool(KEYS[i]).startNew();
  setName('');
  say('Started a new, empty project in all three tabs. (Each tab’s Undo can still bring back what was there.)');
});

/* ----- hand-offs between tabs (called from inside the tabs) ----- */
window.NGPC_KIT={
  activate:activate,
  save:save,
  openFiles:openFiles,
  sendToTile:async function(proj){
    await ready.tile; tool('tile').addProject(proj); activate('tile');
    say('Sent the voxel sprite sheet "'+(proj.name||'')+'" to the Tile Editor as a new project tab ('+proj.gridW+'×'+proj.gridH+' tiles, '+proj.layers.length+' layer'+(proj.layers.length===1?'':'s')+').');
  },
  sendToMap:async function(proj,name){
    await ready.map; activate('map');
    await tool('map').importTileset(proj,name);
    say('Sent "'+(proj.name||'')+'" to the Map Editor as its tileset.');
  }
};

/* ----- start ----- */
var first='tile'; try{ first=localStorage.getItem('ngpc-gfx-kit-tab')||'tile'; }catch(e){}
activate(first);
allReady.then(function(){ say('Pick a tab to work on. Save project (Ctrl+S) writes the tiles, map and voxel model into one file.'); });
})();
</script>
