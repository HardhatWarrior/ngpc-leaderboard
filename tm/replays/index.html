<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neo Turf Masters Replays</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#10162a; --panel:#181f3a; --panel2:#212a4d; --border:#37426e;
    --cream:#f4eedd; --dim:#93a0c9; --accent:#5c8fd6; --good:#4fbf8b; --danger:#e5615a;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--navy); color:var(--cream); font-family:"IBM Plex Sans",system-ui,sans-serif; padding:24px 16px; display:flex; justify-content:center; }
  .px{ font-family:"Press Start 2P","IBM Plex Mono",monospace; }
  #shell{ width:100%; max-width:760px; display:flex; flex-direction:column; gap:18px; }
  header{ background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:8px; }
  .eyebrow{ font-size:10px; line-height:1.7; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; }
  h1{ margin:0; font-size:clamp(16px,4.4vw,24px); line-height:1.3; }
  .sub{ font-size:13px; color:var(--dim); line-height:1.5; }
  a{ color:var(--accent); }
  .tabs{ display:flex; gap:6px; }
  .tabs button{ flex:1; }
  .tabs button.on{ background:var(--accent); color:#0a1830; border-color:var(--accent); font-weight:600; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  button{ font:inherit; font-size:13px; background:var(--panel2); color:var(--cream); border:1px solid var(--border); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover{ border-color:var(--accent); }
  button:disabled{ opacity:.5; cursor:default; }
  button.danger:hover{ border-color:var(--danger); color:var(--danger); }
  .row{ display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--panel2); }
  .row .info{ flex:1 1 220px; min-width:0; }
  .row .t{ font-size:14px; font-weight:600; }
  .row .t a{ color:var(--cream); text-decoration:none; } .row .t a:hover{ color:var(--accent); }
  .row .d{ font-size:12px; color:var(--dim); margin-top:2px; }
  .row .acts{ display:flex; flex-wrap:wrap; gap:6px; }
  .score{ font-weight:600; } .score.under{ color:var(--good); }
  .chip{ font-size:11px; border:1px solid var(--good); color:var(--good); border-radius:999px; padding:1px 8px; margin-left:6px; font-weight:500; }
  .empty{ font-size:13px; color:var(--dim); padding:8px 2px; }
  .msg{ font-size:13px; color:var(--dim); min-height:1em; }
  footer{ font-size:12px; color:var(--dim); text-align:center; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="eyebrow px">Neo Turf Masters</div>
    <h1 class="px">Hole replays</h1>
    <div class="sub">Scan a hole's QR from the scorecard to watch it, then save it here. You can keep up to 5 replays, download the real-game video, and share any of them to the public gallery. <a href="/tm/">Back to the leaderboard</a></div>
  </header>

  <div class="tabs">
    <button id="tab-mine" class="on">My replays</button>
    <button id="tab-gallery">Public gallery</button>
  </div>

  <section id="mine" class="panel">
    <div id="mine-list"></div>
    <div id="mine-msg" class="msg"></div>
  </section>

  <section id="gallery" class="panel" hidden>
    <div id="gal-list"><div class="empty">Loading&hellip;</div></div>
  </section>

  <footer>&copy; 2026 Neo Geo Pocket Homebrew - www.ngpc-dev.com</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="/auth.js"></script>
<script src="/tm/replay/replays.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => (window.NGPC_AUTH ? NGPC_AUTH.escapeHtml(String(s)) : String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'));
  const R = window.TMReplays;
  if (!window.NGPC_AUTH || !R) { $('mine-list').innerHTML = '<div class="empty">Could not load the site scripts.</div>'; return; }

  // tabs (remember the last one in the URL hash so the gallery link can be shared)
  function tab(which) {
    $('tab-mine').classList.toggle('on', which === 'mine'); $('tab-gallery').classList.toggle('on', which === 'gallery');
    $('mine').hidden = which !== 'mine'; $('gallery').hidden = which !== 'gallery';
    history.replaceState(null, '', which === 'gallery' ? '#gallery' : location.pathname);
    if (which === 'gallery') loadGallery();
  }
  $('tab-mine').onclick = () => tab('mine');
  $('tab-gallery').onclick = () => tab('gallery');

  function scoreHtml(s) {
    const lab = R.scoreLabel(s);
    const under = s.result === 'holed' && s.strokes && s.strokes < s.par;
    return '<span class="score' + (under ? ' under' : '') + '">' + esc(lab) + '</span>' +
      (s.result === 'holed' && s.strokes ? ' &middot; ' + s.strokes + ' stroke' + (s.strokes === 1 ? '' : 's') : '') + ' &middot; par ' + s.par;
  }
  const date = (t) => t ? new Date(t).toLocaleDateString() : '';

  // ---- my replays
  let me = null, busy = false;
  const msg = (t) => { $('mine-msg').textContent = t || ''; };
  function renderMine(slots) {
    const box = $('mine-list'); box.innerHTML = '';
    if (!me) {
      box.innerHTML = '<div class="empty">Sign in to see your saved replays.</div>';
      const b = document.createElement('button'); b.textContent = 'Sign in'; b.onclick = () => NGPC_AUTH.openSignInModal('signin');
      box.appendChild(b); return;
    }
    const head = document.createElement('div'); head.className = 'sub';
    head.textContent = slots.length + ' of ' + R.MAX + ' saved';
    box.appendChild(head);
    if (!slots.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'No saved replays yet. Open a hole replay from a scorecard QR and press "Save to my replays".';
      box.appendChild(e); return;
    }
    slots.forEach((s, i) => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<div class="info"><div class="t"><a href="' + R.replayHref(s.code) + '">' + esc(R.title(s)) + '</a>' +
        (s.shared ? '<span class="chip">In gallery</span>' : '') + '</div><div class="d">' + scoreHtml(s) + ' &middot; saved ' + date(s.savedAt) + '</div></div>';
      const acts = document.createElement('div'); acts.className = 'acts';
      const btn = (label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = () => run(fn); acts.appendChild(b); };
      btn('Download video', () => R.download(s.code, s, msg));
      btn(s.shared ? 'Remove from gallery' : 'Share to gallery', async () => { renderMine(s.shared ? await R.unshare(me, i) : await R.share(me, i)); msg(''); });
      btn('Delete', async () => {
        if (!confirm('Delete ' + R.title(s) + ' (' + R.scoreLabel(s) + ') from your replays?' + (s.shared ? ' It will also leave the gallery.' : ''))) return;
        renderMine(await R.remove(me, i)); msg('');
      }, 'danger');
      row.appendChild(acts); box.appendChild(row);
    });
  }
  async function run(fn) {
    if (busy) return; busy = true;
    document.querySelectorAll('#mine button').forEach(b => b.disabled = true);
    try { await fn(); } catch (e) { msg('Something went wrong (' + e.message + ').'); }
    busy = false;
    document.querySelectorAll('#mine button').forEach(b => b.disabled = false);
  }
  async function loadMine() {
    if (!me) { renderMine([]); return; }
    $('mine-list').innerHTML = '<div class="empty">Loading&hellip;</div>';
    try { renderMine(await R.load(me.uid)); } catch (e) { $('mine-list').innerHTML = '<div class="empty">Could not load your replays (' + esc(e.message) + ').</div>'; }
  }
  NGPC_AUTH.onAuthChange((u) => { me = u || null; loadMine(); });

  // ---- public gallery
  let galLoaded = false;
  async function loadGallery() {
    if (galLoaded) return; galLoaded = true;
    const box = $('gal-list');
    try {
      const items = await R.gallery(60);
      box.innerHTML = '';
      if (!items.length) { box.innerHTML = '<div class="empty">Nothing shared yet. Share one of your saved replays to start the gallery.</div>'; return; }
      for (const s of items) {
        const row = document.createElement('div'); row.className = 'row';
        row.innerHTML = '<div class="info"><div class="t"><a href="' + R.replayHref(s.code) + '">' + esc(R.title(s)) + '</a></div>' +
          '<div class="d">' + esc(s.username || '') + ' &middot; ' + scoreHtml(s) + ' &middot; ' + date(s.sharedAt) + '</div></div>';
        const acts = document.createElement('div'); acts.className = 'acts';
        const w = document.createElement('a'); w.href = R.replayHref(s.code); w.innerHTML = '<button>Watch</button>';
        acts.appendChild(w); row.appendChild(acts); box.appendChild(row);
      }
    } catch (e) { galLoaded = false; box.innerHTML = '<div class="empty">Could not load the gallery (' + esc(e.message) + ').</div>'; }
  }

  if (location.hash === '#gallery') tab('gallery');
})();
</script>
</body>
</html>
