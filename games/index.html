<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Single-Player Games</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --navy:#10162a;
    --panel:#181f3a;
    --panel2:#212a4d;
    --border:#37426e;
    --cream:#f4eedd;
    --dim:#93a0c9;
    --accent:#b23a52;
    --accent-ink:#fbeef1;
    --accent2:#5c8fd6;
    --good:#4fbf8b;
    --danger:#e5615a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:auto; }
  body{
    margin:0;
    background:var(--navy);
    color:var(--cream);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    padding-inline:20px;
    padding-block:32px;
    display:flex;
    justify-content:center;
  }
  .px{ font-family:"Press Start 2P",monospace; }

  #shell{ width:100%; max-width:960px; display:flex; flex-direction:column; gap:22px; }

  header{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  header h1{
    font-size:15px; margin:0; letter-spacing:1px; color:var(--accent2);
    text-shadow:2px 2px 0 var(--navy), 0 0 18px rgba(92,143,214,.35);
  }
  header p{ margin:0; color:var(--dim); font-size:13.5px; }

  #grid-status{ color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.1em; text-align:center; }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:16px;
  }

  /* Tile styles below are copied from index.html's own grid so a tile here looks identical to one
     on the main page -- the two pages have no shared stylesheet, same convention as every other
     page in this repo (each carries its own copy of the shared tokens/patterns). */
  .tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
  }
  a.tile{ transition:border-color .15s, transform .15s; }
  a.tile:hover, a.tile:focus-visible{ border-color:var(--accent2); transform:translateY(-2px); }
  a.tile:focus-visible{ outline:2px solid var(--accent2); outline-offset:2px; }
  a.tile.disabled{ cursor:default; }
  a.tile.disabled:hover, a.tile.disabled:focus-visible{ border-color:var(--border); transform:none; }

  .tile-art{
    background:#000;
    aspect-ratio:160/152;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tile-art img{
    width:100%; height:100%; object-fit:contain;
    image-rendering:pixelated;
  }

  .dev-banner{
    position:absolute; left:0; right:0; bottom:0;
    color:#fff;
    font-family:"Press Start 2P",monospace;
    font-size:9px;
    letter-spacing:.06em;
    text-align:center;
    padding:7px 4px;
    pointer-events:none;
  }
  .dev-banner.dev{ background:rgba(214,158,23,.85); }
  .dev-banner.beta{ background:rgba(92,143,214,.82); }

  .corner-badge{
    position:absolute; top:16px; left:-24px;
    transform:rotate(-35deg);
    width:140px; text-align:center;
    font-family:"Press Start 2P",monospace; font-size:8px; letter-spacing:.02em;
    padding:4px 0;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .corner-badge.coming-soon{ background:rgba(55,66,110,.92); color:#fff; font-size:7px; }
  .corner-badge.new{ background:var(--accent); color:var(--accent-ink); }
  .corner-badge.updated{ background:var(--good); color:#0a1f16; }

  .tile-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; }
  .tile-name{ font-size:13.5px; font-weight:700; color:var(--cream); display:flex; align-items:baseline; gap:6px; }
  .tile.disabled .tile-name{ color:var(--dim); opacity:.7; }
  .tile-version{ margin-left:auto; font-size:11px; font-weight:600; color:var(--dim); white-space:nowrap; }

  footer{ text-align:center; color:var(--dim); font-size:11px; }
  footer a{ color:var(--accent2); }
</style>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "33e146de507a4007bb50d3d54f01816b"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>

<div id="shell">
  <header>
    <h1 class="px">SINGLE-PLAYER GAMES</h1>
    <p>Games with no QR code or leaderboard &mdash; just pick one and play.</p>
  </header>

  <div id="grid-status">Loading&hellip;</div>
  <div id="grid">
    <!-- Populated live from games/{slug} docs flagged section:'solo' -- see loadGames() below. -->
  </div>

  <footer><a href="/">&larr; All games</a> &middot; &copy; 2026 Neo Geo Pocket Homebrew - www.ngpc-dev.com</footer>
</div>

<script src="/auth.js"></script>
<script>
(function(){
  "use strict";
  const el = (id)=>document.getElementById(id);
  const gridEl = el('grid');
  const statusEl = el('grid-status');

  // Same tile builder as index.html's buildTile(), minus the Most-Recent/Most-Active sort metadata
  // (data-game/data-added/data-pinned-at) that only that page's sort toggle reads. Solo games have
  // no `code` (no QR routing) and no leaderboard -- see the href logic below for where a tile goes.
  function buildTile(slug, data){
    const a = document.createElement('a');
    a.className = 'tile';
    const visibility = data.visibility || (data.active === false ? 'hidden' : 'active');
    if(data.devStatus === 'coming-soon' || visibility === 'inactive'){
      a.classList.add('disabled');
      a.setAttribute('aria-disabled', 'true');
    } else {
      // A solo game's tile opens its about page (games/about/) -- the same kind of landing page
      // every leaderboard game has, with Play / Download / Manual links -- not the player itself.
      // The stored leaderboardPath is only honored when it points somewhere else on purpose (e.g.
      // a QR game moved to this section keeps opening its own leaderboard); a missing one, or the
      // /play/solo/ path an earlier version of the add-game form stored, means "the about page".
      const stored = data.leaderboardPath;
      a.href = (!stored || stored.indexOf('/play/solo/') === 0) ? '/games/about/?g='+encodeURIComponent(slug) : stored;
    }

    const art = document.createElement('div');
    art.className = 'tile-art';
    const img = document.createElement('img');
    img.src = data.titleImage || '';
    img.alt = (data.name||slug)+' title screen';
    img.width = 160; img.height = 152;
    art.appendChild(img);

    if(data.devStatus === 'dev' || data.devStatus === 'beta'){
      const banner = document.createElement('div');
      banner.className = 'dev-banner ' + data.devStatus;
      banner.textContent = data.devStatus === 'beta' ? 'BETA' : 'IN DEVELOPMENT';
      art.appendChild(banner);
    }

    const now = Date.now();
    const ribbon = document.createElement('div');
    if(data.devStatus === 'coming-soon'){
      ribbon.className = 'corner-badge coming-soon'; ribbon.textContent = 'COMING SOON';
    } else if(data.newUntil && data.newUntil > now){
      ribbon.className = 'corner-badge new'; ribbon.textContent = 'NEW';
      a.dataset.badge = 'new';
    } else if(data.updatedUntil && data.updatedUntil > now){
      ribbon.className = 'corner-badge updated'; ribbon.textContent = 'UPDATED';
      a.dataset.badge = 'updated';
    }
    if(ribbon.className) art.appendChild(ribbon);

    const body = document.createElement('div');
    body.className = 'tile-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'tile-name';
    const nameTextEl = document.createElement('span');
    nameTextEl.textContent = data.name || slug;
    nameEl.appendChild(nameTextEl);
    if(data.showVersionOnTile && data.version){
      const versionEl = document.createElement('span');
      versionEl.className = 'tile-version';
      versionEl.textContent = data.version;
      nameEl.appendChild(versionEl);
    }
    body.appendChild(nameEl);

    a.appendChild(art);
    a.appendChild(body);
    return a;
  }

  async function loadGames(){
    const db = window.NGPC_AUTH ? NGPC_AUTH.db : null;
    if(!db){ statusEl.textContent = 'Games list is unavailable right now.'; return; }
    try{
      const snap = await db.collection('games').get();
      const games = [];
      snap.forEach(doc=>games.push(Object.assign({slug:doc.id}, doc.data())));
      const solo = games.filter(g=>g.section === 'solo' && (g.visibility || (g.active === false ? 'hidden' : 'active')) !== 'hidden');
      // NEW first, then UPDATED, then newest -- same ordering the main grid's default "Most
      // Recent" uses (minus its admin pin, which is a main-grid-only control).
      const rank = {new: 2, updated: 1};
      const tiles = solo.map(g=>({ g, tile: buildTile(g.slug, g) }));
      tiles.sort((x, y)=>{
        const rx = rank[x.tile.dataset.badge] || 0, ry = rank[y.tile.dataset.badge] || 0;
        if(rx !== ry) return ry - rx;
        return (y.g.romUpdatedAt || y.g.addedAt || 0) - (x.g.romUpdatedAt || x.g.addedAt || 0);
      });
      gridEl.innerHTML = '';
      tiles.forEach(t=>gridEl.appendChild(t.tile));
      statusEl.textContent = tiles.length ? '' : 'No single-player games yet.';
    }catch(e){
      statusEl.textContent = 'Couldn’t load the games list right now — try refreshing.';
    }
  }
  loadGames();
})();
</script>
</body>
</html>
