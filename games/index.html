<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGPC Games</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --navy:#10162a;
    --panel:#181f3a;
    --panel2:#212a4d;
    --border:#37426e;
    --cream:#f4eedd;
    --dim:#93a0c9;
    --accent:#b23a52;
    --accent-ink:#fbeef1;
    --accent2:#5c8fd6;
    --good:#4fbf8b;
    --danger:#e5615a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:auto; }
  body{
    margin:0;
    background:var(--navy);
    color:var(--cream);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    padding-inline:20px;
    padding-block:32px;
    display:flex;
    justify-content:center;
  }
  .px{ font-family:"Press Start 2P",monospace; }

  #shell{ width:100%; max-width:880px; display:flex; flex-direction:column; gap:26px; }

  header{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  header h1{
    font-size:15px; margin:0; letter-spacing:1px; color:var(--accent2);
    text-shadow:2px 2px 0 var(--navy), 0 0 18px rgba(92,143,214,.35);
  }
  header p{ margin:0; color:var(--dim); font-size:13.5px; }

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:16px;
  }

  /* Not a link yet -- see header note: these tiles are inert placeholders until the eventual
     selection UI is designed, unlike the main page's own clickable-tile grid. */
  .tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .tile-art{
    background:#000;
    aspect-ratio:160/152;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tile-art img{
    width:100%; height:100%; object-fit:contain;
    image-rendering:pixelated;
  }

  .tile-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; }
  .tile-name{ font-size:13.5px; font-weight:700; color:var(--cream); }

  footer{ text-align:center; color:var(--dim); font-size:11px; }
  footer a{ color:var(--accent2); }
</style>
</head>
<body>

<div id="shell">
  <header>
    <h1 class="px">GAMES</h1>
    <p>Not linked from the main site yet &mdash; tiles here will become selectable in a future update.</p>
  </header>

  <div id="grid">

    <div class="tile">
      <div class="tile-art">
        <img src="/assets/bowling-title.png" alt="Neo Bowling title screen" width="160" height="152">
      </div>
      <div class="tile-body">
        <div class="tile-name">Neo Bowling</div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-art">
        <img src="/assets/tetris-title.png" alt="Tetris title screen" width="160" height="152">
      </div>
      <div class="tile-body">
        <div class="tile-name">Tetris</div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-art">
        <img src="/assets/yahtzee-title.png" alt="Neo Yahtzee title screen" width="160" height="152">
      </div>
      <div class="tile-body">
        <div class="tile-name">Neo Yahtzee</div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-art">
        <img src="/assets/farkle-title.png" alt="Farkle title screen" width="160" height="152">
      </div>
      <div class="tile-body">
        <div class="tile-name">Farkle</div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-art">
        <img src="/assets/2048-title.png" alt="2048 title screen" width="160" height="152">
      </div>
      <div class="tile-body">
        <div class="tile-name">2048</div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-art">
        <img src="/assets/overrev-title.png" alt="Over Rev title screen" width="160" height="152">
      </div>
      <div class="tile-body">
        <div class="tile-name">Over Rev</div>
      </div>
    </div>

  </div>

  <footer>NGPC homebrew hiscore boards &mdash; fed by an on-device QR code after every completed game.</footer>
</div>

<script src="/auth.js"></script>
</body>
</html>
