<div>Redirecting&hellip;</div>
<script>
  /* This folder moved to /2k/ (its own 2-char QR game code). 2048's on-device QR was already
     a bare payload with no URL wrapper, so this move is web-side only -- no ROM rebuild needed.
     Kept as a plain redirect, not deleted, so an old bookmark/shared link to /2048/ still
     lands somewhere real; the hash payload (if any) carries straight through unchanged. */
  location.replace('/2k/' + location.hash);
</script>
